name: Apply audited v2 release repair from trusted main

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: >-
      github.repository == 'cfarkas/oncotracer' &&
      github.event.issue.title == '[oncotracer-release] apply audited v2 repair 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the exact release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-v2-parity
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify candidate and transport identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = f478006f289e5b379e02be23c86f0b0a0fb88b60
          test -s .release-fix/apply.py.gz.b64.00
          test -s .release-fix/apply.py.gz.b64.01
          test -s .release-fix/ichorcna_plot_compat.R

      - name: Reconstruct and authenticate the audited repair
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .release-fix/apply.py.gz.b64.00 \
              .release-fix/apply.py.gz.b64.01 \
            | base64 --decode \
            | gzip --decompress --stdout \
            > .release-fix/apply.py
          printf '%s  %s\n' \
            f636a913d730a9afb2f5d2edb4eea6220f2830d388a78ed0a1ed900af3f5abb5 \
            .release-fix/apply.py \
            | sha256sum --strict --check -
          printf '%s  %s\n' \
            a0a1d5b17fc4574c6354d01c9b913ad52f4751edb4df6b4af0753d617de5feea \
            .release-fix/ichorcna_plot_compat.R \
            | sha256sum --strict --check -
          python -m py_compile .release-fix/apply.py

      - name: Apply exact focused repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .release-fix/apply.py . \
            --allow-head-mismatch \
            --allow-dirty \
            --commit

      - name: Run focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_ichorcna_plot_compat.py
          python -m compileall -q oncotracer_cli tests scripts
          bash -n scripts/validate_v2_release.sh
          git diff --check HEAD^ HEAD

      - name: Remove one-shot transport and branch workflow files
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .release-fix
          rm -f .github/workflows/apply-v2-release-repair-v2.yml
          git add -A -- .release-fix .github/workflows/apply-v2-release-repair-v2.yml
          git commit -m 'chore(v2): remove one-shot release repair machinery'

      - name: Publish repaired candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin HEAD:agent/native-v2-parity

      - name: Record completion and close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repaired_sha="$(git rev-parse HEAD)"
          gh pr comment 27 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Applied and validated the checksum-verified v2 parity repair. Removed all one-shot branch transport/workflow files. Candidate head: \`$repaired_sha\`."
          gh issue close "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Audited v2 repair applied successfully to PR #27 at \`$repaired_sha\`."
