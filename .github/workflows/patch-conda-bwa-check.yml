name: Patch Conda BWA check

on:
  push:
    branches:
      - agent/conda-docs-v1.1
    paths:
      - ".github/workflows/patch-conda-bwa-check.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/conda-docs-v1.1
          fetch-depth: 0

      - name: Make the BWA help/version check pipefail-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/full-conda-quickstarts-v1.1.yml')
          text = path.read_text(encoding='utf-8')
          old = "          bwa 2>&1 | sed -n '1,3p'"
          new = "          (bwa 2>&1 || true) | sed -n '1,3p'"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one BWA check, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/patch-conda-bwa-check.yml
          grep -F "(bwa 2>&1 || true) | sed -n '1,3p'" \
            .github/workflows/full-conda-quickstarts-v1.1.yml

      - name: Commit the workflow fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/full-conda-quickstarts-v1.1.yml
          git commit -m "CI: make the BWA version check pipefail-safe"
          git push origin HEAD:agent/conda-docs-v1.1
