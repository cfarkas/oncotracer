name: Enable v1.1 branch validation

on:
  push:
    branches:
      - agent/conda-docs-v1.1
    paths:
      - ".github/workflows/enable-v1.1-branch-validation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the v1.1 branch
        uses: actions/checkout@v4
        with:
          ref: agent/conda-docs-v1.1
          fetch-depth: 0

      - name: Enable push validation on the feature branch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              ".github/workflows/ci.yml",
              ".github/workflows/full-conda-quickstarts-v1.1.yml",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              old = "push:\n    branches:\n      - main\n"
              new = "push:\n    branches:\n      - main\n      - agent/conda-docs-v1.1\n"
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected one push branch block, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git rm -- .github/workflows/enable-v1.1-branch-validation.yml

      - name: Commit branch validation triggers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/full-conda-quickstarts-v1.1.yml
          git commit -m "Run final v1.1 validation on the feature branch"
          git push origin HEAD:agent/conda-docs-v1.1
