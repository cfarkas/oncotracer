name: Native v2 QuickStart 2 parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-v2-quickstart2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  V1_1_COMMIT: 032c1268fa7fdcadc48087055066d7a9fc59bd89
  V1_DOCKER_IMAGE: carlosfarkas/oncotracer@sha256:4856aed020e1102f891b91de54d6acf365d6b8a57e2283a4f7b670b0bd5b07ed
  SAMURAI_COMMIT: 6a901940288b008237703c6b181d447e7dee4fcf
  NEXTFLOW_VERSION: 26.04.6
  NEXTFLOW_DIST_URL: https://github.com/nextflow-io/nextflow/releases/download/v26.04.6/nextflow-26.04.6-dist
  NEXTFLOW_DIST_SHA256: 182a63c74074e2dc7956ffa3c8cd59de952ed2c44394e21faf5e1736b945444c
  QDNASEQ_SOURCE_COMMIT: cf7c07e39de0ac64a9c38cb030cba4626e2aae83
  NXF_ANSI_LOG: "false"
  NXF_DISABLE_CHECK_LATEST: "true"
  NXF_OPTS: "-Xms256m -Xmx2g"
  NXF_GITHUB_TOKEN: ${{ github.token }}
  PIP_NO_CACHE_DIR: "1"
  XDG_CONFIG_HOME: /tmp/oncotracer-v2-config
  ONCOTRACER_PAYLOAD_CACHE: /tmp/oncotracer-v2-payload
  V2_ENV_PREFIX: /tmp/oncotracer-v2-envs
  TEST_ROOT: ${{ github.workspace }}/parity-quickstart2
  INPUT_ROOT: ${{ github.workspace }}/parity-quickstart2/input
  PINNED_NEXTFLOW_DIR: ${{ github.workspace }}/parity-quickstart2/.release-tools/bin

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out candidate v2
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          path: v2
      - name: Check out frozen v1.1 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V1_1_COMMIT }}
          fetch-depth: 0
          path: v1
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate: true
          conda-remove-defaults: true
      - name: Install v1.1 host prerequisites and comparator
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samtools bwa minimap2 pigz curl wget git
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/nextflow-$NEXTFLOW_VERSION-dist" \
            "$NEXTFLOW_DIST_URL"
          printf '%s  %s\n' "$NEXTFLOW_DIST_SHA256" \
            "$RUNNER_TEMP/nextflow-$NEXTFLOW_VERSION-dist" \
            | sha256sum --strict -c -
          mkdir -p "$PINNED_NEXTFLOW_DIR"
          install -m 0755 "$RUNNER_TEMP/nextflow-$NEXTFLOW_VERSION-dist" \
            "$PINNED_NEXTFLOW_DIR/nextflow"
          printf '%s  %s\n' "$NEXTFLOW_DIST_SHA256" "$PINNED_NEXTFLOW_DIR/nextflow" \
            | sha256sum --strict -c -
          "$PINNED_NEXTFLOW_DIR/nextflow" -version 2>&1 \
            | tee "$RUNNER_TEMP/nextflow-version.txt"
          grep -E "version[[:space:]]+$NEXTFLOW_VERSION([[:space:]]|$)" \
            "$RUNNER_TEMP/nextflow-version.txt"
          printf 'version=%s\nurl=%s\nsha256=%s\n' \
            "$NEXTFLOW_VERSION" "$NEXTFLOW_DIST_URL" "$NEXTFLOW_DIST_SHA256" \
            > "$RUNNER_TEMP/nextflow-identity.txt"
          docker info
          docker pull "$V1_DOCKER_IMAGE"
          docker image inspect "$V1_DOCKER_IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | tee "$RUNNER_TEMP/v1-docker-repodigests.txt"
          grep -Fx "$V1_DOCKER_IMAGE" "$RUNNER_TEMP/v1-docker-repodigests.txt"
          printf '%s\n' "$V1_DOCKER_IMAGE" | tee "$RUNNER_TEMP/v1-docker-digest.txt"
      - name: Add addressable-memory headroom
        run: |
          sudo fallocate -l 32G /swapfile.oncotracer-v2
          sudo chmod 600 /swapfile.oncotracer-v2
          sudo mkswap /swapfile.oncotracer-v2
          sudo swapon /swapfile.oncotracer-v2 || true
          sudo sysctl -w vm.swappiness=100 || true
          free -h
          df -h
      - name: Build copied v2 executable and install native Conda backend
        working-directory: v2
        run: |
          set -Eeuo pipefail
          conda config --set channel_priority strict
          conda config --set solver libmamba
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "$CANDIDATE_SHA"
          SOURCE_SHA256="$(git -c tar.umask=0002 archive --format=tar "$SOURCE_COMMIT" | sha256sum | awk '{print $1}')"
          printf '%s\n' "$SOURCE_COMMIT" | tee "$RUNNER_TEMP/v2-source-commit.txt"
          printf '%s\n' "$SOURCE_SHA256" | tee "$RUNNER_TEMP/v2-source-sha256.txt"
          python3 scripts/build_native_binary.py \
            --output dist/oncotracer \
            --source-commit "$SOURCE_COMMIT" \
            --source-sha256 "$SOURCE_SHA256"
          chmod 0755 dist/oncotracer
          dist/oncotracer --version
          sha256sum dist/oncotracer | tee "$RUNNER_TEMP/native-binary.sha256"
          dist/oncotracer provenance --json \
            > "$RUNNER_TEMP/native-binary-provenance.json"
          jq -e --arg commit "$SOURCE_COMMIT" --arg sha256 "$SOURCE_SHA256" \
            '.source_commit == $commit and .source_sha256 == $sha256 and
             .source_tree_dirty == false' \
            "$RUNNER_TEMP/native-binary-provenance.json"
          cat "$RUNNER_TEMP/native-binary-provenance.json"
          V1_BASELINE_COMMIT="$(git -C "$GITHUB_WORKSPACE/v1" rev-parse HEAD)"
          test "$V1_BASELINE_COMMIT" = "$V1_1_COMMIT"
          V1_TAG_COMMIT="$(git -C "$GITHUB_WORKSPACE/v1" rev-list -n 1 v1.1)"
          test "$V1_TAG_COMMIT" = "$V1_1_COMMIT"
          printf '%s\n' "$V1_BASELINE_COMMIT" | tee "$RUNNER_TEMP/v1-baseline-commit.txt"
          printf '%s\n' "$V1_TAG_COMMIT" | tee "$RUNNER_TEMP/v1-tag-commit.txt"
          dist/oncotracer install --conda --prefix "$V2_ENV_PREFIX" \
            > "$RUNNER_TEMP/native-install.json" \
            2> "$RUNNER_TEMP/native-install.stderr.log"
          jq -e '.backend == "conda"' "$RUNNER_TEMP/native-install.json"
          cat "$RUNNER_TEMP/native-install.json"
          dist/oncotracer doctor --backend conda \
            > "$RUNNER_TEMP/native-doctor.json" \
            2> "$RUNNER_TEMP/native-doctor.stderr.log"
          jq -e '.success == true' "$RUNNER_TEMP/native-doctor.json"
          cat "$RUNNER_TEMP/native-doctor.json"
          for name in core qdnaseq ichorcna classifier gistic; do
            conda list --explicit --prefix "$V2_ENV_PREFIX/$name" \
              > "$RUNNER_TEMP/native-${name}.explicit.txt"
          done
      - name: Download and validate all six HCC1143 FASTQs
        run: |
          set -Eeuo pipefail
          mkdir -p "$TEST_ROOT/configs" "$TEST_ROOT/reports"
          "$GITHUB_WORKSPACE/v2/dist/oncotracer" quickstart 2 \
            --test-root "$INPUT_ROOT" --download-only
          python3 "$GITHUB_WORKSPACE/v2/tests/make_parity_config.py" \
            --source "$INPUT_ROOT/configs/hcc1143_lpwgs/illumina.auto.yml" \
            --destination "$TEST_ROOT/configs/v1-hcc1143.yml" \
            --lpwgs-root "$TEST_ROOT" \
            --outdir "$TEST_ROOT/v1/hcc1143"
          python3 "$GITHUB_WORKSPACE/v2/tests/make_parity_config.py" \
            --source "$INPUT_ROOT/configs/hcc1143_lpwgs/illumina.auto.yml" \
            --destination "$TEST_ROOT/configs/v2-hcc1143.yml" \
            --lpwgs-root "$TEST_ROOT" \
            --outdir "$TEST_ROOT/v2/hcc1143"
      - name: Pin and instrument nested v1.1 SAMURAI execution
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/samurai-container-pins.tsv" <<'EOF'
          container	manifest_digest
          quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0	sha256:e194048df39c3145d9b4e0a14f4da20b59d59250465b6f2a9cb698445fd45900
          community.wave.seqera.io/library/bwa_htslib_samtools:83b50ff84ead50d0	sha256:48812e48a9462145c065d1b8e15d996c4a2c4c69469f1249fb601f25939cd48e
          community.wave.seqera.io/library/picard:3.4.0--e9963040df0a9bf6	sha256:e269216786463d44f9d83a0d6e877b34bca2c7b4d35211b4b369fe98e39ef1a5
          quay.io/biocontainers/samtools:1.22.1--h96c455f_0	sha256:23dc2c29f457a448a0d341fb97b2632a2c8004925214cb6420562a5b12adf8a2
          quay.io/dincalcilab/qdnaseq:1.30.0-a28ebc1	sha256:fb6135876beca3059ed1414d5082833d5bbf1fb3f0f64e51ca8b29fb47adaa75
          docker.io/t0shy/qpdf-docker:11.3.0	sha256:744f00189f4b0f3f1273073212102b32e0505fea528c9516e4252b9345e482d3
          community.wave.seqera.io/library/multiqc:1.32--d58f60e4deb769bf	sha256:677f4c8e38cfd741926e5bd1e80d96b756540bc6a9e9c5ed520aa7a98358d11d
          EOF
          test "$(wc -l < "$RUNNER_TEMP/samurai-container-pins.tsv")" -eq 8
          printf 'container\tmanifest_digest\timage_id\n' \
            > "$RUNNER_TEMP/samurai-container-preflight.tsv"
          while IFS=$'\t' read -r container digest; do
            [[ "$container" == container ]] && continue
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            repository="${container%:*}"
            immutable="$repository@$digest"
            docker pull "$immutable"
            expected_id="$(docker image inspect "$immutable" --format '{{.Id}}')"
            if docker image inspect "$container" >/dev/null 2>&1; then
              existing_id="$(docker image inspect "$container" --format '{{.Id}}')"
              test "$existing_id" = "$expected_id" || {
                echo "mutable SAMURAI tag $container already resolves to unexpected $existing_id" >&2
                exit 1
              }
            else
              docker tag "$immutable" "$container"
            fi
            observed_id="$(docker image inspect "$container" --format '{{.Id}}')"
            test "$observed_id" = "$expected_id"
            docker image inspect "$container" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | grep -E "@${digest}$"
            printf '%s\t%s\t%s\n' "$container" "$digest" "$observed_id" \
              >> "$RUNNER_TEMP/samurai-container-preflight.tsv"
          done < "$RUNNER_TEMP/samurai-container-pins.tsv"

          cat > "$TEST_ROOT/configs/v1-pinned-nextflow.config" <<EOF
          process {
            withName: RUN_ILLUMINA_SAMURAI {
              env.PATH = '$PINNED_NEXTFLOW_DIR:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
            }
          }
          EOF
          nested_home="$TEST_ROOT/v1/hcc1143/01_samurai_illumina/.nextflow"
          mkdir -p "$nested_home"
          cat > "$nested_home/config" <<'EOF'
          process {
            resourceLimits = [cpus: 4, memory: '14.GB', time: '6.h']
          }
          conda { useMamba = false }
          trace.fields = 'task_id,hash,name,status,exit,container'
          EOF
      - name: Run complete frozen v1.1 HCC1143 baseline
        run: |
          set -Eeuo pipefail
          env PATH="$PINNED_NEXTFLOW_DIR:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "$PINNED_NEXTFLOW_DIR/nextflow" run "$GITHUB_WORKSPACE/v1/main.nf" \
            -c "$TEST_ROOT/configs/v1-pinned-nextflow.config" --docker \
            --docker_image "$V1_DOCKER_IMAGE" \
            -params-file "$TEST_ROOT/configs/v1-hcc1143.yml" \
            -work-dir "$TEST_ROOT/work/v1-hcc1143" \
            -with-report "$TEST_ROOT/reports/v1-hcc1143.html" \
            -with-trace "$TEST_ROOT/reports/v1-hcc1143.tsv" \
            -resume 2>&1 | tee "$TEST_ROOT/reports/v1-hcc1143.log"
          SAMURAI_SOURCE="$TEST_ROOT/.oncotracer/samurai/v1.4.0"
          test -s "$SAMURAI_SOURCE/.oncotracer-source"
          test "$(git -C "$SAMURAI_SOURCE" rev-parse HEAD)" = "$SAMURAI_COMMIT"
          grep -Fx 'revision=v1.4.0' "$SAMURAI_SOURCE/.oncotracer-source"
          grep -Fx "commit=$SAMURAI_COMMIT" "$SAMURAI_SOURCE/.oncotracer-source"
          cp "$SAMURAI_SOURCE/.oncotracer-source" "$RUNNER_TEMP/samurai.oncotracer-source"
      - name: Verify nested SAMURAI process and container provenance
        run: |
          set -Eeuo pipefail
          python3 - \
            "$RUNNER_TEMP/samurai-container-pins.tsv" \
            "$RUNNER_TEMP/samurai-container-runtime.tsv" \
            "$TEST_ROOT/v1/hcc1143/01_samurai_illumina" <<'PY'
          import csv
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          pins_path, runtime_path, root = map(Path, sys.argv[1:])
          rows = list(csv.reader(pins_path.open(newline='', encoding='utf-8'), delimiter='\t'))
          if not rows or rows[0] != ['container', 'manifest_digest']:
              raise SystemExit('invalid SAMURAI container pin manifest')
          pins = dict(rows[1:])
          if len(pins) != 7 or len(rows) != 8:
              raise SystemExit('QuickStart 2 must pin exactly seven unique reachable SAMURAI images')
          expected_processes = {
              'SAMURAI:FASTQ_TRIM_FASTP_FASTQC:FASTQC_RAW',
              'SAMURAI:FASTQ_ALIGN_DNA:BWAMEM1_MEM',
              'SAMURAI:BAM_MARKDUPLICATES_PICARD:PICARD_MARKDUPLICATES',
              'SAMURAI:BAM_MARKDUPLICATES_PICARD:SAMTOOLS_INDEX',
              'SAMURAI:BAM_MARKDUPLICATES_PICARD:BAM_STATS_SAMTOOLS:SAMTOOLS_STATS',
              'SAMURAI:BAM_MARKDUPLICATES_PICARD:BAM_STATS_SAMTOOLS:SAMTOOLS_FLAGSTAT',
              'SAMURAI:BAM_MARKDUPLICATES_PICARD:BAM_STATS_SAMTOOLS:SAMTOOLS_IDXSTATS',
              'SAMURAI:BAM_QC_PICARD:PICARD_COLLECTMULTIPLEMETRICS',
              'SAMURAI:BAM_QC_PICARD:PICARD_COLLECTWGSMETRICS',
              'SAMURAI:SOLID_BIOPSY:QDNASEQ',
              'SAMURAI:SOLID_BIOPSY:CONCATENATE_QDNASEQ_PLOTS',
              'SAMURAI:MULTIQC',
          }

          def normalize_process(name: str) -> str:
              name = re.sub(r'\s+\([^()]*(?:\([^()]*\)[^()]*)*\)$', '', name.strip())
              if ':SAMURAI:' in name:
                  name = 'SAMURAI:' + name.rsplit(':SAMURAI:', 1)[1]
              return name

          def normalize_container(value: str) -> str:
              value = value.strip().removeprefix('docker://')
              supplied_digest = None
              if '@sha256:' in value:
                  value, supplied_digest = value.rsplit('@', 1)
              if value.startswith('biocontainers/'):
                  value = 'quay.io/' + value
              elif value.startswith('t0shy/qpdf-docker:'):
                  value = 'docker.io/' + value
              if value not in pins:
                  raise SystemExit(f'unexpected nested SAMURAI container: {value}')
              if supplied_digest is not None and supplied_digest != pins[value]:
                  raise SystemExit(f'nested trace digest disagrees with pin for {value}')
              return value

          traces = sorted(root.rglob('pipeline_info/execution_trace_*.txt'))
          if len(traces) != 1:
              raise SystemExit(f'QuickStart 2 must have exactly one nested SAMURAI trace; found {traces!r}')
          with traces[0].open(newline='', encoding='utf-8') as handle:
              trace_rows = list(csv.DictReader(handle, delimiter='\t'))
          required = {'name', 'status', 'exit', 'container'}
          if not trace_rows or not required <= set(trace_rows[0]):
              raise SystemExit(f'QuickStart 2 nested trace lacks {required!r}')
          if len(trace_rows) != 32:
              raise SystemExit(f'QuickStart 2 expected 32 trace rows, found {len(trace_rows)}')
          if any(row['status'] not in {'COMPLETED', 'CACHED'} or row['exit'] != '0'
                 or not row['container'].strip() for row in trace_rows):
              raise SystemExit('QuickStart 2 has failed, nonzero, or container-free nested tasks')
          processes = {normalize_process(row['name']) for row in trace_rows}
          images = {normalize_container(row['container']) for row in trace_rows}
          if processes != expected_processes:
              raise SystemExit(f'QuickStart 2 process set mismatch: {processes ^ expected_processes!r}')
          if images != set(pins):
              raise SystemExit(f'QuickStart 2 container set mismatch: {images ^ set(pins)!r}')

          runtime = ['run\tcontainer\tmanifest_digest\timage_id']
          for container in sorted(images):
              digest = pins[container]
              repository = container.rsplit(':', 1)[0]
              image_id = subprocess.check_output(
                  ['docker', 'image', 'inspect', container, '--format', '{{.Id}}'], text=True).strip()
              immutable_id = subprocess.check_output(
                  ['docker', 'image', 'inspect', f'{repository}@{digest}', '--format', '{{.Id}}'],
                  text=True).strip()
              if image_id != immutable_id or not re.fullmatch(r'sha256:[0-9a-f]{64}', image_id):
                  raise SystemExit(f'{container} is not bound to pinned {digest}')
              repo_digests = json.loads(subprocess.check_output(
                  ['docker', 'image', 'inspect', container, '--format', '{{json .RepoDigests}}'],
                  text=True))
              if not any(item.endswith('@' + digest) for item in repo_digests):
                  raise SystemExit(f'{container} lacks expected RepoDigest {digest}')
              runtime.append(f'quickstart2-hcc1143\t{container}\t{digest}\t{image_id}')
          runtime_path.write_text('\n'.join(runtime) + '\n', encoding='utf-8')
          PY
      - name: Run complete copied native v2 HCC1143 analysis
        run: |
          set -Eeuo pipefail
          "$GITHUB_WORKSPACE/v2/dist/oncotracer" run --backend conda \
            --config "$TEST_ROOT/configs/v2-hcc1143.yml" --threads 4 \
            2>&1 | tee "$TEST_ROOT/reports/v2-hcc1143.log"
      - name: Produce semantic HCC1143 parity record
        run: |
          set -Eeuo pipefail
          python3 "$GITHUB_WORKSPACE/v2/tests/compare_native_parity.py" \
            --v1 "$TEST_ROOT/v1/hcc1143" \
            --v2 "$TEST_ROOT/v2/hcc1143" \
            --outdir "$TEST_ROOT/audit" \
            --label "QuickStart 2 / HCC1143" \
            --expected-samples HCC1143_DMSO,HCC1143_BEZ235,HCC1143_TRAMETINIB
          grep -ni nextflow "$TEST_ROOT/v2/hcc1143/.oncotracer-native/trace.tsv" && exit 1 || true
      - name: Collect audit context
        if: always()
        run: |
          set +e
          mkdir -p "$TEST_ROOT/audit/context"
          printf '%s\n' "$GITHUB_SHA" > "$TEST_ROOT/audit/context/workflow-event-sha.txt"
          printf '%s\n' "$CANDIDATE_SHA" > "$TEST_ROOT/audit/context/validated-candidate-sha.txt"
          cp "$RUNNER_TEMP/v1-docker-digest.txt" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/v1-docker-repodigests.txt" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/native-install.json" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/native-install.stderr.log" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/native-doctor.json" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/native-doctor.stderr.log" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/native-binary.sha256" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/native-binary-provenance.json" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/v1-baseline-commit.txt" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/v2-source-commit.txt" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/v2-source-sha256.txt" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP"/native-*.explicit.txt "$TEST_ROOT/audit/context/" || true
          cp "$TEST_ROOT/configs"/*.yml "$TEST_ROOT/audit/context/" || true
          cp "$INPUT_ROOT/configs/hcc1143_lpwgs"/* "$TEST_ROOT/audit/context/" || true
          find "$INPUT_ROOT/public/hcc1143_lpwgs" -type f -name '*.fastq.gz' -print0 2>/dev/null \
            | sort -z | xargs -0 -r sha256sum \
            > "$TEST_ROOT/audit/context/public-fastq-SHA256SUMS" || true
          cp "$TEST_ROOT/v1/hcc1143/06_workflow_summary/workflow_summary.txt" "$TEST_ROOT/audit/context/v1-summary.txt" || true
          cp "$TEST_ROOT/v2/hcc1143/.oncotracer-native/trace.tsv" "$TEST_ROOT/audit/context/v2-trace.tsv" || true
          cp "$INPUT_ROOT/public/hcc1143_lpwgs/samples.csv" "$TEST_ROOT/audit/context/" || true
          mkdir -p \
            "$TEST_ROOT/audit/context/configs/parity" \
            "$TEST_ROOT/audit/context/configs/input" \
            "$TEST_ROOT/audit/context/qdnaseq-annotation" \
            "$TEST_ROOT/audit/context/manifests"
          cp "$RUNNER_TEMP/v1-tag-commit.txt" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/nextflow-version.txt" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/nextflow-identity.txt" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/samurai.oncotracer-source" "$TEST_ROOT/audit/context/" || true
          cp "$RUNNER_TEMP/samurai-container-pins.tsv" \
            "$TEST_ROOT/audit/context/nested-v1-container-pins.tsv" || true
          cp "$RUNNER_TEMP/samurai-container-preflight.tsv" \
            "$TEST_ROOT/audit/context/nested-v1-container-preflight.tsv" || true
          cp "$RUNNER_TEMP/samurai-container-runtime.tsv" \
            "$TEST_ROOT/audit/context/nested-v1-container-runtime.tsv" || true
          cp "$TEST_ROOT/configs/v1-pinned-nextflow.config" \
            "$TEST_ROOT/audit/context/v1-pinned-nextflow.config" || true
          cp "$TEST_ROOT/v1/hcc1143/01_samurai_illumina/.nextflow/config" \
            "$TEST_ROOT/audit/context/nested-v1-hcc1143-nextflow.config" || true
          hcc_nested_trace="$(find "$TEST_ROOT/v1/hcc1143/01_samurai_illumina" \
            -type f -path '*/pipeline_info/execution_trace_*.txt' -print | sort)"
          [[ -n "$hcc_nested_trace" ]] && cp "$hcc_nested_trace" \
            "$TEST_ROOT/audit/context/nested-v1-hcc1143-trace.tsv"
          cp "$TEST_ROOT/v1/hcc1143/01_samurai_illumina/nextflow_launch/.nextflow.log" \
            "$TEST_ROOT/audit/context/nested-v1-hcc1143-nextflow.log" || true
          cp "$TEST_ROOT/configs"/*.yml "$TEST_ROOT/audit/context/configs/parity/" || true
          cp "$INPUT_ROOT/configs/hcc1143_lpwgs"/* \
            "$TEST_ROOT/audit/context/configs/input/" || true
          cp "$TEST_ROOT/v2/hcc1143/06_workflow_summary/workflow_summary.txt" \
            "$TEST_ROOT/audit/context/v2-summary.txt" || true
          cp "$TEST_ROOT/reports/v1-hcc1143.tsv" \
            "$TEST_ROOT/audit/context/v1-trace.tsv" || true
          cp -a "$TEST_ROOT/.oncotracer/qdnaseq-bin-data/." \
            "$TEST_ROOT/audit/context/qdnaseq-annotation/" || true
          python3 - \
            "$INPUT_ROOT/public/hcc1143_lpwgs" \
            "$TEST_ROOT/audit/context/manifests/public-input-manifest.tsv" \
            "$TEST_ROOT/references/samurai_hg38" \
            "$TEST_ROOT/audit/context/manifests/shared-reference-manifest.tsv" \
            "$TEST_ROOT/.oncotracer/qdnaseq-bin-data" \
            "$TEST_ROOT/audit/context/manifests/qdnaseq-annotation-manifest.tsv" \
            "$TEST_ROOT/v1/hcc1143" \
            "$TEST_ROOT/audit/context/manifests/v1-hcc1143-output-manifest.tsv" \
            "$TEST_ROOT/v2/hcc1143" \
            "$TEST_ROOT/audit/context/manifests/v2-hcc1143-output-manifest.tsv" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open('rb') as handle:
                  while chunk := handle.read(8 * 1024 * 1024):
                      value.update(chunk)
              return value.hexdigest()

          arguments = [Path(value) for value in sys.argv[1:]]
          if len(arguments) % 2:
              raise SystemExit('manifest arguments must be ROOT/DESTINATION pairs')
          for root, destination in zip(arguments[::2], arguments[1::2], strict=True):
              if not root.is_dir():
                  raise SystemExit(f'manifest root is missing: {root}')
              rows = ['sha256\tbytes\tpath']
              for path in sorted(item for item in root.rglob('*') if item.is_file()):
                  relative = path.relative_to(root).as_posix()
                  if '\n' in relative or '\t' in relative or relative.startswith('/'):
                      raise SystemExit(f'unsafe manifest path: {relative!r}')
                  rows.append(f'{digest(path)}\t{path.stat().st_size}\t{relative}')
              if len(rows) == 1:
                  raise SystemExit(f'manifest root has no files: {root}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          true
          cp "$GITHUB_WORKSPACE/v2/examples/hcc1143_lpwgs/manifest.tsv" "$TEST_ROOT/audit/context/" || true
      - name: Finalize complete audit checksums
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['TEST_ROOT']) / 'audit'
          root.mkdir(parents=True, exist_ok=True)
          rows = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS':
                  rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root / 'SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - name: Enforce complete QuickStart 2 audit gate
        if: always()
        run: |
          set -Eeuo pipefail
          test -s "$TEST_ROOT/audit/SHA256SUMS"
          (cd "$TEST_ROOT/audit" && sha256sum --strict -c SHA256SUMS)
          for environment in core qdnaseq ichorcna classifier gistic; do
            test -s "$TEST_ROOT/audit/context/native-$environment.explicit.txt"
          done
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ['TEST_ROOT'])
          audit = root / 'audit'
          context = audit / 'context'
          manifests = context / 'manifests'

          def require_file(path: Path) -> Path:
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f'missing or empty audit file: {path}')
              return path

          def sha256(path: Path) -> str:
              value = hashlib.sha256()
              with path.open('rb') as handle:
                  while chunk := handle.read(8 * 1024 * 1024):
                      value.update(chunk)
              return value.hexdigest()

          def verify_manifest(tree: Path, manifest: Path) -> list[tuple[str, int, str]]:
              require_file(manifest)
              rows = list(csv.reader(manifest.open(newline='', encoding='utf-8'), delimiter='\t'))
              if not rows or rows[0] != ['sha256', 'bytes', 'path'] or len(rows) < 2:
                  raise SystemExit(f'invalid tree-manifest header or empty tree: {manifest}')
              records: list[tuple[str, int, str]] = []
              seen: set[str] = set()
              for row in rows[1:]:
                  if len(row) != 3:
                      raise SystemExit(f'invalid tree-manifest row: {row!r}')
                  digest, size_text, relative = row
                  if not re.fullmatch(r'[0-9a-f]{64}', digest):
                      raise SystemExit(f'invalid manifest digest: {digest!r}')
                  if relative in seen or relative.startswith('/') or '..' in Path(relative).parts:
                      raise SystemExit(f'unsafe or duplicate manifest path: {relative!r}')
                  seen.add(relative)
                  path = tree / relative
                  require_file(path)
                  size = int(size_text)
                  if path.stat().st_size != size or sha256(path) != digest:
                      raise SystemExit(f'manifest mismatch: {path}')
                  records.append((digest, size, relative))
              actual = sorted(
                  item.relative_to(tree).as_posix()
                  for item in tree.rglob('*') if item.is_file()
              )
              if sorted(seen) != actual:
                  raise SystemExit(f'manifest is not a complete inventory of {tree}')
              return records

          report = json.loads(require_file(audit / 'parity_report.json').read_text())
          expected_samples = sorted([
              'HCC1143_DMSO', 'HCC1143_BEZ235', 'HCC1143_TRAMETINIB',
          ])
          if report.get('label') != 'QuickStart 2 / HCC1143' or report.get('passed') is not True:
              raise SystemExit('QuickStart 2 parity report failed or is mislabeled')
          checks = report.get('checks', {})
          if not checks or not all(value is True for value in checks.values()):
              raise SystemExit(f'failed HCC1143 parity checks: {checks!r}')
          if report.get('v1_samples') != expected_samples or report.get('v2_samples') != expected_samples:
              raise SystemExit('HCC1143 sample set is not exact')
          for summary_name in ('v1_summary', 'v2_summary'):
              summary = report.get(summary_name, {})
              if summary.get('mode') != 'illumina' or summary.get('dataset') != 'illumina_qdnaseq_100kb':
                  raise SystemExit(f'unexpected {summary_name} identity: {summary!r}')
          if report.get('v2_summary', {}).get('engine') != 'native':
              raise SystemExit('HCC1143 v2 summary did not use the native engine')
          if str(report.get('v2_summary', {}).get('nextflow_used', '')).lower() != 'false':
              raise SystemExit('HCC1143 v2 summary reports Nextflow use')

          for filename in ('v1-baseline-commit.txt', 'v1-tag-commit.txt'):
              if require_file(context / filename).read_text().strip() != os.environ['V1_1_COMMIT']:
                  raise SystemExit(f'v1.1 identity mismatch: {filename}')
          nextflow = dict(
              line.split('=', 1) for line in
              require_file(context / 'nextflow-identity.txt').read_text().splitlines()
          )
          if nextflow != {
              'version': os.environ['NEXTFLOW_VERSION'],
              'url': os.environ['NEXTFLOW_DIST_URL'],
              'sha256': os.environ['NEXTFLOW_DIST_SHA256'],
          }:
              raise SystemExit(f'Nextflow identity mismatch: {nextflow!r}')
          if f"version {os.environ['NEXTFLOW_VERSION']}" not in require_file(context / 'nextflow-version.txt').read_text():
              raise SystemExit('Nextflow version output does not contain the pinned version')
          samurai = dict(
              line.split('=', 1) for line in
              require_file(context / 'samurai.oncotracer-source').read_text().splitlines()
          )
          if samurai.get('revision') != 'v1.4.0' or samurai.get('commit') != os.environ['SAMURAI_COMMIT']:
              raise SystemExit(f'SAMURAI identity mismatch: {samurai!r}')
          def read_tsv(path: Path) -> list[list[str]]:
              return list(csv.reader(require_file(path).open(newline='', encoding='utf-8'), delimiter='\t'))

          pin_rows = read_tsv(context / 'nested-v1-container-pins.tsv')
          if pin_rows[0] != ['container', 'manifest_digest'] or len(pin_rows) != 8:
              raise SystemExit('QuickStart 2 must contain exactly seven nested SAMURAI image pins')
          pins = dict(pin_rows[1:])
          if len(pins) != 7 or any(not re.fullmatch(r'sha256:[0-9a-f]{64}', value) for value in pins.values()):
              raise SystemExit('invalid or duplicate QuickStart 2 nested SAMURAI image pins')
          preflight_rows = read_tsv(context / 'nested-v1-container-preflight.tsv')
          if preflight_rows[0] != ['container', 'manifest_digest', 'image_id'] or len(preflight_rows) != 8:
              raise SystemExit('invalid QuickStart 2 nested image preflight manifest')
          for container, digest, image_id in preflight_rows[1:]:
              if pins.get(container) != digest or not re.fullmatch(r'sha256:[0-9a-f]{64}', image_id):
                  raise SystemExit(f'invalid preflight identity for {container}')
          runtime_rows = read_tsv(context / 'nested-v1-container-runtime.tsv')
          if runtime_rows[0] != ['run', 'container', 'manifest_digest', 'image_id'] or len(runtime_rows) != 8:
              raise SystemExit('invalid QuickStart 2 nested image runtime manifest')
          if {row[1] for row in runtime_rows[1:]} != set(pins):
              raise SystemExit('QuickStart 2 nested runtime image inventory is incomplete')
          for run, container, digest, image_id in runtime_rows[1:]:
              if (run != 'quickstart2-hcc1143' or pins.get(container) != digest or
                      not re.fullmatch(r'sha256:[0-9a-f]{64}', image_id)):
                  raise SystemExit(f'invalid runtime identity for {container}')
          trace_rows = list(csv.DictReader(require_file(
              context / 'nested-v1-hcc1143-trace.tsv').open(
                  newline='', encoding='utf-8'), delimiter='\t'))
          if len(trace_rows) != 32 or not trace_rows:
              raise SystemExit('QuickStart 2 nested trace row count is not exactly 32')
          if not {'name', 'status', 'exit', 'container'} <= set(trace_rows[0]):
              raise SystemExit('QuickStart 2 nested trace lacks required columns')
          if any(row['status'] not in {'COMPLETED', 'CACHED'} or row['exit'] != '0'
                 or not row['container'].strip() for row in trace_rows):
              raise SystemExit('QuickStart 2 nested trace contains a failed or uncontainerized task')
          trace_fields = "trace.fields = 'task_id,hash,name,status,exit,container'"
          if trace_fields not in require_file(
                  context / 'nested-v1-hcc1143-nextflow.config').read_text():
              raise SystemExit('QuickStart 2 nested Nextflow config lacks container-aware tracing')
          comparator_config = require_file(context / 'v1-pinned-nextflow.config').read_text()
          if os.environ['PINNED_NEXTFLOW_DIR'] not in comparator_config:
              raise SystemExit('v1 HCC1143 wrapper PATH does not use the pinned Nextflow directory')
          nested_log = require_file(context / 'nested-v1-hcc1143-nextflow.log').read_text(
              errors='replace').lower()
          if f"version {os.environ['NEXTFLOW_VERSION']}" not in nested_log:
              raise SystemExit('HCC1143 nested log does not prove the pinned Nextflow version')


          input_tree = Path(os.environ['INPUT_ROOT']) / 'public' / 'hcc1143_lpwgs'
          input_records = verify_manifest(input_tree, manifests / 'public-input-manifest.tsv')
          expected_fastqs = {
              f'HCC1143_{condition}_{mate}.fastq.gz'
              for condition in ('DMSO', 'BEZ235', 'TRAMETINIB') for mate in ('R1', 'R2')
          }
          observed_fastqs = {relative for _, _, relative in input_records if relative.endswith('.fastq.gz')}
          if observed_fastqs != expected_fastqs:
              raise SystemExit(f'HCC1143 FASTQ set mismatch: {observed_fastqs!r}')

          reference_records = verify_manifest(
              root / 'references' / 'samurai_hg38', manifests / 'shared-reference-manifest.tsv')
          reference_paths = {relative for _, _, relative in reference_records}
          required_reference = {
              'genome.fa', 'genome.fa.fai', 'genome.dict',
              'bwa/genome.amb', 'bwa/genome.ann', 'bwa/genome.bwt',
              'bwa/genome.pac', 'bwa/genome.sa',
          }
          if not required_reference <= reference_paths:
              raise SystemExit(f'shared reference/index manifest lacks {required_reference - reference_paths!r}')

          qdna_tree = root / '.oncotracer' / 'qdnaseq-bin-data'
          qdna_records = verify_manifest(qdna_tree, manifests / 'qdnaseq-annotation-manifest.tsv')
          qdna_paths = {relative for _, _, relative in qdna_records}
          annotation = 'QDNAseq.hg38.100kbp.SR50.rds'
          source = 'QDNAseq.hg38.100kbp.SR50.source.rda'
          provenance = annotation + '.provenance.tsv'
          if qdna_paths != {annotation, source, provenance}:
              raise SystemExit(f'unexpected qDNAseq cache inventory: {qdna_paths!r}')
          rows = list(csv.reader((qdna_tree / provenance).open(newline='', encoding='utf-8'), delimiter='\t'))
          if not rows or rows[0] != ['field', 'value']:
              raise SystemExit('invalid qDNAseq provenance header')
          qdna = dict(rows[1:])
          if qdna.get('source_commit') != os.environ['QDNASEQ_SOURCE_COMMIT']:
              raise SystemExit('qDNAseq source commit mismatch')
          if qdna.get('source_rda_sha256') != sha256(qdna_tree / source):
              raise SystemExit('qDNAseq source RDA checksum mismatch')
          if qdna.get('rds_sha256') != sha256(qdna_tree / annotation):
              raise SystemExit('qDNAseq RDS checksum mismatch')
          for filename in (annotation, source, provenance):
              if sha256(qdna_tree / filename) != sha256(context / 'qdnaseq-annotation' / filename):
                  raise SystemExit(f'copied qDNAseq audit file differs: {filename}')

          for relative_root, manifest_name in (
              ('v1/hcc1143', 'v1-hcc1143-output-manifest.tsv'),
              ('v2/hcc1143', 'v2-hcc1143-output-manifest.tsv'),
          ):
              records = verify_manifest(root / relative_root, manifests / manifest_name)
              if not any(path.endswith('/01_tables/refined_bins.tsv.gz') for _, _, path in records):
                  raise SystemExit(f'{manifest_name} does not inventory refined_bins.tsv.gz')
          for filename in ('v1-summary.txt', 'v2-summary.txt', 'v1-trace.tsv', 'v2-trace.tsv'):
              require_file(context / filename)
          if 'nextflow' in (context / 'v2-trace.tsv').read_text(errors='replace').lower():
              raise SystemExit('native HCC1143 trace invokes Nextflow')
          require_file(context / 'manifest.tsv')
          require_file(context / 'samples.csv')
          parity_configs = sorted((context / 'configs' / 'parity').glob('*.yml'))
          if {path.name for path in parity_configs} != {'v1-hcc1143.yml', 'v2-hcc1143.yml'}:
              raise SystemExit('QuickStart 2 parity configs are not separately recorded')
          require_file(context / 'configs' / 'input' / 'illumina.auto.yml')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-v2-quickstart2-parity-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: |
            parity-quickstart2/audit/**
            parity-quickstart2/reports/*.log
            parity-quickstart2/reports/*.tsv
            parity-quickstart2/reports/*.html
