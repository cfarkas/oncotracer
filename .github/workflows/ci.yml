name: Materialize audited native v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: native-v2-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/native-v2-parity'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate branch with write credentials
        uses: actions/checkout@v4
        with:
          ref: agent/native-v2-parity
          fetch-depth: 0

      - name: Reconstruct and authenticate the reviewed archive
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/native-v2.tar.gz" <<'PY'
          import base64
          import binascii
          import hashlib
          import sys
          import zlib
          from pathlib import Path

          output = Path(sys.argv[1])
          expected = 'f374c8f80dd320ab7de0be13bb6ad6ad9a82dfdb725f318893322efee6deb4a1'
          paths = sorted(Path('.github').glob('native-v2-bundle.part*'))
          if len(paths) != 10:
              raise SystemExit(f'ERROR: expected 10 bundle parts, found {len(paths)}')
          parts = [''.join(path.read_text(encoding='ascii').split()) for path in paths]
          joined = ''.join(parts)
          print('part_lengths=' + ','.join(str(len(part)) for part in parts))
          print(f'combined_base64_characters={len(joined)}')

          def authenticated(value: str):
              if len(value) % 4:
                  return None
              try:
                  raw_value = base64.b64decode(value, validate=True)
              except binascii.Error:
                  return None
              return raw_value if hashlib.sha256(raw_value).hexdigest() == expected else None

          def decode_probe(value: str):
              probe = value.rstrip('=')
              probe = probe[:len(probe) - (len(probe) % 4)]
              try:
                  return base64.b64decode(probe, validate=True)
              except binascii.Error:
                  return None

          def gzip_progress(compressed: bytes, chunk_size: int):
              inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
              unpacked = 0
              consumed = 0
              for offset in range(0, len(compressed), chunk_size):
                  block = compressed[offset:offset + chunk_size]
                  try:
                      unpacked += len(inflater.decompress(block))
                  except zlib.error:
                      return consumed, unpacked, False
                  consumed = offset + len(block)
              return consumed, unpacked, inflater.eof

          raw = authenticated(joined)
          recovery = None
          if raw is None:
              data_limit = len(joined) - (1 if joined.endswith('=') else 0)
              ranked = []
              for index in range(data_limit):
                  once = joined[:index] + joined[index + 1:]
                  compressed = decode_probe(once)
                  if compressed is None:
                      continue
                  consumed, unpacked, eof = gzip_progress(compressed, 256)
                  ranked.append((consumed, unpacked, eof, index, joined[index]))
              if not ranked:
                  raise SystemExit('ERROR: no one-character deletion produced a decodable gzip probe')
              ranked.sort(reverse=True)
              print('first_deletion_candidates=' + ','.join(
                  f'index:{index}/char:{character!r}/compressed:{consumed}/unpacked:{unpacked}/eof:{eof}'
                  for consumed, unpacked, eof, index, character in ranked[:16]
              ))

              offsets = []
              cursor = 0
              for part in parts:
                  offsets.append((cursor, cursor + len(part)))
                  cursor += len(part)

              for _, _, _, first_index, first_character in ranked[:32]:
                  once = joined[:first_index] + joined[first_index + 1:]
                  compressed = decode_probe(once)
                  if compressed is None:
                      continue
                  precise_consumed, _, _ = gzip_progress(compressed, 1)
                  approximate_second = (precise_consumed * 4) // 3

                  second_candidates = set()
                  for radius in (32, 256, 2048):
                      lower = max(0, approximate_second - radius)
                      upper = min(len(once), approximate_second + radius + 1)
                      second_candidates.update(range(lower, upper))
                  # The transport-size anomaly also points to original part06.
                  part6_start, part6_end = offsets[6]
                  if first_index < part6_start:
                      part6_start -= 1
                      part6_end -= 1
                  second_candidates.update(range(part6_start, min(part6_end, len(once))))

                  ordered = sorted(
                      (index for index in second_candidates if once[index] != '='),
                      key=lambda index: (abs(index - approximate_second), index),
                  )
                  for second_index in ordered:
                      final = once[:second_index] + once[second_index + 1:]
                      raw_candidate = authenticated(final)
                      if raw_candidate is not None:
                          original_second = second_index + (1 if second_index >= first_index else 0)
                          raw = raw_candidate
                          recovery = (
                              first_index,
                              first_character,
                              original_second,
                              joined[original_second],
                              precise_consumed,
                          )
                          break
                  if raw is not None:
                      break

              # Exhaustive second-deletion fallback for the best first deletion.
              if raw is None:
                  first_index = ranked[0][3]
                  first_character = joined[first_index]
                  once = joined[:first_index] + joined[first_index + 1:]
                  for second_index, second_character in enumerate(once):
                      if second_character == '=':
                          continue
                      final = once[:second_index] + once[second_index + 1:]
                      raw_candidate = authenticated(final)
                      if raw_candidate is not None:
                          original_second = second_index + (1 if second_index >= first_index else 0)
                          raw = raw_candidate
                          recovery = (
                              first_index,
                              first_character,
                              original_second,
                              joined[original_second],
                              -1,
                          )
                          break
          if raw is None:
              raise SystemExit('ERROR: deterministic recovery did not reproduce the signed archive')
          digest = hashlib.sha256(raw).hexdigest()
          print(f'archive_bytes={len(raw)} sha256={digest}')
          if recovery is not None:
              print(
                  'recovered_transport='
                  f'index:{recovery[0]}/char:{recovery[1]!r},'
                  f'index:{recovery[2]}/char:{recovery[3]!r},'
                  f'failure_byte_after_first_fix:{recovery[4]}'
              )
          output.write_bytes(raw)
          PY
          tar -tzf "$RUNNER_TEMP/native-v2.tar.gz" > "$RUNNER_TEMP/archive-manifest.txt"
          python3 - "$RUNNER_TEMP/archive-manifest.txt" <<'PY'
          import sys
          from pathlib import PurePosixPath

          for raw in open(sys.argv[1], encoding='utf-8'):
              name = raw.strip()
              if not name:
                  continue
              path = PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'ERROR: unsafe archive path: {name}')
          PY
          sed -n '1,240p' "$RUNNER_TEMP/archive-manifest.txt"
          tar -xzf "$RUNNER_TEMP/native-v2.tar.gz"

      - name: Remove superseded v1 and transport files
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/ci.yml \
            .github/workflows/full-conda-quickstarts-v1.1.yml \
            .github/workflows/full-v1.1-quickstart2.yml \
            .github/workflows/release-v1.1-after-conda-validation.yml
          rm -f .github/native-v2-bundle.part* .github/native-v2-bundle.ready
          rm -f .github/workflows/apply-native-v2-bundle.yml

      - name: Validate source and copied executable
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q oncotracer_cli tests scripts
          python3 -m unittest -v \
            tests/test_native_cli.py \
            tests/test_native_engine.py \
            tests/test_compare_native_parity.py \
            tests/test_native_docs.py \
            tests/test_poetry_cli.py
          python3 scripts/build_native_binary.py --output "$RUNNER_TEMP/oncotracer"
          (cd /tmp && "$RUNNER_TEMP/oncotracer" --version | grep -F 'OncoTracer 2.0.0')
          if grep -R -n --include='*.py' --include='*.R' --include='Dockerfile' \
            -E 'nextflow[[:space:]]+run|exec[[:space:]]+nextflow' \
            oncotracer_cli bin/scripts Dockerfile; then
            echo 'ERROR: native runtime source invokes Nextflow' >&2
            exit 1
          fi

      - name: Commit the materialized implementation to the PR branch
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Implement native OncoTracer v2 with parity release gates'
          git push origin HEAD:agent/native-v2-parity
