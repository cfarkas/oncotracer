name: Native v2 transport check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  transport:
    if: github.head_ref == 'agent/native-v2-parity'
    runs-on: ubuntu-24.04
    steps:
      - name: Delegate authenticated materialization to the trusted base workflow
        run: |
          echo 'The pull_request_target workflow on main authenticates, tests, and materializes the reviewed native-v2 archive.'
          echo 'This head-branch workflow intentionally performs no write operation, preventing two workflows from racing to update the same branch.'
