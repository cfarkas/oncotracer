name: Materialize audited native v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: native-v2-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/native-v2-parity'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate branch with write credentials
        uses: actions/checkout@v4
        with:
          ref: agent/native-v2-parity
          fetch-depth: 0

      - name: Reconstruct and authenticate the reviewed archive
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/native-v2.tar.gz" <<'PY'
          import base64
          import hashlib
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          expected = 'f374c8f80dd320ab7de0be13bb6ad6ad9a82dfdb725f318893322efee6deb4a1'
          paths = sorted(Path('.github').glob('native-v2-bundle.part*'))
          if len(paths) != 10:
              raise SystemExit(f'ERROR: expected 10 bundle parts, found {len(paths)}')

          repaired_lines = []
          repairs = []
          for path in paths:
              for line_number, line in enumerate(path.read_text(encoding='ascii').splitlines(), 1):
                  if len(line) == 77:
                      repairs.append((path.name, line_number, line[0]))
                      line = line[1:]
                  elif len(line) > 76:
                      raise SystemExit(
                          f'ERROR: unexpected transport line length {len(line)} at {path}:{line_number}'
                      )
                  repaired_lines.append(line)

          clean = ''.join(repaired_lines)
          print(f'base64_characters={len(clean)} repairs={repairs!r}')
          if repairs != [
              ('native-v2-bundle.part06', 49, 'h'),
              ('native-v2-bundle.part09', 69, 'J'),
          ]:
              raise SystemExit(f'ERROR: unexpected transport repair set: {repairs!r}')

          raw = base64.b64decode(clean, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          print(f'archive_bytes={len(raw)} sha256={digest}')
          if digest != expected:
              raise SystemExit(f'ERROR: archive SHA-256 mismatch: {digest} != {expected}')
          output.write_bytes(raw)
          PY

          tar -tzf "$RUNNER_TEMP/native-v2.tar.gz" > "$RUNNER_TEMP/archive-manifest.txt"
          python3 - "$RUNNER_TEMP/archive-manifest.txt" <<'PY'
          import sys
          from pathlib import PurePosixPath

          for raw in open(sys.argv[1], encoding='utf-8'):
              name = raw.strip()
              if not name:
                  continue
              path = PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'ERROR: unsafe archive path: {name}')
          PY
          sed -n '1,240p' "$RUNNER_TEMP/archive-manifest.txt"
          tar -xzf "$RUNNER_TEMP/native-v2.tar.gz"

          mkdir -p ci/workflow-sources
          cp .github/workflows/native-v2-ci.yml ci/workflow-sources/native-v2-ci.yml
          cp .github/workflows/native-v2-quickstart1-parity.yml ci/workflow-sources/native-v2-quickstart1-parity.yml
          cp .github/workflows/native-v2-quickstart2-parity.yml ci/workflow-sources/native-v2-quickstart2-parity.yml
          cp .github/workflows/release-v2.yml ci/workflow-sources/release-v2.yml
          sha256sum ci/workflow-sources/*.yml

      - name: Validate source and copied executable
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q oncotracer_cli tests scripts
          python3 -m unittest -v \
            tests/test_native_cli.py \
            tests/test_native_engine.py \
            tests/test_compare_native_parity.py \
            tests/test_native_docs.py \
            tests/test_poetry_cli.py
          python3 scripts/build_native_binary.py --output "$RUNNER_TEMP/oncotracer"
          (cd /tmp && "$RUNNER_TEMP/oncotracer" --version | grep -F 'OncoTracer 2.0.0')
          if grep -R -n --include='*.py' --include='*.R' --include='Dockerfile' \
            -E 'nextflow[[:space:]]+run|exec[[:space:]]+nextflow' \
            oncotracer_cli bin/scripts Dockerfile; then
            echo 'ERROR: native runtime source invokes Nextflow' >&2
            exit 1
          fi

      - name: Commit validated source and workflow blob sources
        run: |
          set -Eeuo pipefail
          find oncotracer_cli tests scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md Dockerfile pyproject.toml environment.yml mkdocs.yml oncotracer \
            oncotracer_cli \
            bin/scripts/native_ichorcna.R \
            bin/scripts/native_qdnaseq.R \
            bin/scripts/native_qdnaseq_pon.R \
            scripts/build_native_binary.py \
            environments tests docs ci/workflow-sources
          git status --short
          if git diff --cached --quiet; then
            echo 'Validated native v2 source and workflow blobs are already materialized.'
            exit 0
          fi
          git commit -m 'Stage reviewed native v2 workflow blobs'
          git push origin HEAD:agent/native-v2-parity
