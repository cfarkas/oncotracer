name: Apply start-from-clone documentation

on:
  push:
    branches:
      - agent/examples-start-from-clone
    paths:
      - .github/workflows/apply-start-from-clone-docs.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/examples-start-from-clone
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make every example start from a fresh clone
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Missing exact text in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Missing text in {path}: {old[:120]!r}")
              write(path, text.replace(old, new))

          clone_command = 'git clone https://github.com/cfarkas/oncotracer.git "$REPO_DIR"'

          # Repository front page: derive every path from REPO_DIR and make
          # each end-to-end example explicitly clone the repository.
          replace_all(
              "README.md",
              "CONFIG=/path/to/my/directory/my_oncotracer_project/config/illumina.auto.yml",
              'PROJECT_DIR="$REPO_DIR/project"\nCONFIG="$PROJECT_DIR/config/illumina.auto.yml"',
          )
          replace_once(
              "README.md",
              "WORK_DIR=/path/to/my/directory/my_oncotracer_project/work/docker",
              'WORK_DIR="$PROJECT_DIR/work/docker"',
          )
          replace_once(
              "README.md",
              "WORK_DIR=/path/to/my/directory/my_oncotracer_project/work/singularity",
              'WORK_DIR="$PROJECT_DIR/work/singularity"',
          )
          replace_once(
              "README.md",
              "WORK_DIR=/path/to/my/directory/my_oncotracer_project/work/poetry",
              'WORK_DIR="$PROJECT_DIR/work/poetry"',
          )
          replace_once(
              "README.md",
              "WORK_DIR=/path/to/my/directory/my_oncotracer_project/work/conda",
              'WORK_DIR="$PROJECT_DIR/work/conda"',
          )
          replace_once(
              "README.md",
              "PROJECT_DIR=/path/to/my/directory/my_oncotracer_project",
              'PROJECT_DIR="$REPO_DIR/project"',
          )
          replace_once(
              "README.md",
              """# Set the standard repository and HCC1143 data paths.
REPO_DIR=/path/to/my/directory/oncotracer
READS_DIR="$REPO_DIR/test/public/hcc1143_lpwgs"
mkdir -p "$READS_DIR"
cd "$REPO_DIR"
""",
              """# Set the standard repository path and start from a fresh clone.
REPO_DIR=/path/to/my/directory/oncotracer
git clone https://github.com/cfarkas/oncotracer.git "$REPO_DIR"
cd "$REPO_DIR"

# Create the HCC1143 data directory inside the clone.
READS_DIR="$REPO_DIR/test/public/hcc1143_lpwgs"
mkdir -p "$READS_DIR"
""",
          )
          replace_once(
              "README.md",
              "Its run section shows Docker, Singularity/Apptainer, Poetry, and Conda alternatives.",
              "Its start-from-scratch instructions clone OncoTracer first and then show Docker, Singularity/Apptainer, Poetry, and Conda alternatives.",
          )

          # The public tutorials already clone first; make that mandatory and
          # remove wording that suggests skipping the clone step.
          for path in (
              "docs/quick_start.md",
              "docs/public_cohort.md",
              "docs/full_tutorial.md",
          ):
              replace_once(
                  path,
                  "Skip the clone command when the repository already exists.",
                  "Use an empty destination path so this tutorial starts from a fresh clone.",
              )

          replace_once(
              "docs/auto_params.md",
              "# Clone OncoTracer when it is not already installed.",
              "# Clone OncoTracer into the fresh destination path.",
          )

          # Rewrite the mock tumor/normal page so only REPO_DIR is editable.
          replace_once(
              "docs/six_tumor_four_control.md",
              "Corrected CNA outputs contain the six tumors. The four controls remain reference and quality-control inputs.\n",
              """Corrected CNA outputs contain the six tumors. The four controls remain reference and quality-control inputs.

## 1. Clone OncoTracer

Start from a fresh clone. The only path that needs to be changed in the commands is `/path/to/my/directory/oncotracer`.

```bash
# Set the standard repository path.
REPO_DIR=/path/to/my/directory/oncotracer

# Clone OncoTracer and enter the repository.
git clone https://github.com/cfarkas/oncotracer.git "$REPO_DIR"
cd "$REPO_DIR"
```
""",
          )
          replace_once(
              "docs/six_tumor_four_control.md",
              """# Set the mock-project path and create its input directory.
PROJECT_DIR=/path/to/my/directory/oncotracer_projects/onco6_ctrl4
mkdir -p "$PROJECT_DIR/input/fastq"
""",
              """# Derive the mock-project path from the repository clone.
REPO_DIR=/path/to/my/directory/oncotracer
PROJECT_DIR="$REPO_DIR/test/examples/onco6_ctrl4"
mkdir -p "$PROJECT_DIR/input/fastq"
""",
          )
          replace_once(
              "docs/six_tumor_four_control.md",
              "/path/to/my/directory/oncotracer_projects/onco6_ctrl4/",
              "/path/to/my/directory/oncotracer/test/examples/onco6_ctrl4/",
          )
          replace_all(
              "docs/six_tumor_four_control.md",
              "PROJECT_DIR=/path/to/my/directory/oncotracer_projects/onco6_ctrl4",
              'PROJECT_DIR="$REPO_DIR/test/examples/onco6_ctrl4"',
          )
          replace_once(
              "docs/six_tumor_four_control.md",
              "`sample_name` must match the text before `_R1` and `_R2`. The four `NORMAL` rows tell Automatic Setup to enable the local qDNAseq reference.",
              "`sample_name` must match the text before `_R1` and `_R2`. Place the ten paired FASTQs listed above in `$PROJECT_DIR/input/fastq`; the four `NORMAL` rows tell Automatic Setup to enable the local qDNAseq reference.",
          )
          replace_once(
              "docs/six_tumor_four_control.md",
              """# Set the mock-project result paths.
PROJECT_DIR="$REPO_DIR/test/examples/onco6_ctrl4"
OUT="$PROJECT_DIR/results"
""",
              """# Set the repository, mock-project, and result paths.
REPO_DIR=/path/to/my/directory/oncotracer
PROJECT_DIR="$REPO_DIR/test/examples/onco6_ctrl4"
OUT="$PROJECT_DIR/results"
""",
          )

          # Make the repository example README fully self-contained and fix
          # the previously unclosed Bash fence.
          hcc_readme = r'''# HCC1143 six-FASTQ public example

This example runs three paired-end HCC1143 low-pass whole-genome sequencing libraries from public project [PRJNA454331](https://www.ebi.ac.uk/ena/browser/view/PRJNA454331). It starts from a fresh OncoTracer clone and requires editing only `/path/to/my/directory/oncotracer`.

All rows use `TUMOR`. DMSO is a treatment control, not a normal genome.

## 1. Clone OncoTracer

```bash
# Set the standard repository path.
REPO_DIR=/path/to/my/directory/oncotracer

# Clone OncoTracer and create the reads directory.
git clone https://github.com/cfarkas/oncotracer.git "$REPO_DIR"
cd "$REPO_DIR"
READS_DIR="$REPO_DIR/test/public/hcc1143_lpwgs"
mkdir -p "$READS_DIR"
```

## 2. Download the six FASTQs

```bash
# Set the repository and HCC1143 reads paths.
REPO_DIR=/path/to/my/directory/oncotracer
READS_DIR="$REPO_DIR/test/public/hcc1143_lpwgs"
mkdir -p "$READS_DIR"

# Download HCC1143_DMSO read 1.
curl --fail --location --continue-at - \
  --output "$READS_DIR/HCC1143_DMSO_R1.fastq.gz" \
  https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR708/006/SRR7085656/SRR7085656_1.fastq.gz

# Download HCC1143_DMSO read 2.
curl --fail --location --continue-at - \
  --output "$READS_DIR/HCC1143_DMSO_R2.fastq.gz" \
  https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR708/006/SRR7085656/SRR7085656_2.fastq.gz

# Download HCC1143_BEZ235 read 1.
curl --fail --location --continue-at - \
  --output "$READS_DIR/HCC1143_BEZ235_R1.fastq.gz" \
  https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR708/005/SRR7085655/SRR7085655_1.fastq.gz

# Download HCC1143_BEZ235 read 2.
curl --fail --location --continue-at - \
  --output "$READS_DIR/HCC1143_BEZ235_R2.fastq.gz" \
  https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR708/005/SRR7085655/SRR7085655_2.fastq.gz

# Download HCC1143_TRAMETINIB read 1.
curl --fail --location --continue-at - \
  --output "$READS_DIR/HCC1143_TRAMETINIB_R1.fastq.gz" \
  https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR708/007/SRR7085657/SRR7085657_1.fastq.gz

# Download HCC1143_TRAMETINIB read 2.
curl --fail --location --continue-at - \
  --output "$READS_DIR/HCC1143_TRAMETINIB_R2.fastq.gz" \
  https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR708/007/SRR7085657/SRR7085657_2.fastq.gz
```

## 3. Validate the files and create the sample table

```bash
# Set the repository and HCC1143 reads paths.
REPO_DIR=/path/to/my/directory/oncotracer
READS_DIR="$REPO_DIR/test/public/hcc1143_lpwgs"
cd "$READS_DIR"

# Verify all six checksums and compressed FASTQs.
md5sum -c "$REPO_DIR/examples/hcc1143_lpwgs/checksums.md5"
gzip -t HCC1143_DMSO_R1.fastq.gz HCC1143_DMSO_R2.fastq.gz \
  HCC1143_BEZ235_R1.fastq.gz HCC1143_BEZ235_R2.fastq.gz \
  HCC1143_TRAMETINIB_R1.fastq.gz HCC1143_TRAMETINIB_R2.fastq.gz

# Create or replace the exact HCC1143 sample table.
cat > "$READS_DIR/samples.csv" <<'CSV'
sample_name,status
HCC1143_DMSO,TUMOR
HCC1143_BEZ235,TUMOR
HCC1143_TRAMETINIB,TUMOR
CSV

# Display the saved table.
cat "$READS_DIR/samples.csv"
```

## 4. Generate the configuration

```bash
# Set the repository and reads paths and enter the clone.
REPO_DIR=/path/to/my/directory/oncotracer
READS_DIR="$REPO_DIR/test/public/hcc1143_lpwgs"
cd "$REPO_DIR"

# Generate the paired-end samplesheet and YAML without starting analysis.
nextflow run "$REPO_DIR/main.nf" --auto_params \
  --mode illumina \
  --reads_folder "$READS_DIR" \
  --sample_table "$READS_DIR/samples.csv" \
  --auto_config_dir "$REPO_DIR/test/configs/hcc1143_lpwgs" \
  --auto_outdir "$REPO_DIR/test/runs/hcc1143_lpwgs"
```

## 5. Choose one execution method

### Docker

```bash
# Run or resume HCC1143 with Docker.
REPO_DIR=/path/to/my/directory/oncotracer
nextflow run "$REPO_DIR/main.nf" --docker \
  -params-file "$REPO_DIR/test/configs/hcc1143_lpwgs/illumina.auto.yml" \
  -work-dir "$REPO_DIR/test/work/hcc1143_lpwgs-docker" \
  -resume
```

### Singularity or Apptainer

```bash
# Run or resume HCC1143 through Singularity or Apptainer.
REPO_DIR=/path/to/my/directory/oncotracer
nextflow run "$REPO_DIR/main.nf" --singularity \
  -params-file "$REPO_DIR/test/configs/hcc1143_lpwgs/illumina.auto.yml" \
  -work-dir "$REPO_DIR/test/work/hcc1143_lpwgs-singularity" \
  -resume
```

### Poetry launcher

```bash
# Install the launcher and run HCC1143 through Poetry with Docker.
REPO_DIR=/path/to/my/directory/oncotracer
cd "$REPO_DIR"
poetry install --no-interaction
poetry run oncotracer --repo-dir "$REPO_DIR" --backend docker \
  -params-file "$REPO_DIR/test/configs/hcc1143_lpwgs/illumina.auto.yml" \
  -work-dir "$REPO_DIR/test/work/hcc1143_lpwgs-poetry" \
  -resume
```

### Conda

```bash
# Run or resume HCC1143 with native Conda environments.
REPO_DIR=/path/to/my/directory/oncotracer
nextflow run "$REPO_DIR/main.nf" --conda \
  -params-file "$REPO_DIR/test/configs/hcc1143_lpwgs/illumina.auto.yml" \
  -work-dir "$REPO_DIR/test/work/hcc1143_lpwgs-conda" \
  -resume
```

## 6. Check the completed outputs

```bash
# Set the repository and result paths.
REPO_DIR=/path/to/my/directory/oncotracer
OUT="$REPO_DIR/test/runs/hcc1143_lpwgs"

# List the aligned BAMs and confirm all three samples in qDNAseq output.
find "$OUT/01_samurai_illumina/alignment" -maxdepth 1 -type f -name '*.bam' -print
grep -F HCC1143_DMSO "$OUT/01_samurai_illumina/qdnaseq/all_segments.seg"
grep -F HCC1143_BEZ235 "$OUT/01_samurai_illumina/qdnaseq/all_segments.seg"
grep -F HCC1143_TRAMETINIB "$OUT/01_samurai_illumina/qdnaseq/all_segments.seg"

# Read the final workflow summary.
cat "$OUT/06_workflow_summary/workflow_summary.txt"
```

Plan for about 1.08 GiB of compressed reads, at least 40 GiB of free working space, and at least 80 GiB of addressable RAM. See [`manifest.tsv`](manifest.tsv) for provenance and [`checksums.md5`](checksums.md5) for the expected MD5 values.
'''
          write("examples/hcc1143_lpwgs/README.md", hcc_readme)

          # Strengthen documentation regression tests.
          test_path = "tests/test_docs_style.py"
          test_text = read(test_path)
          test_text = test_text.replace(
              """ROUTE_SNIPPETS = (
    "--docker",
    "--singularity",
    "poetry run oncotracer",
    "--conda",
)

BASH_BLOCK_RE = re.compile(r"```bash[ \\t]*\\n(.*?)```", re.DOTALL)
""",
              """ROUTE_SNIPPETS = (
    "--docker",
    "--singularity",
    "poetry run oncotracer",
    "--conda",
)

START_FROM_SCRATCH_FILES = ROUTE_EXAMPLE_FILES
CLONE_COMMAND = 'git clone https://github.com/cfarkas/oncotracer.git "$REPO_DIR"'
REPO_ASSIGNMENT = "REPO_DIR=/path/to/my/directory/oncotracer"
CD_REPOSITORY_COMMAND = 'cd "$REPO_DIR"'
PLACEHOLDER_PATH_RE = re.compile(r"/path/to/[A-Za-z0-9_./-]+")

BASH_BLOCK_RE = re.compile(r"```bash[ \\t]*\\n(.*?)```", re.DOTALL)
""",
              1,
          )
          if test_text == read(test_path):
              raise SystemExit("Unable to insert start-from-scratch test constants")

          marker = "\ndef check_commented_bash_blocks() -> None:\n"
          if marker not in test_text:
              raise SystemExit("Unable to locate documentation test insertion point")
          new_checks = r'''
def check_examples_start_from_fresh_clone() -> None:
    for relative_path in START_FROM_SCRATCH_FILES:
        text = read(relative_path)
        blocks = BASH_BLOCK_RE.findall(text)
        if not blocks:
            fail(f"expected a Bash block in {relative_path}")
        first_block = blocks[0]
        for snippet in (REPO_ASSIGNMENT, CLONE_COMMAND, CD_REPOSITORY_COMMAND):
            if snippet not in first_block:
                fail(f"first Bash block in {relative_path} must start from a fresh clone: {snippet}")

        clone_index = text.find(CLONE_COMMAND)
        run_indices = [
            index
            for index in (text.find("nextflow run"), text.find("poetry run oncotracer"))
            if index >= 0
        ]
        if run_indices and clone_index > min(run_indices):
            fail(f"pipeline command appears before git clone in {relative_path}")

        for placeholder in PLACEHOLDER_PATH_RE.findall(text):
            if not placeholder.startswith(STANDARD_REPOSITORY_PATH):
                fail(
                    f"additional editable placeholder in {relative_path}: {placeholder}; "
                    f"derive paths from {STANDARD_REPOSITORY_PATH}"
                )


def check_markdown_fences_and_bash_content() -> None:
    for path in DOC_TEXT_FILES:
        text = path.read_text(encoding="utf-8")
        if text.count("```") % 2:
            fail(f"unbalanced Markdown code fences in {path.relative_to(ROOT)}")
        for index, block in enumerate(BASH_BLOCK_RE.findall(text), start=1):
            for line in block.splitlines():
                if re.match(r"^\s*#{2,6}\s", line):
                    fail(
                        f"Markdown heading leaked into Bash block {index} in "
                        f"{path.relative_to(ROOT)}: {line.strip()}"
                    )


def check_readme_examples_start_from_fresh_clone() -> None:
    text = read("README.md")
    sections = (
        ("## Run your own FASTQs", "## QuickStart Example 1"),
        ("## QuickStart Example 1", "## QuickStart Example 2"),
        ("## QuickStart Example 2", "## Other Example Runs"),
    )
    for start, end in sections:
        if start not in text or end not in text:
            fail(f"missing README example section boundary: {start} -> {end}")
        section = text.split(start, 1)[1].split(end, 1)[0]
        if CLONE_COMMAND not in section:
            fail(f"README example must start from a fresh clone: {start}")

'''
          test_text = test_text.replace(marker, "\n" + new_checks + marker, 1)
          test_text = test_text.replace(
              """    check_all_example_routes()
    check_commented_bash_blocks()
    check_bash_block_syntax()
    print("PASS: Docker/Singularity, Poetry, and Conda documentation, generic paths, examples, downloads, and Bash syntax")
""",
              """    check_all_example_routes()
    check_examples_start_from_fresh_clone()
    check_readme_examples_start_from_fresh_clone()
    check_markdown_fences_and_bash_content()
    check_commented_bash_blocks()
    check_bash_block_syntax()
    print("PASS: all examples start from a fresh clone, use one editable repository path, and contain valid four-route Bash commands")
""",
              1,
          )
          write(test_path, test_text)

          # Ensure expected edits landed before the workflow deletes itself.
          assert clone_command in read("docs/six_tumor_four_control.md")
          assert 'PROJECT_DIR="$REPO_DIR/test/examples/onco6_ctrl4"' in read("docs/six_tumor_four_control.md")
          assert clone_command in read("examples/hcc1143_lpwgs/README.md")
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-start-from-clone-docs.yml

      - name: Validate documentation and command boxes
        run: |
          python3 tests/test_docs_style.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Commit and push documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs examples tests .github/workflows
          git commit -m "Docs: make every example start from a fresh clone"
          git push origin HEAD:agent/examples-start-from-clone
