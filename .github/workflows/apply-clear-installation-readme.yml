name: Apply clearer installation and execution documentation

on:
  push:
    branches:
      - agent/clarify-installation-execution-readme
    paths:
      - .github/workflows/apply-clear-installation-readme.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/clarify-installation-execution-readme
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clarify the four installation and execution methods
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          readme_path = root / "README.md"
          readme = readme_path.read_text(encoding="utf-8")

          start = "## Four equivalent analysis commands\n"
          end = "## Run your own FASTQs\n"
          if start not in readme or end not in readme:
              raise SystemExit("Unable to locate the README execution-method section")

          new_section = r'''<a id="four-equivalent-analysis-commands"></a>

## Four installation and execution methods

OncoTracer reads each analysis from a YAML configuration file. A YAML is a plain-text file containing the input, output, and analysis settings. Open the [minimal Illumina YAML example](params/illumina.minimal.yml) or the [minimal ONT YAML example](params/ont.minimal.yml) to see the format. For your own FASTQs, [Automatic Setup](https://cfarkas.github.io/oncotracer/auto_params/) creates the YAML and samplesheet for you.

In each command below, `CONFIG` points to the generated YAML. Choose **one** method; do not run all four. Every method launches the same Nextflow workflow and produces the same result structure.

### Installation and execution through Docker

Install [Docker Engine](https://docs.docker.com/engine/install/) once. On the first analysis, Nextflow downloads [`carlosfarkas/oncotracer:latest`](https://hub.docker.com/r/carlosfarkas/oncotracer); later analyses reuse the cached image.

```bash
# Set the repository, project, generated YAML, and Docker work directory.
REPO_DIR=/path/to/my/directory/oncotracer
PROJECT_DIR="$REPO_DIR/project"
CONFIG="$PROJECT_DIR/config/illumina.auto.yml"
WORK_DIR="$PROJECT_DIR/work/docker"
cd "$REPO_DIR"

# Confirm that Automatic Setup created the YAML.
test -s "$CONFIG"

# Run or resume OncoTracer through Docker.
nextflow run "$REPO_DIR/main.nf" --docker \
  -params-file "$CONFIG" \
  -work-dir "$WORK_DIR" \
  -resume
```

### Installation and execution through Singularity or Apptainer

Install [SingularityCE](https://docs.sylabs.io/guides/latest/admin-guide/installation.html) or [Apptainer](https://apptainer.org/docs/admin/main/installation.html) once. Nextflow obtains the same maintained container image used by Docker and stores it in the local container cache.

```bash
# Set the repository, project, generated YAML, and HPC work directory.
REPO_DIR=/path/to/my/directory/oncotracer
PROJECT_DIR="$REPO_DIR/project"
CONFIG="$PROJECT_DIR/config/illumina.auto.yml"
WORK_DIR="$PROJECT_DIR/work/singularity"
cd "$REPO_DIR"

# Confirm that Automatic Setup created the YAML.
test -s "$CONFIG"

# Run or resume OncoTracer through Singularity or Apptainer.
nextflow run "$REPO_DIR/main.nf" --singularity \
  -params-file "$CONFIG" \
  -work-dir "$WORK_DIR" \
  -resume
```

### Installation and execution through Poetry

Install [Poetry](https://python-poetry.org/docs/#installation) and one scientific backend. The example below uses Docker. `poetry install` creates the isolated OncoTracer launcher environment; the launcher then passes the analysis to Nextflow and Docker.

```bash
# Set the repository, project, generated YAML, and Poetry work directory.
REPO_DIR=/path/to/my/directory/oncotracer
PROJECT_DIR="$REPO_DIR/project"
CONFIG="$PROJECT_DIR/config/illumina.auto.yml"
WORK_DIR="$PROJECT_DIR/work/poetry"
cd "$REPO_DIR"

# Install or reuse the locked Poetry launcher environment.
poetry install --no-interaction

# Confirm that Automatic Setup created the YAML.
test -s "$CONFIG"

# Run or resume OncoTracer through Poetry with Docker.
poetry run oncotracer --repo-dir "$REPO_DIR" --backend docker \
  -params-file "$CONFIG" \
  -work-dir "$WORK_DIR" \
  -resume
```

The Poetry launcher also accepts `--backend singularity` and `--backend conda`.

### Installation and execution through Conda

Install [Miniforge or Conda](https://github.com/conda-forge/miniforge) once. On the first analysis, Nextflow creates the required native environments from the versioned definitions; later analyses reuse those environments automatically.

```bash
# Set the repository, project, generated YAML, and Conda work directory.
REPO_DIR=/path/to/my/directory/oncotracer
PROJECT_DIR="$REPO_DIR/project"
CONFIG="$PROJECT_DIR/config/illumina.auto.yml"
WORK_DIR="$PROJECT_DIR/work/conda"
cd "$REPO_DIR"

# Confirm that Automatic Setup created the YAML.
test -s "$CONFIG"

# Run or resume OncoTracer through Conda.
nextflow run "$REPO_DIR/main.nf" --conda \
  -params-file "$CONFIG" \
  -work-dir "$WORK_DIR" \
  -resume
```

For an ONT analysis, set `CONFIG` to the generated `ont.auto.yml`; the installation and execution method does not otherwise change.

'''

          before, remainder = readme.split(start, 1)
          _, after = remainder.split(end, 1)
          readme = before + new_section + end + after
          readme = readme.replace(
              "PROJECT_DIR=/path/to/my/directory/my_oncotracer_project",
              'PROJECT_DIR="$REPO_DIR/project"',
          )
          readme_path.write_text(readme, encoding="utf-8")

          (root / "params/illumina.minimal.yml").write_text(
              """# Minimal Illumina YAML example.\n"
              "# Replace /path/to/my/directory/oncotracer with the absolute path used\n"
              "# for REPO_DIR. Keep every input and output below lpwgs_root.\n"
              "mode: illumina\n"
              "lpwgs_root: /path/to/my/directory/oncotracer/project\n"
              "outdir: /path/to/my/directory/oncotracer/project/results/my_first_illumina_run\n"
              "illumina_samplesheet: /path/to/my/directory/oncotracer/project/input/illumina.samplesheet.csv\n"
              "illumina_analysis_type: solid_biopsy\n"
              "illumina_caller: qdnaseq\n"
              "illumina_binsize_kb: 100\n"
              "run_cna_classifier: false\n"
              "force: false\n""",
              encoding="utf-8",
          )

          (root / "params/ont.minimal.yml").write_text(
              """# Minimal ONT YAML example.\n"
              "# Replace /path/to/my/directory/oncotracer with the absolute path used\n"
              "# for REPO_DIR. Keep every input and output below lpwgs_root.\n"
              "mode: ont\n"
              "lpwgs_root: /path/to/my/directory/oncotracer/project\n"
              "outdir: /path/to/my/directory/oncotracer/project/results/my_first_ont_run\n"
              "ont_folder: /path/to/my/directory/oncotracer/project/input/fastq_pass\n"
              "ont_barcodes: barcode01\n"
              "ont_sample_names: Sample_ONT_1\n"
              "ont_analysis_type: liquid_biopsy\n"
              "ont_caller: ichorcna\n"
              "ont_binsize_kb: 500\n"
              "ont_min_age_minutes: 0\n"
              "run_cna_classifier: false\n"
              "force: false\n""",
              encoding="utf-8",
          )

          tests_path = root / "tests/test_docs_style.py"
          tests = tests_path.read_text(encoding="utf-8")

          old_doc_files = '''DOC_TEXT_FILES.extend(sorted((ROOT / "examples").rglob("README.md")))\n'''
          new_doc_files = '''DOC_TEXT_FILES.extend(sorted((ROOT / "examples").rglob("README.md")))\nDOC_TEXT_FILES.extend(\n    [\n        ROOT / "params" / "illumina.minimal.yml",\n        ROOT / "params" / "ont.minimal.yml",\n    ]\n)\n'''
          if old_doc_files not in tests:
              raise SystemExit("Unable to extend documentation-file checks")
          tests = tests.replace(old_doc_files, new_doc_files, 1)

          old_generic_tail = '''    "examples/prjna754199/README.md",\n)\n\nREQUIRED_TEXT = {'''
          new_generic_tail = '''    "examples/prjna754199/README.md",\n    "params/illumina.minimal.yml",\n    "params/ont.minimal.yml",\n)\n\nREQUIRED_TEXT = {'''
          if old_generic_tail not in tests:
              raise SystemExit("Unable to extend generic-path checks")
          tests = tests.replace(old_generic_tail, new_generic_tail, 1)

          required_anchor = '''        "Poetry launcher",\n        "poetry run oncotracer",\n'''
          required_replacement = '''        "Poetry launcher",\n        "poetry run oncotracer",\n        "params/illumina.minimal.yml",\n        "params/ont.minimal.yml",\n        "### Installation and execution through Docker",\n        "### Installation and execution through Singularity or Apptainer",\n        "### Installation and execution through Poetry",\n        "### Installation and execution through Conda",\n'''
          if required_anchor not in tests:
              raise SystemExit("Unable to add README wording checks")
          tests = tests.replace(required_anchor, required_replacement, 1)
          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Remove this temporary workflow
        run: rm -f .github/workflows/apply-clear-installation-readme.yml

      - name: Validate documentation and examples
        run: |
          python3 tests/test_docs_style.py
          python3 tests/test_examples_start_from_clone.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict
          grep -F '[minimal Illumina YAML example](params/illumina.minimal.yml)' README.md >/dev/null
          grep -F '### Installation and execution through Docker' README.md >/dev/null
          grep -F '### Installation and execution through Singularity or Apptainer' README.md >/dev/null
          grep -F '### Installation and execution through Poetry' README.md >/dev/null
          grep -F '### Installation and execution through Conda' README.md >/dev/null
          ! grep -R -F '/home/student/oncotracer' params README.md docs examples

      - name: Commit and push the documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md params tests .github/workflows
          git commit -m "Docs: clarify installation and execution methods"
          git push origin HEAD:agent/clarify-installation-execution-readme
