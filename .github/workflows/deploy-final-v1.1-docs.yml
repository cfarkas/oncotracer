name: Deploy final v1.1 documentation

on:
  pull_request:
    branches:
      - agent/v1.1-release-base-docs
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 032c1268fa7fdcadc48087055066d7a9fc59bd89
    steps:
      - name: Check out the final main documentation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate and build the final documentation
        run: |
          python3 tests/test_docs_style.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --clean --remote-name origin --remote-branch gh-pages
