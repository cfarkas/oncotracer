name: Apply simplified documentation commands on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  simplify-test-commit:
    if: github.head_ref == 'agent/simplify-all-doc-commands'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/simplify-all-doc-commands
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute the versioned simplification script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-simple-doc-commands.yml').read_text(encoding='utf-8')
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n"
          if marker_start not in workflow or marker_end not in workflow:
              raise SystemExit('Unable to locate the embedded documentation script')
          embedded = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          exec(compile(script, 'apply-simple-doc-commands.py', 'exec'), {})
          PY

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/apply-simple-doc-commands.yml
          rm -f .github/workflows/apply-simple-doc-commands-on-pr.yml

      - name: Validate the simplified documentation
        run: |
          python3 tests/test_docs_style.py
          python3 tests/test_examples_start_from_clone.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict
          ! grep -R -n -E 'REPO_DIR|/path/to/my/directory/oncotracer|/home/student/oncotracer' \
            README.md docs examples params

      - name: Commit and push all documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs examples params tests .github/workflows
          git commit -m "Docs: simplify all commands to clone and cd oncotracer"
          git push origin HEAD:agent/simplify-all-doc-commands
