name: Apply simplified documentation commands on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  simplify-test-commit:
    if: github.head_ref == 'agent/simplify-all-doc-commands'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/simplify-all-doc-commands
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize the generated test templates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/simplify_public_docs.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          normalized = []
          for line in lines:
              if line.lstrip().startswith("r'''") and line.rstrip().endswith('\\'):
                  line = line.rstrip('\\')
              normalized.append(line)
          path.write_text('\n'.join(normalized) + '\n', encoding='utf-8')
          PY

      - name: Simplify all public documentation
        run: python3 tools/simplify_public_docs.py

      - name: Remove temporary files
        run: |
          rm -f .github/workflows/apply-simple-doc-commands.yml
          rm -f .github/workflows/apply-simple-doc-commands-on-pr.yml
          rm -f tools/simplify_public_docs.py

      - name: Validate the simplified documentation
        run: |
          python3 tests/test_docs_style.py
          python3 tests/test_examples_start_from_clone.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict
          ! grep -R -n -E 'REPO_DIR|/path/to/my/directory/oncotracer|/home/student/oncotracer' \
            README.md docs examples params

      - name: Commit and push all documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs examples params tests .github/workflows tools
          git commit -m "Docs: simplify all commands to clone and cd oncotracer"
          git push origin HEAD:agent/simplify-all-doc-commands
