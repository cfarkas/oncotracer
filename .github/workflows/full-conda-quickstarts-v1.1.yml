name: Full v1.1 QuickStart 1 across Docker, Poetry, and Conda

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: full-v1.1-quickstart1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  superseded:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel obsolete v1.1 matrix on the native-v2 candidate
        run: echo 'Superseded by the audited native v2 QuickStart 1 parity workflow.'
