name: Export v1.1 branch tree metadata

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: export-v1.1-tree-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.head_ref == 'agent/conda-docs-v1.1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/conda-docs-v1.1
          fetch-depth: 0

      - name: Record the exact commit and tree objects
        run: |
          mkdir -p "$RUNNER_TEMP/v1.1-tree-metadata"
          git rev-parse HEAD > "$RUNNER_TEMP/v1.1-tree-metadata/head.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/v1.1-tree-metadata/tree.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/v1.1-tree-metadata/ls-tree.txt"
          cat "$RUNNER_TEMP/v1.1-tree-metadata/head.txt"
          cat "$RUNNER_TEMP/v1.1-tree-metadata/tree.txt"

      - name: Upload tree metadata
        uses: actions/upload-artifact@v4
        with:
          name: v1.1-tree-metadata-${{ github.run_id }}
          retention-days: 7
          path: ${{ runner.temp }}/v1.1-tree-metadata/
