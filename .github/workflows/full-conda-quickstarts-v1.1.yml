name: Full Conda QuickStarts for v1.1

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conda-v1.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paused:
    name: Conda validation paused for compatibility repairs
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Conda validation is temporarily paused while qDNAseq compatibility is repaired."
