name: Apply pending runtime compatibility patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-runtime-v1.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/conda-docs-v1.1' || github.ref_name == 'agent/conda-docs-v1.1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/conda-docs-v1.1
          fetch-depth: 0

      - name: Execute the versioned patch recipe and install smoke tests
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          recipe_path = Path('.github/workflows/apply-runtime-v1.1.yml')
          if not recipe_path.is_file():
              raise SystemExit(f'missing patch recipe: {recipe_path}')
          data = yaml.safe_load(recipe_path.read_text(encoding='utf-8'))
          steps = data['jobs']['patch']['steps']
          run_steps = [step for step in steps if 'run' in step]
          if len(run_steps) < 2:
              raise SystemExit('patch recipe does not contain the expected run steps')

          for step in run_steps[:-1]:
              print(f"\n=== {step.get('name', 'patch step')} ===", flush=True)
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', step['run']],
                  check=True,
              )

          smoke = r'''name: Runtime compatibility smoke for v1.1

          on:
            pull_request:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: runtime-smoke-v1.1-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            poetry-smoke:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                - name: Install and test the Poetry launcher
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install 'poetry>=2,<3'
                    poetry check --lock
                    poetry install --no-interaction
                    poetry run python tests/test_poetry_cli.py
                    poetry run oncotracer --repo-dir "$GITHUB_WORKSPACE" --print-command --make_test \
                      --test_root "$GITHUB_WORKSPACE/test/poetry-smoke"

            conda-smoke:
              runs-on: ubuntu-24.04
              timeout-minutes: 90
              defaults:
                run:
                  shell: bash -el {0}
              steps:
                - uses: actions/checkout@v4
                - uses: conda-incubator/setup-miniconda@v3
                  with:
                    miniforge-version: latest
                    activate-environment: base
                    auto-activate: true
                    conda-remove-defaults: true
                - name: Solve and create the complete OncoTracer environment
                  run: |
                    conda config --set channel_priority strict
                    conda env create --prefix "$RUNNER_TEMP/oncotracer-v1.1" --file environment.yml
                - name: Verify qDNAseq, local SAMURAI helpers, and hg38 annotations
                  run: |
                    ENV_PREFIX="$RUNNER_TEMP/oncotracer-v1.1"
                    conda run --prefix "$ENV_PREFIX" Rscript --vanilla -e '
                      required <- c("Biobase","QDNAseq","argparser","future","R.cache","readr","dplyr","ggplot2","scales","yaml");
                      missing <- required[!vapply(required, requireNamespace, logical(1), quietly=TRUE)];
                      if (length(missing)) stop(paste(missing, collapse=","));
                      cat("R_CONDA_COMPAT_OK\n")'
                    conda run --prefix "$ENV_PREFIX" python -c 'import janitor,natsort,openpyxl,pandas,pandera,polars,typer; print("PYTHON_CONDA_COMPAT_OK")'
                    conda run --prefix "$ENV_PREFIX" bash tests/test_qdnaseq_conda_compat.sh
                    BIN_RDS="$(conda run --prefix "$ENV_PREFIX" bash bin/scripts/prepare_qdnaseq_bin_data.sh \
                      --binsize 100 --cache-dir "$RUNNER_TEMP/qdnaseq-bin-data" | tail -n 1)"
                    test -s "$BIN_RDS"
                    conda run --prefix "$ENV_PREFIX" Rscript --vanilla -e \
                      'x <- readRDS(commandArgs(TRUE)[1]); stopifnot(nrow(x) > 0); cat(nrow(x), "bins\n")' \
                      "$BIN_RDS"
          '''
          workflow_path = Path('.github/workflows/full-conda-quickstarts-v1.1.yml')
          workflow_path.write_text(smoke, encoding='utf-8')
          subprocess.run(['git', 'add', str(workflow_path)], check=True)

          final_step = run_steps[-1]
          print(f"\n=== {final_step.get('name', 'commit step')} ===", flush=True)
          subprocess.run(
              ['bash', '-euo', 'pipefail', '-c', final_step['run']],
              check=True,
          )
          PY
