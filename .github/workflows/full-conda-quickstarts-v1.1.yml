name: Build v1.1 runtime patch artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-v1.1-runtime-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.head_ref == 'agent/conda-docs-v1.1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/conda-docs-v1.1
          fetch-depth: 0

      - name: Fix Conda preflight ordering and apply source patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/patch_runtime_v1_1.py')
          text = path.read_text(encoding='utf-8')
          start_token = "    replace_once(\n        path,\n        'command -v samtools"
          next_token = "    replace_once(\n        path,\n        'echo \"Detected Illumina read layout"
          start = text.find(start_token)
          end = text.find(next_token, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the early Illumina Conda preflight patch block')
          text = text[:start] + text[end:]

          old = "        '''echo \"Detected Illumina read layout: $READ_LAYOUT-end\"\n\nQDNASEQ_BIN_ARGS=()"
          new = """        '''echo \"Detected Illumina read layout: $READ_LAYOUT-end\"

if [[ \"$SAMURAI_PROFILE\" == \"conda\" ]]; then
  command -v Rscript >/dev/null 2>&1 || { echo \"ERROR: the OncoTracer Conda environment is missing Rscript\" >&2; exit 1; }
  Rscript --vanilla - <<'RS_CONDA_CHECK'
required <- c(\"Biobase\", \"QDNAseq\", \"argparser\", \"future\", \"R.cache\")
missing <- required[!vapply(required, requireNamespace, logical(1), quietly = TRUE)]
if (length(missing)) stop(\"Missing Conda R package(s): \", paste(missing, collapse = \", \"))
RS_CONDA_CHECK
  command -v qpdf >/dev/null 2>&1 || { echo \"ERROR: the OncoTracer Conda environment is missing qpdf\" >&2; exit 1; }
fi

QDNASEQ_BIN_ARGS=()"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one post-validation insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 .github/scripts/patch_runtime_v1_1.py
          chmod +x \
            bin/scripts/prepare_qdnaseq_bin_data.sh \
            examples/quickstart/verify_outputs.py \
            examples/hcc1143_lpwgs/verify_outputs.py \
            tests/test_qdnaseq_conda_compat.sh

      - name: Generate and test the Poetry lock file
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "poetry>=2,<3"
          poetry lock
          poetry check --lock
          poetry install --no-interaction
          poetry run python tests/test_poetry_cli.py
          mkdir -p "$RUNNER_TEMP/fake-bin"
          printf '#!/usr/bin/env bash\nexit 0\n' > "$RUNNER_TEMP/fake-bin/nextflow"
          chmod +x "$RUNNER_TEMP/fake-bin/nextflow"
          PATH="$RUNNER_TEMP/fake-bin:$PATH" \
            poetry run oncotracer --repo-dir "$GITHUB_WORKSPACE" --print-command --make_test \
              --test_root "$GITHUB_WORKSPACE/test/poetry-command-check"

      - name: Run fast source and documentation tests
        run: |
          find bin examples tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m compileall -q bin examples oncotracer_cli tests
          bash tests/test_generate_auto_params.sh
          bash tests/test_illumina_pon_preflight.sh
          bash tests/test_qdnaseq_local_pon.sh
          bash tests/test_qdnaseq_conda_compat.sh
          python3 tests/test_docs_style.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict
          git diff --check

      - name: Prepare the reviewed patch artifact
        run: |
          cp .github/templates/runtime-smoke-v1.1.yml \
            .github/workflows/full-conda-quickstarts-v1.1.yml
          rm -f \
            .github/workflows/apply-v1.1-now.yml \
            .github/workflows/apply-runtime-v1.1.yml \
            .github/scripts/patch_runtime_v1_1.py
          mkdir -p "$RUNNER_TEMP/v1.1-runtime-patch"
          git diff --binary -- . ':!site' > "$RUNNER_TEMP/v1.1-runtime-patch/changes.patch"
          git diff --name-status -- . ':!site' > "$RUNNER_TEMP/v1.1-runtime-patch/name-status.tsv"
          tar --exclude=.git --exclude=site --exclude=test --exclude='__pycache__' \
            -czf "$RUNNER_TEMP/v1.1-runtime-patch/repository-files.tar.gz" .

      - name: Upload the reviewed patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1.1-runtime-patch-${{ github.run_id }}
          retention-days: 14
          include-hidden-files: true
          path: ${{ runner.temp }}/v1.1-runtime-patch/
