name: Full v1.1 QuickStart 1 across Docker, Poetry, and Conda

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-v1.1-quickstart1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_ANSI_LOG: "false"
  NXF_DISABLE_CHECK_LATEST: "true"
  NXF_OPTS: "-Xms256m -Xmx1g"
  NXF_GITHUB_TOKEN: ${{ github.token }}
  PIP_NO_CACHE_DIR: "1"

jobs:
  validate:
    name: ${{ matrix.route }} / QuickStart 1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        route:
          - docker
          - poetry
          - conda
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Miniforge for the Conda route
        if: matrix.route == 'conda'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate: true
          conda-remove-defaults: true

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            samtools bwa minimap2 pigz curl wget git
          curl -fsSL https://get.nextflow.io | bash
          sudo install -m 0755 nextflow /usr/local/bin/nextflow

          git --version
          java -version
          python3 --version
          nextflow -version
          samtools --version | sed -n '1,3p'
          (bwa 2>&1 || true) | sed -n '1,3p'
          minimap2 --version
          pigz --version
          echo "Host Docker identity: $(id -u):$(id -g)"

      - name: Configure the selected route
        run: |
          if [[ '${{ matrix.route }}' == 'conda' ]]; then
            conda config --set channel_priority strict
            conda config --set solver libmamba
            conda --version
            conda info
          elif [[ '${{ matrix.route }}' == 'poetry' ]]; then
            python3 -m pip install --upgrade pip
            python3 -m pip install "poetry>=2,<3"
            poetry check --lock
            poetry install --no-interaction
            poetry run python tests/test_poetry_cli.py
            poetry run oncotracer --help
            docker info
            docker pull carlosfarkas/oncotracer:latest
          else
            docker info
            docker pull carlosfarkas/oncotracer:latest
          fi

      - name: Add memory headroom for hg38 indexing
        run: |
          if [[ ! -e /swapfile.oncotracer-v1.1 ]]; then
            sudo fallocate -l 24G /swapfile.oncotracer-v1.1
            sudo chmod 600 /swapfile.oncotracer-v1.1
            sudo mkswap /swapfile.oncotracer-v1.1
            sudo swapon /swapfile.oncotracer-v1.1 || true
          fi
          sudo sysctl -w vm.swappiness=100 || true
          nproc
          free -h
          swapon --show || true
          df -h

      - name: Define isolated test paths
        run: |
          TEST_ROOT="$GITHUB_WORKSPACE/test/v1.1-${{ matrix.route }}-quickstart1"
          mkdir -p "$TEST_ROOT/work" "$TEST_ROOT/reports"
          {
            echo "TEST_ROOT=$TEST_ROOT"
            echo "ROUTE=${{ matrix.route }}"
          } >> "$GITHUB_ENV"

      - name: Prepare public reads and QuickStart configurations
        run: |
          set -Eeuo pipefail
          if [[ "$ROUTE" == 'poetry' ]]; then
            poetry run oncotracer --repo-dir "$GITHUB_WORKSPACE" --backend docker \
              --make_test \
              --lpwgs_root "$TEST_ROOT" \
              --test_root "$TEST_ROOT" \
              -work-dir "$TEST_ROOT/work/prepare"
          elif [[ "$ROUTE" == 'conda' ]]; then
            nextflow run "$GITHUB_WORKSPACE/main.nf" --conda \
              --make_test \
              --lpwgs_root "$TEST_ROOT" \
              --test_root "$TEST_ROOT" \
              -work-dir "$TEST_ROOT/work/prepare"
          else
            nextflow run "$GITHUB_WORKSPACE/main.nf" --docker \
              --make_test \
              --lpwgs_root "$TEST_ROOT" \
              --test_root "$TEST_ROOT" \
              -work-dir "$TEST_ROOT/work/prepare"
          fi

          test -s "$TEST_ROOT/configs/illumina.quickstart.yml"
          test -s "$TEST_ROOT/configs/ont.quickstart.yml"
          gzip -t \
            "$TEST_ROOT/public/illumina_ERR12341627/ERR12341627_1.fastq.gz" \
            "$TEST_ROOT/public/illumina_ERR12341627/ERR12341627_2.fastq.gz" \
            "$TEST_ROOT/public/ont_DRR165691/fastq_pass/barcode01/DRR165691_1.fastq.gz"
          sed -n '1,160p' "$TEST_ROOT/configs/illumina.quickstart.yml"
          sed -n '1,160p' "$TEST_ROOT/configs/ont.quickstart.yml"

      - name: Limit nested SAMURAI resources to the hosted runner
        run: |
          for nested_home in \
            "$TEST_ROOT/runs/illumina/01_samurai_illumina/.nextflow" \
            "$TEST_ROOT/runs/ont/01_samurai_ont/.nextflow"; do
            mkdir -p "$nested_home"
            cat > "$nested_home/config" <<'EOF_CONFIG'
          process {
            resourceLimits = [
              cpus: 4,
              memory: '14.GB',
              time: '6.h'
            ]
          }
          conda {
            useMamba = false
          }
          EOF_CONFIG
          done

      - name: Run complete QuickStart 1
        run: |
          set -Eeuo pipefail

          run_config() {
            local config="$1" work="$2" label="$3"
            if [[ "$ROUTE" == 'poetry' ]]; then
              poetry run oncotracer --repo-dir "$GITHUB_WORKSPACE" --backend docker \
                -params-file "$config" \
                -work-dir "$work" \
                -with-report "$TEST_ROOT/reports/${label}.report.html" \
                -with-timeline "$TEST_ROOT/reports/${label}.timeline.html" \
                -with-trace "$TEST_ROOT/reports/${label}.trace.tsv" \
                -resume
            elif [[ "$ROUTE" == 'conda' ]]; then
              nextflow run "$GITHUB_WORKSPACE/main.nf" --conda \
                -params-file "$config" \
                -work-dir "$work" \
                -with-report "$TEST_ROOT/reports/${label}.report.html" \
                -with-timeline "$TEST_ROOT/reports/${label}.timeline.html" \
                -with-trace "$TEST_ROOT/reports/${label}.trace.tsv" \
                -resume
            else
              nextflow run "$GITHUB_WORKSPACE/main.nf" --docker \
                -params-file "$config" \
                -work-dir "$work" \
                -with-report "$TEST_ROOT/reports/${label}.report.html" \
                -with-timeline "$TEST_ROOT/reports/${label}.timeline.html" \
                -with-trace "$TEST_ROOT/reports/${label}.trace.tsv" \
                -resume
            fi
          }

          run_config \
            "$TEST_ROOT/configs/illumina.quickstart.yml" \
            "$TEST_ROOT/work/illumina" \
            illumina
          run_config \
            "$TEST_ROOT/configs/ont.quickstart.yml" \
            "$TEST_ROOT/work/ont" \
            ont

      - name: Verify QuickStart 1 outputs
        run: |
          python3 "$GITHUB_WORKSPACE/examples/quickstart/verify_outputs.py" \
            --test-root "$TEST_ROOT"

          samtools quickcheck -v \
            "$TEST_ROOT/runs/illumina/01_samurai_illumina/alignment/ERR12341627.bam" \
            "$TEST_ROOT/runs/ont/01_samurai_ont/bam/DRR165691.sorted.bam"

          test -s "$TEST_ROOT/runs/illumina/03_cna_codification/cna_events.tsv"
          test -s "$TEST_ROOT/runs/illumina/04_cna_custom_plots/cna_per_sample_pages.pdf"
          test -s "$TEST_ROOT/runs/ont/03_cna_codification/cna_events.tsv"
          test -s "$TEST_ROOT/runs/ont/04_cna_custom_plots/cna_per_sample_pages.pdf"

          cat "$TEST_ROOT/runs/illumina/06_workflow_summary/workflow_summary.txt"
          cat "$TEST_ROOT/runs/ont/06_workflow_summary/workflow_summary.txt"

      - name: Verify route and source-cache state
        run: |
          SAMURAI_SOURCE="$TEST_ROOT/.oncotracer/samurai/v1.4.0"
          test -s "$SAMURAI_SOURCE/main.nf"
          grep -qx 'cache_format=2' "$SAMURAI_SOURCE/.oncotracer-source"
          grep -F 'channel.fromPath(params.dict)' "$SAMURAI_SOURCE/main.nf"

          if [[ "$ROUTE" == 'conda' ]]; then
            test -d "$TEST_ROOT/.oncotracer/conda"
            find "$TEST_ROOT/.oncotracer/conda" \
              -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .
          elif [[ "$ROUTE" == 'poetry' ]]; then
            poetry run oncotracer --help >/dev/null
            docker info >/dev/null
          else
            docker info >/dev/null
          fi

          du -h -d 3 "$TEST_ROOT" | sort -h | tail -50
          df -h

      - name: Upload validation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.1-${{ matrix.route }}-quickstart1-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: |
            .nextflow.log*
            test/v1.1-${{ matrix.route }}-quickstart1/configs/**
            test/v1.1-${{ matrix.route }}-quickstart1/reports/**
            test/v1.1-${{ matrix.route }}-quickstart1/.oncotracer/samurai/**/.oncotracer-source
            test/v1.1-${{ matrix.route }}-quickstart1/runs/**/06_workflow_summary/**
            test/v1.1-${{ matrix.route }}-quickstart1/runs/**/03_cna_codification/cna_events.tsv
            test/v1.1-${{ matrix.route }}-quickstart1/runs/**/01_samurai_*/logs/**
            test/v1.1-${{ matrix.route }}-quickstart1/runs/**/01_samurai_*/nextflow_launch/.nextflow.log
