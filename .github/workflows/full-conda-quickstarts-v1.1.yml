name: Full Conda QuickStarts for v1.1

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conda-v1.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -el {0}

env:
  NXF_ANSI_LOG: "false"
  NXF_DISABLE_CHECK_LATEST: "true"
  NXF_OPTS: "-Xms256m -Xmx1g"
  PIP_NO_CACHE_DIR: "1"

jobs:
  quickstart1-conda:
    name: QuickStart 1 — Conda Illumina and ONT
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate-base: true

      - name: Install host launchers and configure Conda
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            samtools bwa minimap2 pigz curl wget

          curl -fsSL https://get.nextflow.io | bash
          sudo install -m 0755 nextflow /usr/local/bin/nextflow

          conda config --set channel_priority strict
          conda config --set solver libmamba

          git --version
          java -version
          nextflow -version
          conda --version
          conda info
          samtools --version | sed -n '1,3p'
          (bwa 2>&1 || true) | sed -n '1,3p'
          minimap2 --version
          pigz --version

      - name: Add memory headroom for hg38 indexing
        run: |
          if [[ ! -e /swapfile.oncotracer-conda ]]; then
            sudo fallocate -l 32G /swapfile.oncotracer-conda
            sudo chmod 600 /swapfile.oncotracer-conda
            sudo mkswap /swapfile.oncotracer-conda
            sudo swapon /swapfile.oncotracer-conda || true
          fi

          sudo sysctl -w vm.swappiness=100 || true
          nproc
          free -h
          swapon --show || true
          df -h

      - name: Prepare the public QuickStart 1 data through Conda
        run: |
          set -Eeuo pipefail
          umask 000
          TEST_ROOT="$GITHUB_WORKSPACE/test/conda-quickstart1"
          mkdir -p "$TEST_ROOT/work/prepare" "$TEST_ROOT/reports"

          nextflow run "$GITHUB_WORKSPACE/main.nf" \
            --make_test \
            --conda \
            --lpwgs_root "$TEST_ROOT" \
            --test_root "$TEST_ROOT" \
            -work-dir "$TEST_ROOT/work/prepare"

          test -s "$TEST_ROOT/configs/illumina.quickstart.yml"
          test -s "$TEST_ROOT/configs/ont.quickstart.yml"
          gzip -t \
            "$TEST_ROOT/public/illumina_ERR12341627/ERR12341627_1.fastq.gz" \
            "$TEST_ROOT/public/illumina_ERR12341627/ERR12341627_2.fastq.gz" \
            "$TEST_ROOT/public/ont_DRR165691/fastq_pass/barcode01/DRR165691_1.fastq.gz"

          sed -n '1,160p' "$TEST_ROOT/configs/illumina.quickstart.yml"
          sed -n '1,160p' "$TEST_ROOT/configs/ont.quickstart.yml"

      - name: Limit nested SAMURAI resources
        run: |
          TEST_ROOT="$GITHUB_WORKSPACE/test/conda-quickstart1"

          for nested_home in \
            "$TEST_ROOT/runs/illumina/01_samurai_illumina/.nextflow" \
            "$TEST_ROOT/runs/ont/01_samurai_ont/.nextflow"; do
            mkdir -p "$nested_home"
            cat > "$nested_home/config" <<'EOF_CONFIG'
          process {
            resourceLimits = [
              cpus: 4,
              memory: '14.GB',
              time: '6.h'
            ]
          }
          conda {
            useMamba = false
          }
          EOF_CONFIG
          done

      - name: Run the complete Illumina QuickStart 1 workflow with Conda
        run: |
          set -Eeuo pipefail
          umask 000
          TEST_ROOT="$GITHUB_WORKSPACE/test/conda-quickstart1"
          MONITOR_LOG="$TEST_ROOT/reports/illumina-host-resources.log"

          (
            while true; do
              printf '\n[Illumina Conda heartbeat] %s\n' "$(date --iso-8601=seconds)"
              free -h
              swapon --show || true
              df -h /
              ps -eo pid,ppid,pcpu,pmem,rss,vsz,comm --sort=-rss | head -15 || true
              sleep 60
            done
          ) 2>&1 | tee -a "$MONITOR_LOG" &
          MONITOR_PID=$!
          cleanup_monitor() {
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
          }
          trap cleanup_monitor EXIT

          nextflow run "$GITHUB_WORKSPACE/main.nf" \
            --conda \
            -params-file "$TEST_ROOT/configs/illumina.quickstart.yml" \
            -work-dir "$TEST_ROOT/work/illumina" \
            -with-report "$TEST_ROOT/reports/illumina.report.html" \
            -with-timeline "$TEST_ROOT/reports/illumina.timeline.html" \
            -with-trace "$TEST_ROOT/reports/illumina.trace.tsv" \
            -resume

          cat "$TEST_ROOT/runs/illumina/06_workflow_summary/workflow_summary.txt"

      - name: Run the complete ONT QuickStart 1 workflow with Conda
        run: |
          set -Eeuo pipefail
          umask 000
          TEST_ROOT="$GITHUB_WORKSPACE/test/conda-quickstart1"
          MONITOR_LOG="$TEST_ROOT/reports/ont-host-resources.log"

          (
            while true; do
              printf '\n[ONT Conda heartbeat] %s\n' "$(date --iso-8601=seconds)"
              free -h
              swapon --show || true
              df -h /
              ps -eo pid,ppid,pcpu,pmem,rss,vsz,comm --sort=-rss | head -15 || true
              sleep 60
            done
          ) 2>&1 | tee -a "$MONITOR_LOG" &
          MONITOR_PID=$!
          cleanup_monitor() {
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
          }
          trap cleanup_monitor EXIT

          nextflow run "$GITHUB_WORKSPACE/main.nf" \
            --conda \
            -params-file "$TEST_ROOT/configs/ont.quickstart.yml" \
            -work-dir "$TEST_ROOT/work/ont" \
            -with-report "$TEST_ROOT/reports/ont.report.html" \
            -with-timeline "$TEST_ROOT/reports/ont.timeline.html" \
            -with-trace "$TEST_ROOT/reports/ont.trace.tsv" \
            -resume

          cat "$TEST_ROOT/runs/ont/06_workflow_summary/workflow_summary.txt"

      - name: Verify all QuickStart 1 outputs and Conda environments
        run: |
          set -Eeuo pipefail
          TEST_ROOT="$GITHUB_WORKSPACE/test/conda-quickstart1"

          python3 "$GITHUB_WORKSPACE/examples/quickstart/verify_outputs.py" \
            --test-root "$TEST_ROOT" \
            | tee "$TEST_ROOT/reports/quickstart1-verification.txt"

          ILLUMINA_BAM="$TEST_ROOT/runs/illumina/01_samurai_illumina/alignment/ERR12341627.bam"
          ONT_BAM="$TEST_ROOT/runs/ont/01_samurai_ont/bam/DRR165691.sorted.bam"
          test -s "$ILLUMINA_BAM"
          test -s "$ONT_BAM"
          samtools quickcheck -v "$ILLUMINA_BAM" "$ONT_BAM"

          test -d "$TEST_ROOT/.oncotracer/conda"
          find "$TEST_ROOT/.oncotracer/conda" \
            -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .

          {
            echo "commit=$GITHUB_SHA"
            echo "runtime=conda"
            echo "quickstart=1"
            conda --version
            nextflow -version
            find "$TEST_ROOT/.oncotracer/conda" \
              -mindepth 1 -maxdepth 1 -type d -printf 'environment=%f\n' | sort
          } > "$TEST_ROOT/reports/conda-validation.txt"

          cat "$TEST_ROOT/reports/conda-validation.txt"
          du -h -d 3 "$TEST_ROOT" | sort -h | tail -50
          df -h

      - name: Upload QuickStart 1 Conda validation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart1-conda-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: |
            .nextflow.log*
            test/conda-quickstart1/configs/**
            test/conda-quickstart1/reports/**
            test/conda-quickstart1/runs/*/06_workflow_summary/**
            test/conda-quickstart1/runs/*/03_cna_codification/cna_events.tsv
            test/conda-quickstart1/runs/*/01_samurai_*/logs/**
            test/conda-quickstart1/runs/*/01_samurai_*/nextflow_launch/.nextflow.log
            test/conda-quickstart1/runs/*/01_samurai_*/results/pipeline_info/**

  quickstart2-conda:
    name: QuickStart 2 — Conda HCC1143 cohort
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate-base: true

      - name: Install host launchers and configure Conda
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            samtools bwa minimap2 pigz curl wget

          curl -fsSL https://get.nextflow.io | bash
          sudo install -m 0755 nextflow /usr/local/bin/nextflow

          conda config --set channel_priority strict
          conda config --set solver libmamba

          git --version
          java -version
          nextflow -version
          conda --version
          conda info
          samtools --version | sed -n '1,3p'

      - name: Add memory headroom for hg38 indexing
        run: |
          if [[ ! -e /swapfile.oncotracer-conda ]]; then
            sudo fallocate -l 32G /swapfile.oncotracer-conda
            sudo chmod 600 /swapfile.oncotracer-conda
            sudo mkswap /swapfile.oncotracer-conda
            sudo swapon /swapfile.oncotracer-conda || true
          fi

          sudo sysctl -w vm.swappiness=100 || true
          nproc
          free -h
          swapon --show || true
          df -h

      - name: Download all six HCC1143 FASTQs
        run: |
          set -Eeuo pipefail
          TEST_ROOT="$GITHUB_WORKSPACE/test/conda-quickstart2"
          READS_DIR="$TEST_ROOT/public/hcc1143_lpwgs"
          mkdir -p "$READS_DIR" "$TEST_ROOT/reports"

          while IFS=$'\t' read -r sample treatment accession read filename bytes md5 url; do
            [[ "$sample" == "sample_name" ]] && continue
            curl --fail --location --retry 5 --retry-all-errors --continue-at - \
              --output "$READS_DIR/$filename" \
              "$url"
          done < "$GITHUB_WORKSPACE/examples/hcc1143_lpwgs/manifest.tsv"

      - name: Validate HCC1143 FASTQs and create samples.csv
        run: |
          set -Eeuo pipefail
          TEST_ROOT="$GITHUB_WORKSPACE/test/conda-quickstart2"
          READS_DIR="$TEST_ROOT/public/hcc1143_lpwgs"
          cd "$READS_DIR"

          md5sum -c "$GITHUB_WORKSPACE/examples/hcc1143_lpwgs/checksums.md5"
          gzip -t \
            HCC1143_DMSO_R1.fastq.gz HCC1143_DMSO_R2.fastq.gz \
            HCC1143_BEZ235_R1.fastq.gz HCC1143_BEZ235_R2.fastq.gz \
            HCC1143_TRAMETINIB_R1.fastq.gz HCC1143_TRAMETINIB_R2.fastq.gz

          cat > "$READS_DIR/samples.csv" <<'CSV'
          sample_name,status
          HCC1143_DMSO,TUMOR
          HCC1143_BEZ235,TUMOR
          HCC1143_TRAMETINIB,TUMOR
          CSV

          cat "$READS_DIR/samples.csv"

      - name: Run HCC1143 Automatic Setup through Conda
        run: |
          set -Eeuo pipefail
          TEST_ROOT="$GITHUB_WORKSPACE/test/conda-quickstart2"
          READS_DIR="$TEST_ROOT/public/hcc1143_lpwgs"

          nextflow run "$GITHUB_WORKSPACE/main.nf" \
            --auto_params \
            --conda \
            --lpwgs_root "$TEST_ROOT" \
            --mode illumina \
            --reads_folder "$READS_DIR" \
            --sample_table "$READS_DIR/samples.csv" \
            --auto_config_dir "$TEST_ROOT/configs/hcc1143_lpwgs" \
            --auto_outdir "$TEST_ROOT/runs/hcc1143_lpwgs" \
            -work-dir "$TEST_ROOT/work/hcc1143_lpwgs_auto"

          sed -n '1,160p' "$TEST_ROOT/configs/hcc1143_lpwgs/illumina.auto.yml"
          cat "$TEST_ROOT/configs/hcc1143_lpwgs/illumina.samplesheet.csv"
          cat "$TEST_ROOT/configs/hcc1143_lpwgs/auto_params_manifest.tsv"

      - name: Validate generated HCC1143 configuration
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          root = Path.cwd() / "test/conda-quickstart2"
          config_dir = root / "configs/hcc1143_lpwgs"
          expected = {
              "HCC1143_DMSO",
              "HCC1143_BEZ235",
              "HCC1143_TRAMETINIB",
          }

          yaml_path = config_dir / "illumina.auto.yml"
          sheet_path = config_dir / "illumina.samplesheet.csv"
          manifest_path = config_dir / "auto_params_manifest.tsv"
          for path in (yaml_path, sheet_path, manifest_path):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty generated file: {path}")

          with sheet_path.open(newline="") as handle:
              rows = list(csv.DictReader(handle))
          if {row["sample"] for row in rows} != expected or len(rows) != 3:
              raise SystemExit(f"unexpected generated samplesheet rows: {rows}")
          for row in rows:
              if row.get("status", "").lower() != "tumor":
                  raise SystemExit(f"unexpected status in generated samplesheet: {row}")
              for column in ("fastq_1", "fastq_2"):
                  path = Path(row[column])
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f"missing FASTQ referenced by samplesheet: {path}")

          print("PASS: Automatic Setup generated the expected three paired HCC1143 samples")
          PY

      - name: Limit nested HCC1143 SAMURAI resources
        run: |
          NESTED_HOME="$GITHUB_WORKSPACE/test/conda-quickstart2/runs/hcc1143_lpwgs/01_samurai_illumina/.nextflow"
          mkdir -p "$NESTED_HOME"
          cat > "$NESTED_HOME/config" <<'EOF_CONFIG'
          process {
            resourceLimits = [
              cpus: 4,
              memory: '14.GB',
              time: '6.h'
            ]
          }
          conda {
            useMamba = false
          }
          EOF_CONFIG

      - name: Run the complete HCC1143 QuickStart 2 workflow with Conda
        run: |
          set -Eeuo pipefail
          umask 000
          TEST_ROOT="$GITHUB_WORKSPACE/test/conda-quickstart2"
          MONITOR_LOG="$TEST_ROOT/reports/hcc1143-host-resources.log"

          (
            while true; do
              printf '\n[HCC1143 Conda heartbeat] %s\n' "$(date --iso-8601=seconds)"
              free -h
              swapon --show || true
              df -h /
              ps -eo pid,ppid,pcpu,pmem,rss,vsz,comm --sort=-rss | head -15 || true
              sleep 60
            done
          ) 2>&1 | tee -a "$MONITOR_LOG" &
          MONITOR_PID=$!
          cleanup_monitor() {
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
          }
          trap cleanup_monitor EXIT

          nextflow run "$GITHUB_WORKSPACE/main.nf" \
            --conda \
            -params-file "$TEST_ROOT/configs/hcc1143_lpwgs/illumina.auto.yml" \
            -work-dir "$TEST_ROOT/work/hcc1143_lpwgs" \
            -with-report "$TEST_ROOT/reports/hcc1143.report.html" \
            -with-timeline "$TEST_ROOT/reports/hcc1143.timeline.html" \
            -with-trace "$TEST_ROOT/reports/hcc1143.trace.tsv" \
            -resume

      - name: Verify all QuickStart 2 outputs and Conda environments
        run: |
          set -Eeuo pipefail
          TEST_ROOT="$GITHUB_WORKSPACE/test/conda-quickstart2"
          OUT="$TEST_ROOT/runs/hcc1143_lpwgs"

          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd() / "test/conda-quickstart2"
          out = root / "runs/hcc1143_lpwgs"
          expected = (
              "HCC1143_DMSO",
              "HCC1143_BEZ235",
              "HCC1143_TRAMETINIB",
          )
          required = (
              out / "01_samurai_illumina/qdnaseq/all_segments.seg",
              out / "03_cna_codification/cna_events.tsv",
              out / "03_cna_codification/cna_cytogenomic_notation.tsv",
              out / "04_cna_custom_plots/cna_per_sample_pages.pdf",
              out / "04_cna_custom_plots/cna_log2_ratio_profiles_all_samples.pdf",
              out / "06_workflow_summary/workflow_summary.txt",
          )
          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty required output: {path}")

          bam_dir = out / "01_samurai_illumina/alignment"
          bams = [path for path in bam_dir.glob("*.bam") if path.stat().st_size > 0]
          if len(bams) != 3:
              raise SystemExit(f"expected 3 non-empty BAMs, found {len(bams)}: {bams}")
          bam_names = {path.stem for path in bams}
          missing_bams = [sample for sample in expected if sample not in bam_names]
          if missing_bams:
              raise SystemExit(f"missing sample BAMs: {missing_bams}; found {sorted(bam_names)}")

          segments = required[0].read_text(encoding="utf-8", errors="replace")
          for sample in expected:
              if sample not in segments:
                  raise SystemExit(f"sample absent from qDNAseq segments: {sample}")

          summary_lines = set(required[-1].read_text(encoding="utf-8").splitlines())
          for marker in ("mode=illumina", "dataset=illumina_qdnaseq_100kb"):
              if marker not in summary_lines:
                  raise SystemExit(f"workflow summary is missing {marker!r}")

          print("PASS: QuickStart 2 completed with Conda for all three HCC1143 libraries")
          print(f"BAMs: {', '.join(sorted(path.name for path in bams))}")
          PY

          samtools quickcheck -v "$OUT/01_samurai_illumina/alignment/"*.bam
          test -d "$TEST_ROOT/.oncotracer/conda"
          find "$TEST_ROOT/.oncotracer/conda" \
            -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .

          {
            echo "commit=$GITHUB_SHA"
            echo "runtime=conda"
            echo "quickstart=2"
            conda --version
            nextflow -version
            find "$TEST_ROOT/.oncotracer/conda" \
              -mindepth 1 -maxdepth 1 -type d -printf 'environment=%f\n' | sort
          } > "$TEST_ROOT/reports/conda-validation.txt"

          cat "$OUT/06_workflow_summary/workflow_summary.txt"
          cat "$TEST_ROOT/reports/conda-validation.txt"
          du -h -d 3 "$TEST_ROOT" | sort -h | tail -50
          df -h

      - name: Upload QuickStart 2 Conda validation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart2-conda-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: |
            .nextflow.log*
            test/conda-quickstart2/configs/**
            test/conda-quickstart2/reports/**
            test/conda-quickstart2/runs/hcc1143_lpwgs/06_workflow_summary/**
            test/conda-quickstart2/runs/hcc1143_lpwgs/03_cna_codification/cna_events.tsv
            test/conda-quickstart2/runs/hcc1143_lpwgs/01_samurai_illumina/logs/**
            test/conda-quickstart2/runs/hcc1143_lpwgs/01_samurai_illumina/nextflow_launch/.nextflow.log
            test/conda-quickstart2/runs/hcc1143_lpwgs/01_samurai_illumina/qdnaseq/all_segments.seg
