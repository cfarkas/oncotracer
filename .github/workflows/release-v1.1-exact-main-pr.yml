name: Finish exact-main QuickStart reruns and release v1.1

on:
  pull_request:
    branches:
      - agent/v1.1-orchestration-base
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: write
  contents: write

jobs:
  wait-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      TARGET_SHA: 0f1a3d86521afcb5eac3ce6e65fd45d455e8c843
      QS1_RUN_ID: 30807793560
      QS2_RUN_ID: 30807795513

    steps:
      - name: Confirm exact main and validation-run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$MAIN_SHA" == "$TARGET_SHA" ]] || {
            echo "ERROR: main is $MAIN_SHA, expected $TARGET_SHA" >&2
            exit 1
          }

          for run_id in "$QS1_RUN_ID" "$QS2_RUN_ID"; do
            RUN_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            [[ "$(jq -r '.head_sha' <<< "$RUN_JSON")" == "$TARGET_SHA" ]]
            [[ "$(jq -r '.head_branch' <<< "$RUN_JSON")" == "main" ]]
            [[ "$(jq -r '.event' <<< "$RUN_JSON")" == "workflow_dispatch" ]]
          done

      - name: Wait for and retry both exact-main workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          wait_until_complete() {
            local run_id="$1" label="$2" status conclusion attempt
            for _ in $(seq 1 700); do
              RUN_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<< "$RUN_JSON")"
              conclusion="$(jq -r '.conclusion // "pending"' <<< "$RUN_JSON")"
              attempt="$(jq -r '.run_attempt' <<< "$RUN_JSON")"
              echo "$label: status=$status conclusion=$conclusion attempt=$attempt"
              if [[ "$status" == "completed" ]]; then
                printf '%s\t%s\n' "$conclusion" "$attempt"
                return 0
              fi
              sleep 60
            done
            echo "ERROR: timed out waiting for $label" >&2
            return 1
          }

          wait_for_new_attempt() {
            local run_id="$1" old_attempt="$2" label="$3" current_attempt status
            for _ in $(seq 1 120); do
              RUN_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              current_attempt="$(jq -r '.run_attempt' <<< "$RUN_JSON")"
              status="$(jq -r '.status' <<< "$RUN_JSON")"
              if (( current_attempt > old_attempt )); then
                echo "$label retry started: attempt=$current_attempt status=$status"
                return 0
              fi
              sleep 5
            done
            echo "ERROR: retry did not start for $label" >&2
            return 1
          }

          ensure_success() {
            local run_id="$1" label="$2" max_retries=3 retries=0 result attempt
            while true; do
              IFS=$'\t' read -r result attempt <<< "$(wait_until_complete "$run_id" "$label" | tail -n 1)"
              if [[ "$result" == "success" ]]; then
                echo "PASS: $label succeeded on attempt $attempt"
                return 0
              fi

              if (( retries >= max_retries )); then
                echo "ERROR: $label remained $result after $attempt attempt(s)" >&2
                return 1
              fi

              retries=$((retries + 1))
              echo "Retrying failed or cancelled jobs for $label after conclusion=$result (attempt $attempt)"
              gh api --method POST \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun-failed-jobs" \
                >/dev/null
              wait_for_new_attempt "$run_id" "$attempt" "$label"
            done
          }

          ensure_success "$QS1_RUN_ID" "QuickStart 1"
          ensure_success "$QS2_RUN_ID" "QuickStart 2"

      - name: Verify Docker, Poetry, and Conda jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          verify_job() {
            local run_id="$1" expected="$2" result
            result="$(
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" |
                jq -r --arg name "$expected" '[.jobs[] | select(.name == $name)] | last | .conclusion // empty'
            )"
            [[ "$result" == "success" ]] || {
              echo "ERROR: $expected is $result" >&2
              exit 1
            }
            echo "PASS: $expected"
          }

          verify_job "$QS1_RUN_ID" "docker / QuickStart 1"
          verify_job "$QS1_RUN_ID" "poetry / QuickStart 1"
          verify_job "$QS1_RUN_ID" "conda / QuickStart 1"
          verify_job "$QS2_RUN_ID" "docker / QuickStart 2"
          verify_job "$QS2_RUN_ID" "poetry / QuickStart 2"
          verify_job "$QS2_RUN_ID" "conda / QuickStart 2"

      - name: Publish stable OncoTracer v1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          if gh release view v1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTING_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/v1.1" --jq '.sha')"
            [[ "$EXISTING_SHA" == "$TARGET_SHA" ]] || {
              echo "ERROR: existing v1.1 points to $EXISTING_SHA" >&2
              exit 1
            }
          else
            cat > release-notes-v1.1.md <<EOF_NOTES
          # OncoTracer v1.1

          Stable research release with Docker/Singularity, Poetry, and Conda execution routes.

          QuickStart 1 and QuickStart 2 were rerun on exact merged main commit \`$TARGET_SHA\` through Docker, Poetry with Docker, and Conda. All six route jobs and their final output verifiers passed.

          - QuickStart 1: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QS1_RUN_ID
          - QuickStart 2: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QS2_RUN_ID

          OncoTracer is for research use and is not a standalone diagnostic system.
          EOF_NOTES

            gh release create v1.1 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "OncoTracer v1.1" \
              --notes-file release-notes-v1.1.md
          fi

          TAG_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/v1.1" --jq '.sha')"
          [[ "$TAG_SHA" == "$TARGET_SHA" ]]
          gh release view v1.1 --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,publishedAt,url
