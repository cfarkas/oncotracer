name: Apply audited v2 release repair

on:
  push:
    branches:
      - agent/native-v2-parity
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-v2-release-repair
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'cfarkas/oncotracer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-v2-parity
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure the release commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Reconstruct and authenticate the audited repair
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .release-fix/apply.py.gz.b64.00 \
              .release-fix/apply.py.gz.b64.01 \
            | base64 --decode \
            | gzip --decompress --stdout \
            > .release-fix/apply.py
          printf '%s  %s\n' \
            f636a913d730a9afb2f5d2edb4eea6220f2830d388a78ed0a1ed900af3f5abb5 \
            .release-fix/apply.py \
            | sha256sum --strict --check -
          printf '%s  %s\n' \
            a0a1d5b17fc4574c6354d01c9b913ad52f4751edb4df6b4af0753d617de5feea \
            .release-fix/ichorcna_plot_compat.R \
            | sha256sum --strict --check -
          python -m py_compile .release-fix/apply.py

      - name: Apply the exact repair and create its focused commit
        shell: bash
        run: |
          set -Eeuo pipefail
          python .release-fix/apply.py . \
            --allow-head-mismatch \
            --allow-dirty \
            --commit

      - name: Run focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_ichorcna_plot_compat.py
          python -m compileall -q oncotracer_cli tests scripts
          bash -n scripts/validate_v2_release.sh
          git diff --check HEAD^ HEAD

      - name: Remove the one-shot repair machinery
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .release-fix
          rm -f .github/workflows/apply-v2-release-repair.yml
          git add -A -- .release-fix .github/workflows/apply-v2-release-repair.yml
          git commit -m 'chore(v2): remove one-shot release repair machinery'
          git status --short

      - name: Publish the repaired release-candidate branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin HEAD:agent/native-v2-parity
