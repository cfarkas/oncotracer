name: Apply final concise clone documentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  update-test-commit:
    if: github.head_ref == 'agent/final-simple-clone-docs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-simple-clone-docs
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Keep the single Automatic Setup clone introduction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/finalize_simple_clone_docs.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # Automatic Setup had two adjacent clone introductions. Keep only the first.
    if path == ROOT / "docs/auto_params.md":
        duplicate = (
            "## Before you begin\\n\\n"
            f"```bash\\n{EXACT_CLONE}\\n```\\n\\n"
        )
        text = text.replace(duplicate, "## Before you begin\\n\\n", 1)

'''
          if old not in text:
              raise SystemExit('Unable to locate the obsolete Automatic Setup deduplication block')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Apply the concise clone cleanup
        run: python3 tools/finalize_simple_clone_docs.py

      - name: Remove the temporary update files
        run: |
          rm -f tools/finalize_simple_clone_docs.py
          rm -f .github/workflows/apply-final-simple-clone-docs.yml

      - name: Validate all documentation commands
        run: |
          python3 tests/test_docs_style.py
          python3 tests/test_examples_start_from_clone.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

          ! grep -R -n -F 'Skip the clone command when the repository already exists.' \
            README.md docs examples
          ! grep -R -n -F '# Run this command from the oncotracer directory.' \
            README.md docs examples
          ! grep -R -n -F '# Run this step from the cloned oncotracer directory.' \
            README.md docs examples
          ! grep -R -n -E 'REPO_DIR=|\$REPO_DIR|pwd[[:space:]]*$|ls main\.nf' \
            README.md docs examples

      - name: Commit and push the final documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs examples tests .github/workflows tools
          git commit -m "Docs: use the minimal clone block everywhere"
          git push origin HEAD:agent/final-simple-clone-docs
