name: Validate guarded v2 release parity repairs

on:
  push:
    branches:
      - agent/v2-release-fix
    paths:
      - .github/workflows/v2-release-parity-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-release-fix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded release-gate repairs
        run: python3 scripts/apply_v2_release_parity_fixes.py

      - name: Run targeted release regression tests
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q oncotracer_cli tests scripts bin
          python3 -m unittest -v \
            tests/test_compare_native_parity.py \
            tests/test_beginner_runtime.py
          bash tests/test_runtime_portability.sh
          python3 tests/test_copy_paste_paths.py

      - name: Commit validated release-gate repairs
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/compare_native_parity.py \
            tests/verify_nested_samurai.py \
            tests/test_compare_native_parity.py
          git diff --cached --check
          git commit -m 'fix(v2): make parity gates resume-safe and signal-aware'
          git push origin HEAD:agent/v2-release-fix
