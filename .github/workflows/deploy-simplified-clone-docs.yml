name: Deploy simplified clone documentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate-and-deploy:
    if: github.head_ref == 'agent/deploy-simplified-clone-docs'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: e6e5da5ecc860a44cd067a96f354ab8d420e1966

    steps:
      - name: Check out the exact main documentation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate all documentation examples
        run: |
          python3 tests/test_docs_style.py
          python3 tests/test_examples_start_from_clone.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

          grep -F 'git clone https://github.com/cfarkas/oncotracer.git' \
            site/quick_start/index.html >/dev/null
          grep -F 'cd oncotracer' site/quick_start/index.html >/dev/null
          grep -F 'git clone https://github.com/cfarkas/oncotracer.git' \
            site/six_tumor_four_control/index.html >/dev/null
          grep -F 'cd oncotracer' site/six_tumor_four_control/index.html >/dev/null
          ! grep -R -F 'REPO_DIR=' site >/dev/null

      - name: Deploy the exact main documentation to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --clean --remote-name origin --remote-branch gh-pages
