name: Full v1.1 QuickStart 2 across Docker, Poetry, and Conda

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-v1.1-quickstart2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_ANSI_LOG: "false"
  NXF_DISABLE_CHECK_LATEST: "true"
  NXF_OPTS: "-Xms256m -Xmx1g"
  NXF_GITHUB_TOKEN: ${{ github.token }}
  PIP_NO_CACHE_DIR: "1"

jobs:
  validate:
    name: ${{ matrix.route }} / QuickStart 2
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        route:
          - docker
          - poetry
          - conda
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Miniforge for the Conda route
        if: matrix.route == 'conda'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate: true
          conda-remove-defaults: true

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            samtools bwa minimap2 pigz curl wget git
          curl -fsSL https://get.nextflow.io | bash
          sudo install -m 0755 nextflow /usr/local/bin/nextflow

          git --version
          java -version
          python3 --version
          nextflow -version
          samtools --version | sed -n '1,3p'
          (bwa 2>&1 || true) | sed -n '1,3p'
          minimap2 --version
          pigz --version
          echo "Host Docker identity: $(id -u):$(id -g)"

      - name: Configure the selected route
        run: |
          if [[ '${{ matrix.route }}' == 'conda' ]]; then
            conda config --set channel_priority strict
            conda config --set solver libmamba
            conda --version
            conda info
          elif [[ '${{ matrix.route }}' == 'poetry' ]]; then
            python3 -m pip install --upgrade pip
            python3 -m pip install "poetry>=2,<3"
            poetry check --lock
            poetry install --no-interaction
            poetry run python tests/test_poetry_cli.py
            poetry run oncotracer --help
            docker info
            docker pull carlosfarkas/oncotracer:latest
          else
            docker info
            docker pull carlosfarkas/oncotracer:latest
          fi

      - name: Add memory headroom for hg38 indexing
        run: |
          if [[ ! -e /swapfile.oncotracer-v1.1 ]]; then
            sudo fallocate -l 24G /swapfile.oncotracer-v1.1
            sudo chmod 600 /swapfile.oncotracer-v1.1
            sudo mkswap /swapfile.oncotracer-v1.1
            sudo swapon /swapfile.oncotracer-v1.1 || true
          fi
          sudo sysctl -w vm.swappiness=100 || true
          nproc
          free -h
          swapon --show || true
          df -h

      - name: Define isolated test paths
        run: |
          TEST_ROOT="$GITHUB_WORKSPACE/test/v1.1-${{ matrix.route }}-quickstart2"
          READS_DIR="$TEST_ROOT/public/hcc1143_lpwgs"
          mkdir -p "$TEST_ROOT/work" "$TEST_ROOT/reports" "$READS_DIR"
          {
            echo "TEST_ROOT=$TEST_ROOT"
            echo "READS_DIR=$READS_DIR"
            echo "ROUTE=${{ matrix.route }}"
          } >> "$GITHUB_ENV"

      - name: Download and validate all six HCC1143 FASTQs
        run: |
          set -Eeuo pipefail

          while IFS=$'\t' read -r sample treatment accession read_number filename bytes md5 url; do
            [[ "$sample" == 'sample_name' ]] && continue
            curl --fail --location --retry 5 --retry-all-errors --continue-at - \
              --output "$READS_DIR/$filename" \
              "$url"
          done < "$GITHUB_WORKSPACE/examples/hcc1143_lpwgs/manifest.tsv"

          cd "$READS_DIR"
          md5sum -c "$GITHUB_WORKSPACE/examples/hcc1143_lpwgs/checksums.md5"
          gzip -t \
            HCC1143_DMSO_R1.fastq.gz HCC1143_DMSO_R2.fastq.gz \
            HCC1143_BEZ235_R1.fastq.gz HCC1143_BEZ235_R2.fastq.gz \
            HCC1143_TRAMETINIB_R1.fastq.gz HCC1143_TRAMETINIB_R2.fastq.gz

          cat > "$READS_DIR/samples.csv" <<'CSV'
          sample_name,status
          HCC1143_DMSO,TUMOR
          HCC1143_BEZ235,TUMOR
          HCC1143_TRAMETINIB,TUMOR
          CSV
          cat "$READS_DIR/samples.csv"

      - name: Generate the HCC1143 configuration with Automatic Setup
        run: |
          set -Eeuo pipefail

          if [[ "$ROUTE" == 'poetry' ]]; then
            poetry run oncotracer --repo-dir "$GITHUB_WORKSPACE" --backend docker \
              --auto_params \
              --lpwgs_root "$TEST_ROOT" \
              --mode illumina \
              --reads_folder "$READS_DIR" \
              --sample_table "$READS_DIR/samples.csv" \
              --auto_config_dir "$TEST_ROOT/configs/hcc1143_lpwgs" \
              --auto_outdir "$TEST_ROOT/runs/hcc1143_lpwgs" \
              -work-dir "$TEST_ROOT/work/hcc1143-auto"
          elif [[ "$ROUTE" == 'conda' ]]; then
            nextflow run "$GITHUB_WORKSPACE/main.nf" --conda \
              --auto_params \
              --lpwgs_root "$TEST_ROOT" \
              --mode illumina \
              --reads_folder "$READS_DIR" \
              --sample_table "$READS_DIR/samples.csv" \
              --auto_config_dir "$TEST_ROOT/configs/hcc1143_lpwgs" \
              --auto_outdir "$TEST_ROOT/runs/hcc1143_lpwgs" \
              -work-dir "$TEST_ROOT/work/hcc1143-auto"
          else
            nextflow run "$GITHUB_WORKSPACE/main.nf" --docker \
              --auto_params \
              --lpwgs_root "$TEST_ROOT" \
              --mode illumina \
              --reads_folder "$READS_DIR" \
              --sample_table "$READS_DIR/samples.csv" \
              --auto_config_dir "$TEST_ROOT/configs/hcc1143_lpwgs" \
              --auto_outdir "$TEST_ROOT/runs/hcc1143_lpwgs" \
              -work-dir "$TEST_ROOT/work/hcc1143-auto"
          fi

          test -s "$TEST_ROOT/configs/hcc1143_lpwgs/illumina.auto.yml"
          test -s "$TEST_ROOT/configs/hcc1143_lpwgs/illumina.samplesheet.csv"
          cat "$TEST_ROOT/configs/hcc1143_lpwgs/illumina.samplesheet.csv"
          [[ "$(tail -n +2 "$TEST_ROOT/configs/hcc1143_lpwgs/illumina.samplesheet.csv" | wc -l)" -eq 3 ]]

      - name: Limit nested SAMURAI resources to the hosted runner
        run: |
          NESTED_HOME="$TEST_ROOT/runs/hcc1143_lpwgs/01_samurai_illumina/.nextflow"
          mkdir -p "$NESTED_HOME"
          cat > "$NESTED_HOME/config" <<'EOF_CONFIG'
          process {
            resourceLimits = [
              cpus: 4,
              memory: '14.GB',
              time: '6.h'
            ]
          }
          conda {
            useMamba = false
          }
          EOF_CONFIG

      - name: Run the complete HCC1143 analysis
        run: |
          set -Eeuo pipefail
          CONFIG="$TEST_ROOT/configs/hcc1143_lpwgs/illumina.auto.yml"
          WORK="$TEST_ROOT/work/hcc1143-lpwgs"

          if [[ "$ROUTE" == 'poetry' ]]; then
            poetry run oncotracer --repo-dir "$GITHUB_WORKSPACE" --backend docker \
              -params-file "$CONFIG" \
              -work-dir "$WORK" \
              -with-report "$TEST_ROOT/reports/hcc1143.report.html" \
              -with-timeline "$TEST_ROOT/reports/hcc1143.timeline.html" \
              -with-trace "$TEST_ROOT/reports/hcc1143.trace.tsv" \
              -resume
          elif [[ "$ROUTE" == 'conda' ]]; then
            nextflow run "$GITHUB_WORKSPACE/main.nf" --conda \
              -params-file "$CONFIG" \
              -work-dir "$WORK" \
              -with-report "$TEST_ROOT/reports/hcc1143.report.html" \
              -with-timeline "$TEST_ROOT/reports/hcc1143.timeline.html" \
              -with-trace "$TEST_ROOT/reports/hcc1143.trace.tsv" \
              -resume
          else
            nextflow run "$GITHUB_WORKSPACE/main.nf" --docker \
              -params-file "$CONFIG" \
              -work-dir "$WORK" \
              -with-report "$TEST_ROOT/reports/hcc1143.report.html" \
              -with-timeline "$TEST_ROOT/reports/hcc1143.timeline.html" \
              -with-trace "$TEST_ROOT/reports/hcc1143.trace.tsv" \
              -resume
          fi

      - name: Verify every HCC1143 output
        run: |
          OUT="$TEST_ROOT/runs/hcc1143_lpwgs"
          python3 "$GITHUB_WORKSPACE/examples/hcc1143_lpwgs/verify_outputs.py" \
            --outdir "$OUT"

          samtools quickcheck -v \
            "$OUT/01_samurai_illumina/alignment/HCC1143_DMSO.bam" \
            "$OUT/01_samurai_illumina/alignment/HCC1143_BEZ235.bam" \
            "$OUT/01_samurai_illumina/alignment/HCC1143_TRAMETINIB.bam"

          grep -F 'HCC1143_DMSO' "$OUT/01_samurai_illumina/qdnaseq/all_segments.seg"
          grep -F 'HCC1143_BEZ235' "$OUT/01_samurai_illumina/qdnaseq/all_segments.seg"
          grep -F 'HCC1143_TRAMETINIB' "$OUT/01_samurai_illumina/qdnaseq/all_segments.seg"

          test -s "$OUT/03_cna_codification/cna_events.tsv"
          test -s "$OUT/03_cna_codification/cna_cytogenomic_notation.tsv"
          test -s "$OUT/04_cna_custom_plots/cna_per_sample_pages.pdf"
          test -s "$OUT/04_cna_custom_plots/cna_log2_ratio_profiles_all_samples.pdf"
          grep -Fx 'mode=illumina' "$OUT/06_workflow_summary/workflow_summary.txt"
          grep -Fx 'dataset=illumina_qdnaseq_100kb' "$OUT/06_workflow_summary/workflow_summary.txt"
          cat "$OUT/06_workflow_summary/workflow_summary.txt"

      - name: Verify route and source-cache state
        run: |
          SAMURAI_SOURCE="$TEST_ROOT/.oncotracer/samurai/v1.4.0"
          test -s "$SAMURAI_SOURCE/main.nf"
          grep -qx 'cache_format=2' "$SAMURAI_SOURCE/.oncotracer-source"
          grep -F 'channel.fromPath(params.dict)' "$SAMURAI_SOURCE/main.nf"

          if [[ "$ROUTE" == 'conda' ]]; then
            test -d "$TEST_ROOT/.oncotracer/conda"
            find "$TEST_ROOT/.oncotracer/conda" \
              -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .
          elif [[ "$ROUTE" == 'poetry' ]]; then
            poetry run oncotracer --help >/dev/null
            docker info >/dev/null
          else
            docker info >/dev/null
          fi

          du -h -d 3 "$TEST_ROOT" | sort -h | tail -50
          df -h

      - name: Upload validation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.1-${{ matrix.route }}-quickstart2-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: |
            .nextflow.log*
            test/v1.1-${{ matrix.route }}-quickstart2/configs/**
            test/v1.1-${{ matrix.route }}-quickstart2/reports/**
            test/v1.1-${{ matrix.route }}-quickstart2/.oncotracer/samurai/**/.oncotracer-source
            test/v1.1-${{ matrix.route }}-quickstart2/runs/**/06_workflow_summary/**
            test/v1.1-${{ matrix.route }}-quickstart2/runs/**/03_cna_codification/cna_events.tsv
            test/v1.1-${{ matrix.route }}-quickstart2/runs/**/01_samurai_*/logs/**
            test/v1.1-${{ matrix.route }}-quickstart2/runs/**/01_samurai_*/nextflow_launch/.nextflow.log
