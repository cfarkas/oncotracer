name: Deploy start-from-clone documentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate-and-deploy:
    if: github.head_ref == 'agent/deploy-start-from-clone-docs'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 3e360ae6c61de1d2d1e4f78ce69b604a8e49313c

    steps:
      - name: Check out the exact main documentation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate all copy-paste examples
        run: |
          python3 tests/test_docs_style.py
          python3 tests/test_examples_start_from_clone.py

          grep -F 'git clone https://github.com/cfarkas/oncotracer.git "$REPO_DIR"' \
            docs/six_tumor_four_control.md >/dev/null
          grep -F 'PROJECT_DIR="$REPO_DIR/test/examples/onco6_ctrl4"' \
            docs/six_tumor_four_control.md >/dev/null
          grep -F -- '--docker' docs/six_tumor_four_control.md >/dev/null
          grep -F -- '--singularity' docs/six_tumor_four_control.md >/dev/null
          grep -F 'poetry run oncotracer' docs/six_tumor_four_control.md >/dev/null
          grep -F -- '--conda' docs/six_tumor_four_control.md >/dev/null

          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Deploy the exact main documentation to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --clean --remote-name origin --remote-branch gh-pages
