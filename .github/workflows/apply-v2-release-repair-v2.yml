name: Apply audited v2 release repair v2

on:
  push:
    branches:
      - agent/native-v2-parity

permissions:
  contents: read

concurrency:
  group: apply-v2-release-repair-v2
  cancel-in-progress: true

jobs:
  supersede_obsolete_repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'The audited repair is already incorporated in the merged v2 candidate; this obsolete run is superseded.'
