name: Native v2 QuickStart 1 parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-v2-quickstart1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  V1_1_COMMIT: 032c1268fa7fdcadc48087055066d7a9fc59bd89
  V1_DOCKER_IMAGE: carlosfarkas/oncotracer@sha256:4856aed020e1102f891b91de54d6acf365d6b8a57e2283a4f7b670b0bd5b07ed
  SAMURAI_COMMIT: 6a901940288b008237703c6b181d447e7dee4fcf
  NEXTFLOW_VERSION: 26.04.6
  NEXTFLOW_DIST_URL: https://github.com/nextflow-io/nextflow/releases/download/v26.04.6/nextflow-26.04.6-dist
  NEXTFLOW_DIST_SHA256: 182a63c74074e2dc7956ffa3c8cd59de952ed2c44394e21faf5e1736b945444c
  QDNASEQ_SOURCE_COMMIT: cf7c07e39de0ac64a9c38cb030cba4626e2aae83
  NXF_ANSI_LOG: "false"
  NXF_DISABLE_CHECK_LATEST: "true"
  NXF_OPTS: "-Xms256m -Xmx2g"
  NXF_GITHUB_TOKEN: ${{ github.token }}
  PIP_NO_CACHE_DIR: "1"
  XDG_CONFIG_HOME: /tmp/oncotracer-v2-config
  ONCOTRACER_PAYLOAD_CACHE: /tmp/oncotracer-v2-payload
  V2_ENV_PREFIX: /tmp/oncotracer-v2-envs
  TEST_ROOT: ${{ github.workspace }}/parity-quickstart1
  INPUT_ROOT: ${{ github.workspace }}/parity-quickstart1/input
  PINNED_NEXTFLOW_DIR: ${{ github.workspace }}/parity-quickstart1/.release-tools/bin

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out candidate v2
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          path: v2
      - name: Check out frozen v1.1 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V1_1_COMMIT }}
          fetch-depth: 0
          path: v1
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate: true
          conda-remove-defaults: true
      - name: Install v1.1 host prerequisites and Nextflow comparator
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samtools bwa minimap2 pigz curl wget git
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/nextflow-$NEXTFLOW_VERSION-dist" \
            "$NEXTFLOW_DIST_URL"
          printf '%s  %s\n' "$NEXTFLOW_DIST_SHA256" \
            "$RUNNER_TEMP/nextflow-$NEXTFLOW_VERSION-dist" \
            | sha256sum --strict -c -
          mkdir -p "$PINNED_NEXTFLOW_DIR"
          install -m 0755 "$RUNNER_TEMP/nextflow-$NEXTFLOW_VERSION-dist" \
            "$PINNED_NEXTFLOW_DIR/nextflow"
          printf '%s  %s\n' "$NEXTFLOW_DIST_SHA256" "$PINNED_NEXTFLOW_DIR/nextflow" \
            | sha256sum --strict -c -
          "$PINNED_NEXTFLOW_DIR/nextflow" -version 2>&1 \
            | tee "$RUNNER_TEMP/nextflow-version.txt"
          grep -E "version[[:space:]]+$NEXTFLOW_VERSION([[:space:]]|$)" \
            "$RUNNER_TEMP/nextflow-version.txt"
          printf 'version=%s\nurl=%s\nsha256=%s\n' \
            "$NEXTFLOW_VERSION" "$NEXTFLOW_DIST_URL" "$NEXTFLOW_DIST_SHA256" \
            > "$RUNNER_TEMP/nextflow-identity.txt"
          docker info
          docker pull "$V1_DOCKER_IMAGE"
          docker image inspect "$V1_DOCKER_IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | tee "$RUNNER_TEMP/v1-docker-repodigests.txt"
          grep -Fx "$V1_DOCKER_IMAGE" "$RUNNER_TEMP/v1-docker-repodigests.txt"
          printf '%s\n' "$V1_DOCKER_IMAGE" | tee "$RUNNER_TEMP/v1-docker-digest.txt"
      - name: Add addressable-memory headroom
        run: |
          sudo fallocate -l 32G /swapfile.oncotracer-v2
          sudo chmod 600 /swapfile.oncotracer-v2
          sudo mkswap /swapfile.oncotracer-v2
          sudo swapon /swapfile.oncotracer-v2 || true
          sudo sysctl -w vm.swappiness=100 || true
          free -h
          df -h
      - name: Build copied v2 executable and install native Conda backend
        working-directory: v2
        run: |
          set -Eeuo pipefail
          conda config --set channel_priority strict
          conda config --set solver libmamba
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "$CANDIDATE_SHA"
          SOURCE_SHA256="$(git -c tar.umask=0002 archive --format=tar "$SOURCE_COMMIT" | sha256sum | awk '{print $1}')"
          printf '%s\n' "$SOURCE_COMMIT" | tee "$RUNNER_TEMP/v2-source-commit.txt"
          printf '%s\n' "$SOURCE_SHA256" | tee "$RUNNER_TEMP/v2-source-sha256.txt"
          python3 scripts/build_native_binary.py \
            --output dist/oncotracer \
            --source-commit "$SOURCE_COMMIT" \
            --source-sha256 "$SOURCE_SHA256"
          chmod 0755 dist/oncotracer
          dist/oncotracer --version
          sha256sum dist/oncotracer | tee "$RUNNER_TEMP/native-binary.sha256"
          dist/oncotracer provenance --json \
            > "$RUNNER_TEMP/native-binary-provenance.json"
          jq -e --arg commit "$SOURCE_COMMIT" --arg sha256 "$SOURCE_SHA256" \
            '.source_commit == $commit and .source_sha256 == $sha256 and
             .source_tree_dirty == false' \
            "$RUNNER_TEMP/native-binary-provenance.json"
          cat "$RUNNER_TEMP/native-binary-provenance.json"
          V1_BASELINE_COMMIT="$(git -C "$GITHUB_WORKSPACE/v1" rev-parse HEAD)"
          test "$V1_BASELINE_COMMIT" = "$V1_1_COMMIT"
          V1_TAG_COMMIT="$(git -C "$GITHUB_WORKSPACE/v1" rev-list -n 1 v1.1)"
          test "$V1_TAG_COMMIT" = "$V1_1_COMMIT"
          printf '%s\n' "$V1_BASELINE_COMMIT" | tee "$RUNNER_TEMP/v1-baseline-commit.txt"
          printf '%s\n' "$V1_TAG_COMMIT" | tee "$RUNNER_TEMP/v1-tag-commit.txt"
          dist/oncotracer install --conda --prefix "$V2_ENV_PREFIX" \
            > "$RUNNER_TEMP/native-install.json" \
            2> "$RUNNER_TEMP/native-install.stderr.log"
          jq -e '.backend == "conda"' "$RUNNER_TEMP/native-install.json"
          cat "$RUNNER_TEMP/native-install.json"
          dist/oncotracer doctor --backend conda \
            > "$RUNNER_TEMP/native-doctor.json" \
            2> "$RUNNER_TEMP/native-doctor.stderr.log"
          jq -e '.success == true' "$RUNNER_TEMP/native-doctor.json"
          cat "$RUNNER_TEMP/native-doctor.json"
          for name in core qdnaseq ichorcna classifier gistic; do
            conda list --explicit --prefix "$V2_ENV_PREFIX/$name" \
              > "$RUNNER_TEMP/native-${name}.explicit.txt"
          done
      - name: Prepare checksum-validated public reads and isolated configs
        run: |
          set -Eeuo pipefail
          mkdir -p "$TEST_ROOT/configs" "$TEST_ROOT/reports"
          "$GITHUB_WORKSPACE/v2/dist/oncotracer" quickstart 1 \
            --test-root "$INPUT_ROOT" --download-only

          python3 "$GITHUB_WORKSPACE/v2/tests/make_parity_config.py" \
            --source "$INPUT_ROOT/configs/illumina.quickstart.yml" \
            --destination "$TEST_ROOT/configs/v1-illumina.yml" \
            --lpwgs-root "$TEST_ROOT" \
            --outdir "$TEST_ROOT/v1/illumina"
          python3 "$GITHUB_WORKSPACE/v2/tests/make_parity_config.py" \
            --source "$INPUT_ROOT/configs/illumina.quickstart.yml" \
            --destination "$TEST_ROOT/configs/v2-illumina.yml" \
            --lpwgs-root "$TEST_ROOT" \
            --outdir "$TEST_ROOT/v2/illumina"
          python3 "$GITHUB_WORKSPACE/v2/tests/make_parity_config.py" \
            --source "$INPUT_ROOT/configs/ont.quickstart.yml" \
            --destination "$TEST_ROOT/configs/v1-ont.yml" \
            --lpwgs-root "$TEST_ROOT" \
            --outdir "$TEST_ROOT/v1/ont"
          python3 "$GITHUB_WORKSPACE/v2/tests/make_parity_config.py" \
            --source "$INPUT_ROOT/configs/ont.quickstart.yml" \
            --destination "$TEST_ROOT/configs/v2-ont.yml" \
            --lpwgs-root "$TEST_ROOT" \
            --outdir "$TEST_ROOT/v2/ont"
      - name: Pin and instrument nested v1.1 SAMURAI execution
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/samurai-container-pins.tsv" <<'EOF'
          container	manifest_digest
          quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0	sha256:e194048df39c3145d9b4e0a14f4da20b59d59250465b6f2a9cb698445fd45900
          community.wave.seqera.io/library/bwa_htslib_samtools:83b50ff84ead50d0	sha256:48812e48a9462145c065d1b8e15d996c4a2c4c69469f1249fb601f25939cd48e
          community.wave.seqera.io/library/picard:3.4.0--e9963040df0a9bf6	sha256:e269216786463d44f9d83a0d6e877b34bca2c7b4d35211b4b369fe98e39ef1a5
          quay.io/biocontainers/samtools:1.22.1--h96c455f_0	sha256:23dc2c29f457a448a0d341fb97b2632a2c8004925214cb6420562a5b12adf8a2
          quay.io/dincalcilab/qdnaseq:1.30.0-a28ebc1	sha256:fb6135876beca3059ed1414d5082833d5bbf1fb3f0f64e51ca8b29fb47adaa75
          docker.io/t0shy/qpdf-docker:11.3.0	sha256:744f00189f4b0f3f1273073212102b32e0505fea528c9516e4252b9345e482d3
          community.wave.seqera.io/library/multiqc:1.32--d58f60e4deb769bf	sha256:677f4c8e38cfd741926e5bd1e80d96b756540bc6a9e9c5ed520aa7a98358d11d
          community.wave.seqera.io/library/hmmcopy_samtools:875db3767c6d4ea2	sha256:209b7aeca568155a099873da6e830427bf0a9d5418426b39f913db736d53e20b
          community.wave.seqera.io/library/r-ichorcna:0.5.1--eed4be826f05c9d4	sha256:c6240b1bcc57de07d9a92373f6fad080870bba0075be6cd25c6d37179d928c72
          quay.io/einar_rainhart/pandas-pandera:1.5.3	sha256:39fae3f3a2edb8cb174b3ffade1741b6b1ec850a323b4f7a0dca6908f2e49cf8
          community.wave.seqera.io/library/polars_procps-ng_typer:d1a53d7945a021e3	sha256:3b7464a65a9b23f0969b19767303b8727ab9f7dce83b1885cd8f6334d75ed59e
          community.wave.seqera.io/library/procps-ng_r-argparser_r-dplyr_r-ggplot2_pruned:10da72fa04bcba1a	sha256:28626b999449abe6ddc2167228023ec93e90d109a540be97d0a789d2093b4e8b
          EOF
          test "$(wc -l < "$RUNNER_TEMP/samurai-container-pins.tsv")" -eq 13
          printf 'container\tmanifest_digest\timage_id\n' \
            > "$RUNNER_TEMP/samurai-container-preflight.tsv"
          while IFS=$'\t' read -r container digest; do
            [[ "$container" == container ]] && continue
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            repository="${container%:*}"
            immutable="$repository@$digest"
            docker pull "$immutable"
            expected_id="$(docker image inspect "$immutable" --format '{{.Id}}')"
            if docker image inspect "$container" >/dev/null 2>&1; then
              existing_id="$(docker image inspect "$container" --format '{{.Id}}')"
              test "$existing_id" = "$expected_id" || {
                echo "mutable SAMURAI tag $container already resolves to unexpected $existing_id" >&2
                exit 1
              }
            else
              docker tag "$immutable" "$container"
            fi
            observed_id="$(docker image inspect "$container" --format '{{.Id}}')"
            test "$observed_id" = "$expected_id"
            docker image inspect "$container" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | grep -E "@${digest}$"
            printf '%s\t%s\t%s\n' "$container" "$digest" "$observed_id" \
              >> "$RUNNER_TEMP/samurai-container-preflight.tsv"
          done < "$RUNNER_TEMP/samurai-container-pins.tsv"

          cat > "$TEST_ROOT/configs/v1-pinned-nextflow.config" <<EOF
          process {
            withName: RUN_ILLUMINA_SAMURAI {
              env.PATH = '$PINNED_NEXTFLOW_DIR:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
            }
            withName: RUN_ONT_SAMURAI {
              env.PATH = '$PINNED_NEXTFLOW_DIR:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
            }
          }
          EOF
          for nested_home in \
            "$TEST_ROOT/v1/illumina/01_samurai_illumina/.nextflow" \
            "$TEST_ROOT/v1/ont/01_samurai_ont/.nextflow"; do
            mkdir -p "$nested_home"
            cat > "$nested_home/config" <<'EOF'
          process {
            resourceLimits = [cpus: 4, memory: '14.GB', time: '6.h']
          }
          conda { useMamba = false }
          trace.fields = 'task_id,hash,name,status,exit,container'
          EOF
          done
      - name: Run complete frozen v1.1 baseline
        run: |
          set -Eeuo pipefail
          env PATH="$PINNED_NEXTFLOW_DIR:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "$PINNED_NEXTFLOW_DIR/nextflow" run "$GITHUB_WORKSPACE/v1/main.nf" \
            -c "$TEST_ROOT/configs/v1-pinned-nextflow.config" --docker \
            --docker_image "$V1_DOCKER_IMAGE" \
            -params-file "$TEST_ROOT/configs/v1-illumina.yml" \
            -work-dir "$TEST_ROOT/work/v1-illumina" \
            -with-report "$TEST_ROOT/reports/v1-illumina.html" \
            -with-trace "$TEST_ROOT/reports/v1-illumina.tsv" \
            -resume 2>&1 | tee "$TEST_ROOT/reports/v1-illumina.log"
          env PATH="$PINNED_NEXTFLOW_DIR:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "$PINNED_NEXTFLOW_DIR/nextflow" run "$GITHUB_WORKSPACE/v1/main.nf" \
            -c "$TEST_ROOT/configs/v1-pinned-nextflow.config" --docker \
            --docker_image "$V1_DOCKER_IMAGE" \
            -params-file "$TEST_ROOT/configs/v1-ont.yml" \
            -work-dir "$TEST_ROOT/work/v1-ont" \
            -with-report "$TEST_ROOT/reports/v1-ont.html" \
            -with-trace "$TEST_ROOT/reports/v1-ont.tsv" \
            -resume 2>&1 | tee "$TEST_ROOT/reports/v1-ont.log"
          SAMURAI_SOURCE="$TEST_ROOT/.oncotracer/samurai/v1.4.0"
          test -s "$SAMURAI_SOURCE/.oncotracer-source"
          test "$(git -C "$SAMURAI_SOURCE" rev-parse HEAD)" = "$SAMURAI_COMMIT"
          grep -Fx 'revision=v1.4.0' "$SAMURAI_SOURCE/.oncotracer-source"
          grep -Fx "commit=$SAMURAI_COMMIT" "$SAMURAI_SOURCE/.oncotracer-source"
          cp "$SAMURAI_SOURCE/.oncotracer-source" "$RUNNER_TEMP/samurai.oncotracer-source"
      - name: Verify nested SAMURAI process and container provenance
        run: |
          set -Eeuo pipefail
          python3 - \
            "$RUNNER_TEMP/samurai-container-pins.tsv" \
            "$RUNNER_TEMP/samurai-container-runtime.tsv" \
            "$TEST_ROOT/v1/illumina/01_samurai_illumina" \
            "$TEST_ROOT/v1/ont/01_samurai_ont" <<'PY'
          import csv
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          pins_path, runtime_path, illumina_root, ont_root = map(Path, sys.argv[1:])
          rows = list(csv.reader(pins_path.open(newline='', encoding='utf-8'), delimiter='\t'))
          if not rows or rows[0] != ['container', 'manifest_digest']:
              raise SystemExit('invalid SAMURAI container pin manifest')
          pins = dict(rows[1:])
          if len(pins) != 12 or len(rows) != 13:
              raise SystemExit('QuickStart 1 must pin exactly 12 unique reachable SAMURAI images')

          illumina_processes = {
              'SAMURAI:FASTQ_TRIM_FASTP_FASTQC:FASTQC_RAW',
              'SAMURAI:FASTQ_ALIGN_DNA:BWAMEM1_MEM',
              'SAMURAI:BAM_MARKDUPLICATES_PICARD:PICARD_MARKDUPLICATES',
              'SAMURAI:BAM_MARKDUPLICATES_PICARD:SAMTOOLS_INDEX',
              'SAMURAI:BAM_MARKDUPLICATES_PICARD:BAM_STATS_SAMTOOLS:SAMTOOLS_STATS',
              'SAMURAI:BAM_MARKDUPLICATES_PICARD:BAM_STATS_SAMTOOLS:SAMTOOLS_FLAGSTAT',
              'SAMURAI:BAM_MARKDUPLICATES_PICARD:BAM_STATS_SAMTOOLS:SAMTOOLS_IDXSTATS',
              'SAMURAI:BAM_QC_PICARD:PICARD_COLLECTMULTIPLEMETRICS',
              'SAMURAI:BAM_QC_PICARD:PICARD_COLLECTWGSMETRICS',
              'SAMURAI:SOLID_BIOPSY:QDNASEQ',
              'SAMURAI:SOLID_BIOPSY:CONCATENATE_QDNASEQ_PLOTS',
              'SAMURAI:MULTIQC',
          }
          ont_processes = {
              'SAMURAI:SAMTOOLS_INDEX',
              'SAMURAI:BAM_QC_PICARD:PICARD_COLLECTMULTIPLEMETRICS',
              'SAMURAI:BAM_QC_PICARD:PICARD_COLLECTWGSMETRICS',
              'SAMURAI:LIQUID_BIOPSY:ICHORCNA:HMMCOPY_READCOUNTER_ICHORCNA',
              'SAMURAI:LIQUID_BIOPSY:ICHORCNA:ICHORCNA_RUN',
              'SAMURAI:LIQUID_BIOPSY:ICHORCNA:AGGREGATE_ICHORCNA_TABLE',
              'SAMURAI:LIQUID_BIOPSY:ICHORCNA:CORRECT_LOGR_ICHORCNA',
              'SAMURAI:LIQUID_BIOPSY:ICHORCNA:PLOT_ICHORCNA',
              'SAMURAI:LIQUID_BIOPSY:ICHORCNA:CONCATENATE_BIN_PLOTS',
              'SAMURAI:MULTIQC',
          }
          illumina_images = set(list(pins)[:7])
          ont_images = {
              'quay.io/biocontainers/samtools:1.22.1--h96c455f_0',
              'community.wave.seqera.io/library/picard:3.4.0--e9963040df0a9bf6',
              'community.wave.seqera.io/library/hmmcopy_samtools:875db3767c6d4ea2',
              'community.wave.seqera.io/library/r-ichorcna:0.5.1--eed4be826f05c9d4',
              'quay.io/einar_rainhart/pandas-pandera:1.5.3',
              'community.wave.seqera.io/library/polars_procps-ng_typer:d1a53d7945a021e3',
              'community.wave.seqera.io/library/procps-ng_r-argparser_r-dplyr_r-ggplot2_pruned:10da72fa04bcba1a',
              'docker.io/t0shy/qpdf-docker:11.3.0',
              'community.wave.seqera.io/library/multiqc:1.32--d58f60e4deb769bf',
          }

          def normalize_process(name: str) -> str:
              name = re.sub(r'\s+\([^()]*(?:\([^()]*\)[^()]*)*\)$', '', name.strip())
              if ':SAMURAI:' in name:
                  name = 'SAMURAI:' + name.rsplit(':SAMURAI:', 1)[1]
              return name

          def normalize_container(value: str) -> str:
              value = value.strip().removeprefix('docker://')
              supplied_digest = None
              if '@sha256:' in value:
                  value, supplied_digest = value.rsplit('@', 1)
              if value.startswith('biocontainers/'):
                  value = 'quay.io/' + value
              elif value.startswith('t0shy/qpdf-docker:'):
                  value = 'docker.io/' + value
              if value not in pins:
                  raise SystemExit(f'unexpected nested SAMURAI container: {value}')
              if supplied_digest is not None and supplied_digest != pins[value]:
                  raise SystemExit(f'nested trace digest disagrees with pin for {value}')
              return value

          runtime = ['run\tcontainer\tmanifest_digest\timage_id']
          observed_all = set()
          for label, root, expected_rows, expected_processes, expected_images in (
              ('quickstart1-illumina', illumina_root, 12, illumina_processes, illumina_images),
              ('quickstart1-ont', ont_root, 10, ont_processes, ont_images),
          ):
              traces = sorted(root.rglob('pipeline_info/execution_trace_*.txt'))
              if len(traces) != 1:
                  raise SystemExit(f'{label} must have exactly one nested SAMURAI trace; found {traces!r}')
              with traces[0].open(newline='', encoding='utf-8') as handle:
                  trace_rows = list(csv.DictReader(handle, delimiter='\t'))
              required = {'name', 'status', 'exit', 'container'}
              if not trace_rows or not required <= set(trace_rows[0]):
                  raise SystemExit(f'{label} nested trace lacks {required!r}')
              if len(trace_rows) != expected_rows:
                  raise SystemExit(f'{label} expected {expected_rows} trace rows, found {len(trace_rows)}')
              if any(row['status'] not in {'COMPLETED', 'CACHED'} or row['exit'] != '0'
                     or not row['container'].strip() for row in trace_rows):
                  raise SystemExit(f'{label} has failed, nonzero, or container-free nested tasks')
              processes = {normalize_process(row['name']) for row in trace_rows}
              images = {normalize_container(row['container']) for row in trace_rows}
              if processes != expected_processes:
                  raise SystemExit(f'{label} process set mismatch: {processes ^ expected_processes!r}')
              if images != expected_images:
                  raise SystemExit(f'{label} container set mismatch: {images ^ expected_images!r}')
              for container in sorted(images):
                  digest = pins[container]
                  repository = container.rsplit(':', 1)[0]
                  image_id = subprocess.check_output(
                      ['docker', 'image', 'inspect', container, '--format', '{{.Id}}'], text=True).strip()
                  immutable_id = subprocess.check_output(
                      ['docker', 'image', 'inspect', f'{repository}@{digest}', '--format', '{{.Id}}'],
                      text=True).strip()
                  if image_id != immutable_id or not re.fullmatch(r'sha256:[0-9a-f]{64}', image_id):
                      raise SystemExit(f'{container} is not bound to pinned {digest}')
                  repo_digests = json.loads(subprocess.check_output(
                      ['docker', 'image', 'inspect', container, '--format', '{{json .RepoDigests}}'],
                      text=True))
                  if not any(item.endswith('@' + digest) for item in repo_digests):
                      raise SystemExit(f'{container} lacks expected RepoDigest {digest}')
                  runtime.append(f'{label}\t{container}\t{digest}\t{image_id}')
                  observed_all.add(container)
          if observed_all != set(pins):
              raise SystemExit(f'QuickStart 1 did not exercise every pinned image: {set(pins) - observed_all!r}')
          runtime_path.write_text('\n'.join(runtime) + '\n', encoding='utf-8')
          PY
