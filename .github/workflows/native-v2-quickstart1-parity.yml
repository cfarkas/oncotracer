              raise SystemExit(f'SAMURAI identity mismatch: {samurai!r}')
          def read_tsv(path: Path) -> list[list[str]]:
              return list(csv.reader(require_file(path).open(newline='', encoding='utf-8'), delimiter='\t'))

          pin_rows = read_tsv(context / 'nested-v1-container-pins.tsv')
          if pin_rows[0] != ['container', 'manifest_digest'] or len(pin_rows) != 13:
              raise SystemExit('QuickStart 1 must contain exactly 12 nested SAMURAI image pins')
          pins = dict(pin_rows[1:])
          if len(pins) != 12 or any(not re.fullmatch(r'sha256:[0-9a-f]{64}', value) for value in pins.values()):
              raise SystemExit('invalid or duplicate QuickStart 1 nested SAMURAI image pins')
          preflight_rows = read_tsv(context / 'nested-v1-container-preflight.tsv')
          if preflight_rows[0] != ['container', 'manifest_digest', 'image_id'] or len(preflight_rows) != 13:
              raise SystemExit('invalid QuickStart 1 nested image preflight manifest')
          for container, digest, image_id in preflight_rows[1:]:
              if pins.get(container) != digest or not re.fullmatch(r'sha256:[0-9a-f]{64}', image_id):
                  raise SystemExit(f'invalid preflight identity for {container}')
          runtime_rows = read_tsv(context / 'nested-v1-container-runtime.tsv')
          if runtime_rows[0] != ['run', 'container', 'manifest_digest', 'image_id'] or len(runtime_rows) != 17:
              raise SystemExit('invalid QuickStart 1 nested image runtime manifest')
          runtime_by_run: dict[str, set[str]] = {}
          for run, container, digest, image_id in runtime_rows[1:]:
              runtime_by_run.setdefault(run, set()).add(container)
              if pins.get(container) != digest or not re.fullmatch(r'sha256:[0-9a-f]{64}', image_id):
