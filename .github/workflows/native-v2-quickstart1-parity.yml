          import csv
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ['TEST_ROOT'])
          audit = root / 'audit'
          context = audit / 'context'
          manifests = context / 'manifests'

          def require_file(path: Path) -> Path:
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f'missing or empty audit file: {path}')
              return path

          def sha256(path: Path) -> str:
              value = hashlib.sha256()
              with path.open('rb') as handle:
                  while chunk := handle.read(8 * 1024 * 1024):
                      value.update(chunk)
              return value.hexdigest()

          def verify_manifest(tree: Path, manifest: Path) -> list[tuple[str, int, str]]:
              require_file(manifest)
              rows = list(csv.reader(manifest.open(newline='', encoding='utf-8'), delimiter='\t'))
              if not rows or rows[0] != ['sha256', 'bytes', 'path'] or len(rows) < 2:
                  raise SystemExit(f'invalid tree-manifest header or empty tree: {manifest}')
              records: list[tuple[str, int, str]] = []
              seen: set[str] = set()
              for row in rows[1:]:
                  if len(row) != 3:
                      raise SystemExit(f'invalid tree-manifest row: {row!r}')
                  digest, size_text, relative = row
                  if not re.fullmatch(r'[0-9a-f]{64}', digest):
                      raise SystemExit(f'invalid manifest digest: {digest!r}')
                  if relative in seen or relative.startswith('/') or '..' in Path(relative).parts:
                      raise SystemExit(f'unsafe or duplicate manifest path: {relative!r}')
                  seen.add(relative)
                  path = tree / relative
                  require_file(path)
                  size = int(size_text)
                  if path.stat().st_size != size or sha256(path) != digest:
                      raise SystemExit(f'manifest mismatch: {path}')
                  records.append((digest, size, relative))
              actual = sorted(
                  item.relative_to(tree).as_posix()
                  for item in tree.rglob('*') if item.is_file()
              )
              if sorted(seen) != actual:
                  raise SystemExit(f'manifest is not a complete inventory of {tree}')
              return records

          def verify_report(name: str, expected_label: str, mode: str, dataset: str,
                            samples: list[str]) -> None:
              report = json.loads(require_file(audit / name / 'parity_report.json').read_text())
              if report.get('label') != expected_label or report.get('passed') is not True:
                  raise SystemExit(f'failed or mislabeled parity report: {name}')
              checks = report.get('checks', {})
              if not checks or not all(value is True for value in checks.values()):
                  raise SystemExit(f'failed parity checks in {name}: {checks!r}')
              if report.get('v1_samples') != samples or report.get('v2_samples') != samples:
                  raise SystemExit(f'unexpected sample set in {name}')
              for summary_name in ('v1_summary', 'v2_summary'):
                  summary = report.get(summary_name, {})
                  if summary.get('mode') != mode or summary.get('dataset') != dataset:
                      raise SystemExit(f'unexpected {summary_name} identity in {name}: {summary!r}')
              if report.get('v2_summary', {}).get('engine') != 'native':
                  raise SystemExit(f'{name} did not use the native summary engine')
              if str(report.get('v2_summary', {}).get('nextflow_used', '')).lower() != 'false':
                  raise SystemExit(f'{name} reports Nextflow use in native v2')

          verify_report('illumina', 'QuickStart 1 / Illumina', 'illumina',
                        'illumina_qdnaseq_100kb', ['ERR12341627'])
          verify_report('ont', 'QuickStart 1 / ONT', 'ont',
                        'ONT_ichorcna_500kb', ['DRR165691'])
          overall = json.loads(require_file(audit / 'quickstart1_parity.json').read_text())
          if overall.get('schema') != 'oncotracer-quickstart1-parity-v1' or overall.get('passed') is not True:
              raise SystemExit('QuickStart 1 aggregate parity report did not pass')

          if require_file(context / 'v1-baseline-commit.txt').read_text().strip() != os.environ['V1_1_COMMIT']:
              raise SystemExit('frozen v1 checkout commit mismatch')
          if require_file(context / 'v1-tag-commit.txt').read_text().strip() != os.environ['V1_1_COMMIT']:
              raise SystemExit('v1.1 tag resolution mismatch')
          nextflow = dict(
              line.split('=', 1) for line in
              require_file(context / 'nextflow-identity.txt').read_text().splitlines()
          )
          expected_nextflow = {
              'version': os.environ['NEXTFLOW_VERSION'],
              'url': os.environ['NEXTFLOW_DIST_URL'],
              'sha256': os.environ['NEXTFLOW_DIST_SHA256'],
          }
