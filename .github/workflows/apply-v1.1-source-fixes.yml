name: Apply v1.1 nested Docker ownership fixes

on:
  push:
    branches:
      - agent/conda-docs-v1.1
    paths:
      - ".github/workflows/apply-v1.1-source-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the v1.1 branch
        uses: actions/checkout@v4
        with:
          ref: agent/conda-docs-v1.1
          fetch-depth: 0

      - name: Add host UID:GID to nested SAMURAI Docker runs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              return text.replace(old, new, 1)

          illumina = Path("bin/scripts/run_illumina_samurai_fastq.sh")
          text = illumina.read_text(encoding="utf-8")
          anchor = 'cat > "$LOCAL_CONFIG" <<EOF_CONFIG\n'
          replacement = '''HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          cat > "$LOCAL_CONFIG" <<EOF_CONFIG
          '''
          text = replace_once(text, anchor, replacement, "Illumina UID insertion")
          config_tail = '''report { overwrite = true }
          timeline { overwrite = true }
          EOF_CONFIG
          '''
          new_tail = '''report { overwrite = true }
          timeline { overwrite = true }
          docker {
            runOptions = "-u ${HOST_UID}:${HOST_GID} -e HOME=/tmp -e MPLCONFIGDIR=/tmp/matplotlib -e XDG_CACHE_HOME=/tmp/cache"
          }
          EOF_CONFIG
          '''
          text = replace_once(text, config_tail, new_tail, "Illumina Docker config")
          illumina.write_text(text, encoding="utf-8")

          ont = Path("bin/scripts/run_ont_samurai_barcodes.sh")
          text = ont.read_text(encoding="utf-8")
          anchor = 'cat > "$LOCAL_CONFIG" <<EOF\n'
          replacement = '''HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          cat > "$LOCAL_CONFIG" <<EOF
          '''
          text = replace_once(text, anchor, replacement, "ONT UID insertion")
          config_tail = '''report { overwrite = true }
          timeline { overwrite = true }
          EOF
          '''
          new_tail = '''report { overwrite = true }
          timeline { overwrite = true }
          docker {
            runOptions = "-u ${HOST_UID}:${HOST_GID} -e HOME=/tmp -e MPLCONFIGDIR=/tmp/matplotlib -e XDG_CACHE_HOME=/tmp/cache"
          }
          EOF
          '''
          text = replace_once(text, config_tail, new_tail, "ONT Docker config")
          ont.write_text(text, encoding="utf-8")
          PY

      - name: Validate patched launchers
        run: |
          bash -n bin/scripts/run_illumina_samurai_fastq.sh
          bash -n bin/scripts/run_ont_samurai_barcodes.sh
          grep -F 'runOptions = "-u ${HOST_UID}:${HOST_GID}' bin/scripts/run_illumina_samurai_fastq.sh
          grep -F 'runOptions = "-u ${HOST_UID}:${HOST_GID}' bin/scripts/run_ont_samurai_barcodes.sh

      - name: Commit the nested Docker fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bin/scripts/run_illumina_samurai_fastq.sh \
            bin/scripts/run_ont_samurai_barcodes.sh
          git commit -m "Match host ownership in nested SAMURAI Docker runs"
          git push origin HEAD:agent/conda-docs-v1.1
