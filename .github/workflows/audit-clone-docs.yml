name: Audit documentation clone commands

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/simplify-clone-command-all-docs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Report clone commands, repository variables, and path placeholders
        run: |
          # This audit is removed after the documentation transformation passes.
          echo '=== git clone occurrences ==='
          grep -R -n -F 'git clone https://github.com/cfarkas/oncotracer.git' \
            README.md docs examples params 2>/dev/null || true
          echo '=== REPO_DIR occurrences ==='
          grep -R -n -F 'REPO_DIR=' README.md docs examples params 2>/dev/null || true
          echo '=== standard path occurrences ==='
          grep -R -n -F '/path/to/my/directory/oncotracer' \
            README.md docs examples params 2>/dev/null || true
