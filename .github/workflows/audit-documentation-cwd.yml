name: Repair copy-paste documentation paths

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'agent/fix-copy-paste-relative-paths'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-copy-paste-relative-paths
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair HCC1143 working-directory handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          old_public = '''```bash
          # Set the standard repository and data paths.
          READS_DIR="$(pwd)/test/public/hcc1143_lpwgs"

          # Check all six MD5 values.
          cd "$READS_DIR"
          md5sum -c "examples/hcc1143_lpwgs/checksums.md5"

          # Check that all six gzip files are complete.
          gzip -t HCC1143_DMSO_R1.fastq.gz HCC1143_DMSO_R2.fastq.gz \\
            HCC1143_BEZ235_R1.fastq.gz HCC1143_BEZ235_R2.fastq.gz \\
            HCC1143_TRAMETINIB_R1.fastq.gz HCC1143_TRAMETINIB_R2.fastq.gz

          # Create or replace the exact HCC1143 sample table.
          cat > "$READS_DIR/samples.csv" <<'CSV'
          sample_name,status
          HCC1143_DMSO,TUMOR
          HCC1143_BEZ235,TUMOR
          HCC1143_TRAMETINIB,TUMOR
          CSV

          # Display the saved table.
          cat "$READS_DIR/samples.csv"
          ```'''.replace('          ', '')

          new_public = '''```bash
          # Set the repository root and HCC1143 reads directory.
          ROOT="$(pwd)"
          READS_DIR="$ROOT/test/public/hcc1143_lpwgs"

          # Validate the six FASTQs without leaving the oncotracer directory.
          (
            cd "$READS_DIR"
            md5sum -c "$ROOT/examples/hcc1143_lpwgs/checksums.md5"
            gzip -t HCC1143_DMSO_R1.fastq.gz HCC1143_DMSO_R2.fastq.gz \\
              HCC1143_BEZ235_R1.fastq.gz HCC1143_BEZ235_R2.fastq.gz \\
              HCC1143_TRAMETINIB_R1.fastq.gz HCC1143_TRAMETINIB_R2.fastq.gz
          )

          # Create or replace the exact HCC1143 sample table.
          cat > "$READS_DIR/samples.csv" <<'CSV'
          sample_name,status
          HCC1143_DMSO,TUMOR
          HCC1143_BEZ235,TUMOR
          HCC1143_TRAMETINIB,TUMOR
          CSV

          # Display the saved table.
          cat "$READS_DIR/samples.csv"
          ```'''.replace('          ', '')
          replace_once('docs/public_cohort.md', old_public, new_public)

          old_example = '''```bash
          # Set the repository and HCC1143 reads paths.
          READS_DIR="$(pwd)/test/public/hcc1143_lpwgs"
          cd "$READS_DIR"

          # Verify all six checksums and compressed FASTQs.
          md5sum -c "examples/hcc1143_lpwgs/checksums.md5"
          gzip -t HCC1143_DMSO_R1.fastq.gz HCC1143_DMSO_R2.fastq.gz \\
            HCC1143_BEZ235_R1.fastq.gz HCC1143_BEZ235_R2.fastq.gz \\
            HCC1143_TRAMETINIB_R1.fastq.gz HCC1143_TRAMETINIB_R2.fastq.gz

          # Create or replace the exact HCC1143 sample table.
          cat > "$READS_DIR/samples.csv" <<'CSV'
          sample_name,status
          HCC1143_DMSO,TUMOR
          HCC1143_BEZ235,TUMOR
          HCC1143_TRAMETINIB,TUMOR
          CSV

          # Display the saved table.
          cat "$READS_DIR/samples.csv"
          ```'''.replace('          ', '')

          new_example = '''```bash
          # Set the repository root and HCC1143 reads directory.
          ROOT="$(pwd)"
          READS_DIR="$ROOT/test/public/hcc1143_lpwgs"

          # Verify all six checksums and compressed FASTQs without changing the parent shell.
          (
            cd "$READS_DIR"
            md5sum -c "$ROOT/examples/hcc1143_lpwgs/checksums.md5"
            gzip -t HCC1143_DMSO_R1.fastq.gz HCC1143_DMSO_R2.fastq.gz \\
              HCC1143_BEZ235_R1.fastq.gz HCC1143_BEZ235_R2.fastq.gz \\
              HCC1143_TRAMETINIB_R1.fastq.gz HCC1143_TRAMETINIB_R2.fastq.gz
          )

          # Create or replace the exact HCC1143 sample table.
          cat > "$READS_DIR/samples.csv" <<'CSV'
          sample_name,status
          HCC1143_DMSO,TUMOR
          HCC1143_BEZ235,TUMOR
          HCC1143_TRAMETINIB,TUMOR
          CSV

          # Display the saved table.
          cat "$READS_DIR/samples.csv"
          ```'''.replace('          ', '')
          replace_once('examples/hcc1143_lpwgs/README.md', old_example, new_example)

          old_readme = '''```bash
          # Set the standard repository and HCC1143 data paths.
          READS_DIR="$(pwd)/test/public/hcc1143_lpwgs"
          mkdir -p "$READS_DIR"
          '''.replace('          ', '')
          new_readme = '''```bash
          # Clone OncoTracer and enter the repository.
          git clone https://github.com/cfarkas/oncotracer.git
          cd oncotracer

          READS_DIR="$(pwd)/test/public/hcc1143_lpwgs"
          mkdir -p "$READS_DIR"
          '''.replace('          ', '')
          replace_once('README.md', old_readme, new_readme)

          test_path = ROOT / 'tests/test_copy_paste_paths.py'
          test_path.write_text('''#!/usr/bin/env python3
          """Check that simplified examples preserve the repository working directory."""

          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          CLONE = "git clone https://github.com/cfarkas/oncotracer.git"
          CD = "cd oncotracer"


          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(f"FAIL: {message}")


          public = (ROOT / "docs/public_cohort.md").read_text(encoding="utf-8")
          example = (ROOT / "examples/hcc1143_lpwgs/README.md").read_text(encoding="utf-8")
          readme = (ROOT / "README.md").read_text(encoding="utf-8")

          for name, text in (("public cohort", public), ("HCC1143 README", example)):
              require('(\n  cd "$READS_DIR"' in text, f"{name} must validate in a subshell")
              require(
                  'md5sum -c "$ROOT/examples/hcc1143_lpwgs/checksums.md5"' in text,
                  f"{name} must use the repository-root checksum path",
              )
              require(
                  '\ncd "$READS_DIR"\n' not in text,
                  f"{name} must not change the parent shell working directory",
              )

          hcc_section = readme.split(
              "## QuickStart Example 2: three public HCC1143 libraries", 1
          )[1]
          first_block = hcc_section.split("```bash", 1)[1].split("```", 1)[0]
          require(CLONE in first_block, "README QuickStart 2 must clone the repository")
          require(CD in first_block, "README QuickStart 2 must enter the repository")
          require(
              first_block.index(CLONE) < first_block.index("READS_DIR="),
              "README QuickStart 2 must clone before deriving paths",
          )

          print("PASS: copy-paste examples preserve the oncotracer working directory")
          '''.replace('          ', ''), encoding='utf-8')

          ci_path = ROOT / '.github/workflows/ci.yml'
          ci = ci_path.read_text(encoding='utf-8')
          old_ci = '''          python3 tests/test_docs_style.py
          python3 tests/test_examples_start_from_clone.py
          '''
          new_ci = '''          python3 tests/test_docs_style.py
          python3 tests/test_examples_start_from_clone.py
          python3 tests/test_copy_paste_paths.py
          '''
          if old_ci not in ci:
              raise SystemExit('Unable to add copy-paste path test to CI')
          ci_path.write_text(ci.replace(old_ci, new_ci, 1), encoding='utf-8')
          PY

      - name: Remove this temporary workflow
        run: rm -f .github/workflows/audit-documentation-cwd.yml

      - name: Validate documentation and commands
        run: |
          python3 tests/test_docs_style.py
          python3 tests/test_examples_start_from_clone.py
          python3 tests/test_copy_paste_paths.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Commit and push the repaired examples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs examples tests .github/workflows
          git commit -m "Docs: preserve working directory in simplified examples"
          git push origin HEAD:agent/fix-copy-paste-relative-paths
