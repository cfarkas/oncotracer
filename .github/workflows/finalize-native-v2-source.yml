name: Finalize native v2 audited source

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-native-v2-source-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/native-v2-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-v2-parity
          fetch-depth: 0
      - name: Detect pending finalization
        id: pending
        run: |
          if [[ -f .github/finalize-native-v2-source.py ]]; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply and validate final audited source repairs
        if: steps.pending.outputs.value == 'true'
        run: |
          set -Eeuo pipefail
          python3 .github/finalize-native-v2-source.py
          python3 -m py_compile oncotracer_cli/cli.py
          python3 -m unittest -v \
            tests/test_native_cli.py \
            tests/test_native_engine.py \
            tests/test_native_classifier.py
          python3 scripts/build_native_binary.py --output "$RUNNER_TEMP/oncotracer"
          "$RUNNER_TEMP/oncotracer" --version | grep -F 'OncoTracer 2.0.0'
      - name: Commit final audited source repairs
        if: steps.pending.outputs.value == 'true'
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oncotracer_cli/cli.py
          git rm -f .github/finalize-native-v2-source.py
          git commit -m 'Finalize audited native v2 backend probes'
          git push origin HEAD:agent/native-v2-parity
