name: ONT QuickStart 1 fix

on:
  pull_request:
    paths:
      - ".github/workflows/ont-quickstart1-fix.yml"
      - "main.nf"
      - "bin/scripts/run_ont_samurai_barcodes.sh"
      - "bin/scripts/download_quickstart_data.sh"
      - "examples/quickstart/verify_outputs.py"

permissions:
  contents: read

jobs:
  ont-quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NXF_ANSI_LOG: "false"
      NXF_DISABLE_CHECK_LATEST: "true"
      NXF_OPTS: "-Xms256m -Xmx1g"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            samtools bwa minimap2 pigz curl wget
          curl -fsSL https://get.nextflow.io | bash
          sudo install -m 0755 nextflow /usr/local/bin/nextflow

      - name: Add virtual-memory headroom
        run: |
          if [[ ! -e /swapfile.quickstart ]]; then
            sudo fallocate -l 8G /swapfile.quickstart
            sudo chmod 600 /swapfile.quickstart
            sudo mkswap /swapfile.quickstart
            sudo swapon /swapfile.quickstart || true
          fi
          swapon --show || true
          free -h

      - name: Prepare the public QuickStart files
        run: |
          umask 000
          nextflow run "$GITHUB_WORKSPACE/main.nf" \
            --make_test \
            --test_root "$GITHUB_WORKSPACE/test" \
            -work-dir "$GITHUB_WORKSPACE/test/work/prepare"

          NESTED_HOME="$GITHUB_WORKSPACE/test/runs/ont/01_samurai_ont/.nextflow"
          mkdir -p "$NESTED_HOME"
          cat > "$NESTED_HOME/config" <<'EOF_CONFIG'
          process {
            resourceLimits = [
              cpus: 4,
              memory: '15.GB',
              time: '4.h'
            ]
          }
          EOF_CONFIG

          cat "$GITHUB_WORKSPACE/test/configs/ont.quickstart.yml"
          cat "$NESTED_HOME/config"

      - name: Run the complete ONT QuickStart workflow
        run: |
          umask 000
          USER_SPEC="$(id -u):$(id -g)"
          mkdir -p "$GITHUB_WORKSPACE/test/reports"

          nextflow run "$GITHUB_WORKSPACE/main.nf" \
            --docker \
            --docker_user "$USER_SPEC" \
            -params-file "$GITHUB_WORKSPACE/test/configs/ont.quickstart.yml" \
            -work-dir "$GITHUB_WORKSPACE/test/work/ont" \
            -with-report "$GITHUB_WORKSPACE/test/reports/ont.report.html" \
            -with-timeline "$GITHUB_WORKSPACE/test/reports/ont.timeline.html" \
            -with-trace "$GITHUB_WORKSPACE/test/reports/ont.trace.tsv" \
            -resume

      - name: Verify the ONT outputs
        run: |
          SUMMARY="$GITHUB_WORKSPACE/test/runs/ont/06_workflow_summary/workflow_summary.txt"
          EVENTS="$GITHUB_WORKSPACE/test/runs/ont/03_cna_codification/cna_events.tsv"
          PLOTS="$GITHUB_WORKSPACE/test/runs/ont/04_cna_custom_plots/cna_per_sample_pages.pdf"

          test -s "$SUMMARY"
          test -s "$EVENTS"
          test -s "$PLOTS"
          grep -Fx 'mode=ont' "$SUMMARY"
          grep -Fx 'dataset=ONT_ichorcna_500kb' "$SUMMARY"
          cat "$SUMMARY"
          df -h

      - name: Upload logs and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ont-quickstart-fix-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .nextflow.log
            test/configs/**
            test/reports/**
            test/runs/ont/06_workflow_summary/**
            test/runs/ont/01_samurai_ont/logs/**
            test/runs/ont/01_samurai_ont/nextflow_launch/.nextflow.log
            test/runs/ont/01_samurai_ont/results/pipeline_info/**
