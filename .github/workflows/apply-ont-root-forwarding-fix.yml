name: Apply ONT root forwarding fix

on:
  push:
    branches:
      - agent/full-quickstart1-e2e
    paths:
      - ".github/workflows/apply-ont-root-forwarding-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-quickstart1-e2e
          fetch-depth: 0

      - name: Forward lpwgs_root to the ONT wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('main.nf')
          text = path.read_text(encoding='utf-8')
          old = """    --outdir '${samuraiOutdir}' \\\\\n    --analysis_type '${params.ont_analysis_type}' \\\\\n"""
          new = """    --outdir '${samuraiOutdir}' \\\\\n    --lpwgs-root '${params.lpwgs_root}' \\\\\n    --analysis_type '${params.ont_analysis_type}' \\\\\n"""
          if old not in text:
              raise SystemExit('expected RUN_ONT_SAMURAI argument block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          grep -A4 -F "--outdir '${samuraiOutdir}'" main.nf | grep -F -- "--lpwgs-root '${params.lpwgs_root}'"

      - name: Commit the source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.nf
          git commit -m "Forward the project root to the ONT launcher"
          git push origin HEAD:agent/full-quickstart1-e2e
