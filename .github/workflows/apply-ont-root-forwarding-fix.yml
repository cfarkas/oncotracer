name: Apply ONT root forwarding fix

on:
  push:
    branches:
      - agent/full-quickstart1-e2e
    paths:
      - ".github/workflows/apply-ont-root-forwarding-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-quickstart1-e2e
          fetch-depth: 0

      - name: Forward lpwgs_root to the ONT wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('main.nf')
          text = path.read_text(encoding='utf-8')
          if "--lpwgs-root '${params.lpwgs_root}'" in text[text.index('process RUN_ONT_SAMURAI {'):]:
              raise SystemExit('ONT lpwgs_root forwarding is already present')

          lines = text.splitlines(keepends=True)
          inside_ont = False
          inserted = False
          for index, line in enumerate(lines):
              if line.startswith('process RUN_ONT_SAMURAI {'):
                  inside_ont = True
              elif inside_ont and line.startswith('process ') and not line.startswith('process RUN_ONT_SAMURAI {'):
                  break
              elif inside_ont and "--outdir '${samuraiOutdir}'" in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  continuation = line.rstrip('\n').split()[-1]
                  lines.insert(
                      index + 1,
                      f"{indent}--lpwgs-root '${{params.lpwgs_root}}' {continuation}\n",
                  )
                  inserted = True
                  break

          if not inserted:
              raise SystemExit('RUN_ONT_SAMURAI --outdir line was not found')
          path.write_text(''.join(lines), encoding='utf-8')
          PY

          grep -A4 -F -- "--outdir '${samuraiOutdir}'" main.nf \
            | grep -F -- "--lpwgs-root '${params.lpwgs_root}'"

      - name: Commit the source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.nf
          git commit -m "Forward the project root to the ONT launcher"
          git push origin HEAD:agent/full-quickstart1-e2e
