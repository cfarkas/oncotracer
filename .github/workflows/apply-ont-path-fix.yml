name: Apply ONT path canonicalization fix

on:
  push:
    branches:
      - agent/full-quickstart1-e2e
    paths:
      - ".github/workflows/apply-ont-path-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-quickstart1-e2e
          fetch-depth: 0

      - name: Replace strict readlink canonicalization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bin/scripts/run_ont_samurai_barcodes.sh')
          text = path.read_text(encoding='utf-8')
          old = 'LPWGS_ROOT="$(readlink -f "$LPWGS_ROOT")"'
          new = 'LPWGS_ROOT="$(readlink -m "$LPWGS_ROOT")"'
          if old not in text:
              raise SystemExit('expected ONT LPWGS_ROOT readlink -f line was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          bash -n bin/scripts/run_ont_samurai_barcodes.sh
          grep -F 'LPWGS_ROOT="$(readlink -m "$LPWGS_ROOT")"' \
            bin/scripts/run_ont_samurai_barcodes.sh

      - name: Commit the source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/scripts/run_ont_samurai_barcodes.sh
          git commit -m "Fix ONT project-root canonicalization in containers"
          git push origin HEAD:agent/full-quickstart1-e2e
