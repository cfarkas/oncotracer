name: Apply simple clone commands across documentation

on:
  push:
    branches:
      - agent/simplify-clone-command-all-docs
    paths:
      - .github/workflows/apply-simple-clone-docs.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/simplify-clone-command-all-docs
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Simplify all repository command examples
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path.cwd()
          CLONE = "git clone https://github.com/cfarkas/oncotracer.git"
          CD = "cd oncotracer"
          OLD_ROOT = "/path/to/my/directory/oncotracer"
          BASH_RE = re.compile(r"```bash[ \t]*\n(.*?)```", re.DOTALL)
          REPO_ASSIGN_RE = re.compile(
              r'^([A-Z][A-Z0-9_]*)="?\$REPO_DIR(?:/([^"\n]*))?"?$'
          )
          ABS_ASSIGN_RE = re.compile(
              r'^([A-Z][A-Z0-9_]*)="?' + re.escape(OLD_ROOT) + r'(?:/([^"\n]*))?"?$'
          )

          markdown_files = [ROOT / "README.md"]
          markdown_files.extend(sorted((ROOT / "docs").rglob("*.md")))
          markdown_files.extend(sorted((ROOT / "examples").rglob("README.md")))

          clone_setup_comment = re.compile(
              r"^# (?:Set|Choose|Clone|Enter|Confirm|Use).*"
              r"(?:repository path|clone location|Clone OncoTracer|enter the repository|main\.nf|confirm the path).*$",
              re.IGNORECASE,
          )

          def transform_line(line: str, *, clone_block: bool) -> str | None:
              stripped = line.strip()

              if stripped.startswith("REPO_DIR="):
                  return None
              if stripped in {'cd "$REPO_DIR"', "cd '$REPO_DIR'", "cd $REPO_DIR"}:
                  return None
              if stripped in {"pwd", "ls main.nf", 'test -s "$REPO_DIR/main.nf"'}:
                  return None

              assignment = REPO_ASSIGN_RE.match(stripped)
              if assignment:
                  name, suffix = assignment.groups()
                  value = "$(pwd)" + (f"/{suffix}" if suffix else "")
                  return f'{name}="{value}"'

              assignment = ABS_ASSIGN_RE.match(stripped)
              if assignment:
                  name, suffix = assignment.groups()
                  value = "$(pwd)" + (f"/{suffix}" if suffix else "")
                  return f'{name}="{value}"'

              line = line.replace('"$REPO_DIR/main.nf"', "main.nf")
              line = line.replace("'$REPO_DIR/main.nf'", "main.nf")
              line = line.replace("$REPO_DIR/main.nf", "main.nf")
              line = re.sub(r'"\$REPO_DIR/([^"\n]+)"', r'"\1"', line)
              line = re.sub(r"'\$REPO_DIR/([^'\n]+)'", r"'\1'", line)
              line = re.sub(r"\$REPO_DIR/([^\s\\]+)", r"\1", line)
              line = line.replace('"$REPO_DIR"', ".")
              line = line.replace("'$REPO_DIR'", ".")
              line = line.replace("$REPO_DIR", ".")

              # Commands are executed after `cd oncotracer`, so paths in Bash
              # examples can be relative to the repository root.
              line = line.replace(OLD_ROOT + "/", "")
              line = line.replace(OLD_ROOT, ".")

              if clone_setup_comment.match(stripped) and not clone_block:
                  return "# Run this command from the oncotracer directory."
              return line

          def normalize_blank_lines(lines: list[str]) -> list[str]:
              result: list[str] = []
              for line in lines:
                  if line == "" and (not result or result[-1] == ""):
                      continue
                  result.append(line)
              while result and result[-1] == "":
                  result.pop()
              return result

          def transform_bash(block: str) -> str:
              original = block.splitlines()
              contains_clone = any(CLONE in line for line in original)
              remaining: list[str] = []

              if contains_clone:
                  clone_index = next(i for i, line in enumerate(original) if CLONE in line)
                  for index, line in enumerate(original):
                      stripped = line.strip()
                      if index == clone_index:
                          continue
                      if stripped.startswith("REPO_DIR="):
                          continue
                      if stripped in {'cd "$REPO_DIR"', "cd '$REPO_DIR'", "cd $REPO_DIR"}:
                          continue
                      if stripped in {"pwd", "ls main.nf", 'test -s "$REPO_DIR/main.nf"'}:
                          continue
                      if index < clone_index and stripped.startswith("#"):
                          continue
                      if index > clone_index and stripped.startswith("#") and clone_setup_comment.match(stripped):
                          continue
                      transformed = transform_line(line, clone_block=True)
                      if transformed is not None:
                          remaining.append(transformed.rstrip())

                  lines = [
                      "# Clone OncoTracer and enter the repository.",
                      CLONE,
                      CD,
                  ]
                  remaining = normalize_blank_lines(remaining)
                  if remaining:
                      lines.extend(["", *remaining])
              else:
                  lines = []
                  for line in original:
                      transformed = transform_line(line, clone_block=False)
                      if transformed is not None:
                          lines.append(transformed.rstrip())
                  lines = normalize_blank_lines(lines)

              if not lines:
                  return "# Run this command from the oncotracer directory.\n"

              first_nonblank = next((line.strip() for line in lines if line.strip()), "")
              if not first_nonblank.startswith("#"):
                  lines.insert(0, "# Run this command from the oncotracer directory.")
              return "\n".join(lines) + "\n"

          for path in markdown_files:
              text = path.read_text(encoding="utf-8")
              text = BASH_RE.sub(lambda match: "```bash\n" + transform_bash(match.group(1)) + "```", text)

              # Remove prose that asks users to define or edit REPO_DIR.
              text = re.sub(
                  r"Use `" + re.escape(OLD_ROOT) + r"` as the repository path[^\n]*\n",
                  "Run the commands from the cloned `oncotracer` directory.\n",
                  text,
              )
              text = re.sub(
                  r"The examples use `" + re.escape(OLD_ROOT) + r"` as the repository path[^\n]*\n",
                  "The examples use paths relative to the cloned `oncotracer` directory.\n",
                  text,
              )
              text = text.replace(
                  "Start from a fresh clone. In the commands below, the only path that needs to be edited is "
                  f"`{OLD_ROOT}`; every other path is derived from `REPO_DIR`.",
                  "Start from a fresh clone and run the remaining commands from the `oncotracer` directory.",
              )
              text = text.replace(
                  "It starts from a fresh OncoTracer clone and requires editing only "
                  f"`{OLD_ROOT}`.",
                  "It starts from a fresh OncoTracer clone and uses paths relative to the clone.",
              )
              text = text.replace("`REPO_DIR`", "the repository directory")
              text = text.replace("$REPO_DIR/", "")
              text = text.replace("$REPO_DIR", ".")
              path.write_text(text, encoding="utf-8")

          # Update the focused start-from-clone regression test.
          start_test = ROOT / "tests/test_examples_start_from_clone.py"
          start_test.write_text(
              '''#!/usr/bin/env python3
"""Require concise, copy/paste-ready repository examples."""

from __future__ import annotations

import re
import subprocess
import sys
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
CLONE_COMMAND = "git clone https://github.com/cfarkas/oncotracer.git"
CD_COMMAND = "cd oncotracer"

EXAMPLE_FILES = (
    "README.md",
    "docs/quick_start.md",
    "docs/public_cohort.md",
    "docs/full_tutorial.md",
    "docs/six_tumor_four_control.md",
    "docs/auto_params.md",
    "docs/installation.md",
    "docs/developer_guide.md",
    "examples/hcc1143_lpwgs/README.md",
    "examples/prjna754199/README.md",
)

BASH_BLOCK_RE = re.compile(r"```bash[ \\t]*\\n(.*?)```", re.DOTALL)
MARKDOWN_HEADING_RE = re.compile(r"^\\s*#{2,6}\\s")


def fail(message: str) -> None:
    print(f"FAIL: {message}", file=sys.stderr)
    raise SystemExit(1)


def read(relative_path: str) -> str:
    path = ROOT / relative_path
    if not path.is_file():
        fail(f"missing example file: {relative_path}")
    return path.read_text(encoding="utf-8")


def check_file(relative_path: str) -> None:
    text = read(relative_path)
    if text.count("```") % 2:
        fail(f"unbalanced Markdown code fences in {relative_path}")
    if "REPO_DIR=" in text:
        fail(f"verbose REPO_DIR setup remains in {relative_path}")
    if 'git clone https://github.com/cfarkas/oncotracer.git "$REPO_DIR"' in text:
        fail(f"target-path clone remains in {relative_path}")

    blocks = BASH_BLOCK_RE.findall(text)
    if not blocks:
        fail(f"no Bash command blocks found in {relative_path}")

    clone_blocks = [block for block in blocks if CLONE_COMMAND in block]
    if not clone_blocks:
        fail(f"no clone command found in {relative_path}")
    first_clone = clone_blocks[0]
    if CD_COMMAND not in first_clone:
        fail(f"clone block does not enter oncotracer in {relative_path}")
    if first_clone.index(CLONE_COMMAND) > first_clone.index(CD_COMMAND):
        fail(f"cd oncotracer appears before clone in {relative_path}")

    for block_number, block in enumerate(blocks, start=1):
        first_line = next((line.strip() for line in block.splitlines() if line.strip()), "")
        if not first_line.startswith("#"):
            fail(f"Bash block {block_number} in {relative_path} must begin with #")
        if "REPO_DIR=" in block or "$REPO_DIR" in block:
            fail(f"REPO_DIR remains in Bash block {block_number} of {relative_path}")
        for line in block.splitlines():
            if MARKDOWN_HEADING_RE.match(line):
                fail(f"Markdown heading leaked into Bash block {block_number} of {relative_path}")
        completed = subprocess.run(
            ["bash", "-n"], input=block, text=True, capture_output=True, check=False
        )
        if completed.returncode != 0:
            detail = completed.stderr.strip() or "unknown Bash parse error"
            fail(f"invalid Bash block {block_number} in {relative_path}: {detail}")


def main() -> None:
    for relative_path in EXAMPLE_FILES:
        check_file(relative_path)
    print("PASS: examples use git clone followed by cd oncotracer and valid relative commands")


if __name__ == "__main__":
    main()
''',
              encoding="utf-8",
          )

          # Update the broader documentation checks without changing the
          # scientific source tests.
          style_test = ROOT / "tests/test_docs_style.py"
          style = style_test.read_text(encoding="utf-8")
          style = style.replace(
              'STANDARD_REPOSITORY_PATH = "/path/to/my/directory/oncotracer"\n',
              'CLONE_COMMAND = "git clone https://github.com/cfarkas/oncotracer.git"\n'
              'CD_COMMAND = "cd oncotracer"\n',
          )
          style = style.replace("        STANDARD_REPOSITORY_PATH,\n", "        CLONE_COMMAND,\n")
          style = style.replace(
              '''    for relative_path in GENERIC_PATH_FILES:\n        if STANDARD_REPOSITORY_PATH not in read(relative_path):\n            fail(\n                f"missing standard repository path in {relative_path}: "\n                f"{STANDARD_REPOSITORY_PATH}"\n            )\n''',
              '''    for path in DOC_TEXT_FILES:\n        text = path.read_text(encoding="utf-8")\n        if "REPO_DIR=" in text or "$REPO_DIR" in text:\n            fail(f"verbose REPO_DIR usage in {path.relative_to(ROOT)}")\n        if 'git clone https://github.com/cfarkas/oncotracer.git "$REPO_DIR"' in text:\n            fail(f"target-path clone in {path.relative_to(ROOT)}")\n''',
          )
          style_test.write_text(style, encoding="utf-8")
          PY

      - name: Remove temporary patch workflows
        run: |
          rm -f .github/workflows/audit-clone-docs.yml
          rm -f .github/workflows/apply-simple-clone-docs.yml

      - name: Validate every documented command
        run: |
          python3 tests/test_docs_style.py
          python3 tests/test_examples_start_from_clone.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

          ! grep -R -n -E 'REPO_DIR=|\$REPO_DIR' README.md docs examples
          ! grep -R -n -F 'git clone https://github.com/cfarkas/oncotracer.git "$REPO_DIR"' \
            README.md docs examples
          grep -R -n -F 'git clone https://github.com/cfarkas/oncotracer.git' \
            README.md docs examples >/dev/null
          grep -R -n -F 'cd oncotracer' README.md docs examples >/dev/null

      - name: Commit and push the simplified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs examples tests .github/workflows
          git commit -m "Docs: simplify clone commands across all examples"
          git push origin HEAD:agent/simplify-clone-command-all-docs
