name: Rerun exact-main QuickStarts and release v1.1

on:
  push:
    branches:
      - agent/v1.1-exact-main-release
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      TARGET_SHA: 0f1a3d86521afcb5eac3ce6e65fd45d455e8c843
      QUICKSTART1_WORKFLOW: full-conda-quickstarts-v1.1.yml
      QUICKSTART2_WORKFLOW: full-v1.1-quickstart2.yml

    steps:
      - name: Confirm the exact merged main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$MAIN_SHA" != "$TARGET_SHA" ]]; then
            echo "ERROR: main moved to $MAIN_SHA; expected exact merged commit $TARGET_SHA" >&2
            exit 1
          fi
          echo "Exact main commit confirmed: $TARGET_SHA"

      - name: Dispatch both QuickStart workflows on exact main
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"

          find_new_run() {
            local workflow="$1" run_id=""
            for _ in $(seq 1 60); do
              run_id="$(
                gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=30" |
                  jq -r --arg sha "$TARGET_SHA" --arg start "$STARTED_AT" \
                    '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $start)] | sort_by(.created_at) | last | .id // empty'
              )"
              if [[ -n "$run_id" ]]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          dispatch_or_rerun() {
            local workflow="$1" run_id="" latest_status=""

            if gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main; then
              if run_id="$(find_new_run "$workflow")"; then
                printf '%s\n' "$run_id"
                return 0
              fi
              echo "WARN: workflow dispatch was accepted but no new run appeared; trying the existing exact-main run" >&2
            else
              echo "WARN: workflow dispatch was not accepted; trying the existing exact-main run" >&2
            fi

            run_id="$(
              gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&per_page=50" |
                jq -r --arg sha "$TARGET_SHA" \
                  '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty'
            )"
            [[ -n "$run_id" ]] || {
              echo "ERROR: no workflow run exists for $workflow at $TARGET_SHA" >&2
              return 1
            }

            latest_status="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            while [[ "$latest_status" != "completed" ]]; do
              echo "Waiting for existing run $run_id to complete before rerunning it: $latest_status" >&2
              sleep 60
              latest_status="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            done

            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun" >/dev/null
            printf '%s\n' "$run_id"
          }

          QUICKSTART1_RUN_ID="$(dispatch_or_rerun "$QUICKSTART1_WORKFLOW")"
          QUICKSTART2_RUN_ID="$(dispatch_or_rerun "$QUICKSTART2_WORKFLOW")"

          echo "quickstart1_run_id=$QUICKSTART1_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "quickstart2_run_id=$QUICKSTART2_RUN_ID" >> "$GITHUB_OUTPUT"

          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "Exact-main v1.1 validation dispatched for commit \`$TARGET_SHA\`:\n\n- QuickStart 1: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QUICKSTART1_RUN_ID\n- QuickStart 2: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QUICKSTART2_RUN_ID\n\nThe stable release will be created only if both reruns pass."

      - name: Wait for both exact-main validations
        env:
          GH_TOKEN: ${{ github.token }}
          QUICKSTART1_RUN_ID: ${{ steps.dispatch.outputs.quickstart1_run_id }}
          QUICKSTART2_RUN_ID: ${{ steps.dispatch.outputs.quickstart2_run_id }}
        run: |
          set -Eeuo pipefail

          run_state() {
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$1" \
              --jq '[.status, (.conclusion // "pending"), .head_sha, .head_branch, .event, .run_attempt] | @tsv'
          }

          completed=false
          for _ in $(seq 1 700); do
            IFS=$'\t' read -r QS1_STATUS QS1_CONCLUSION QS1_SHA QS1_BRANCH QS1_EVENT QS1_ATTEMPT \
              <<< "$(run_state "$QUICKSTART1_RUN_ID")"
            IFS=$'\t' read -r QS2_STATUS QS2_CONCLUSION QS2_SHA QS2_BRANCH QS2_EVENT QS2_ATTEMPT \
              <<< "$(run_state "$QUICKSTART2_RUN_ID")"

            printf 'QuickStart 1: status=%s conclusion=%s attempt=%s\n' "$QS1_STATUS" "$QS1_CONCLUSION" "$QS1_ATTEMPT"
            printf 'QuickStart 2: status=%s conclusion=%s attempt=%s\n' "$QS2_STATUS" "$QS2_CONCLUSION" "$QS2_ATTEMPT"

            [[ "$QS1_SHA" == "$TARGET_SHA" && "$QS1_BRANCH" == "main" ]] || {
              echo "ERROR: QuickStart 1 is not attached to exact main commit $TARGET_SHA" >&2
              exit 1
            }
            [[ "$QS2_SHA" == "$TARGET_SHA" && "$QS2_BRANCH" == "main" ]] || {
              echo "ERROR: QuickStart 2 is not attached to exact main commit $TARGET_SHA" >&2
              exit 1
            }

            if [[ "$QS1_STATUS" == "completed" && "$QS2_STATUS" == "completed" ]]; then
              completed=true
              break
            fi
            sleep 60
          done

          [[ "$completed" == true ]] || {
            echo "ERROR: exact-main validation timed out" >&2
            exit 1
          }
          [[ "$QS1_CONCLUSION" == "success" ]] || {
            echo "ERROR: QuickStart 1 finished with $QS1_CONCLUSION" >&2
            exit 1
          }
          [[ "$QS2_CONCLUSION" == "success" ]] || {
            echo "ERROR: QuickStart 2 finished with $QS2_CONCLUSION" >&2
            exit 1
          }

      - name: Verify all Docker, Poetry, and Conda jobs
        env:
          GH_TOKEN: ${{ github.token }}
          QUICKSTART1_RUN_ID: ${{ steps.dispatch.outputs.quickstart1_run_id }}
          QUICKSTART2_RUN_ID: ${{ steps.dispatch.outputs.quickstart2_run_id }}
        run: |
          set -Eeuo pipefail

          verify_job() {
            local run_id="$1" job_name="$2" conclusion
            conclusion="$(
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" |
                jq -r --arg name "$job_name" '[.jobs[] | select(.name == $name)] | last | .conclusion // empty'
            )"
            if [[ "$conclusion" != "success" ]]; then
              echo "ERROR: $job_name conclusion is '$conclusion'" >&2
              exit 1
            fi
            echo "PASS: $job_name"
          }

          verify_job "$QUICKSTART1_RUN_ID" "docker / QuickStart 1"
          verify_job "$QUICKSTART1_RUN_ID" "poetry / QuickStart 1"
          verify_job "$QUICKSTART1_RUN_ID" "conda / QuickStart 1"
          verify_job "$QUICKSTART2_RUN_ID" "docker / QuickStart 2"
          verify_job "$QUICKSTART2_RUN_ID" "poetry / QuickStart 2"
          verify_job "$QUICKSTART2_RUN_ID" "conda / QuickStart 2"

      - name: Publish stable OncoTracer v1.1
        env:
          GH_TOKEN: ${{ github.token }}
          QUICKSTART1_RUN_ID: ${{ steps.dispatch.outputs.quickstart1_run_id }}
          QUICKSTART2_RUN_ID: ${{ steps.dispatch.outputs.quickstart2_run_id }}
        run: |
          set -Eeuo pipefail

          if gh release view v1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/v1.1" --jq '.sha')"
            [[ "$TAG_SHA" == "$TARGET_SHA" ]] || {
              echo "ERROR: existing v1.1 points to $TAG_SHA, expected $TARGET_SHA" >&2
              exit 1
            }
            echo "Stable v1.1 already exists for the validated commit."
          else
            cat > release-notes-v1.1.md <<EOF_NOTES
          # OncoTracer v1.1

          Stable research release with three validated execution routes:

          1. Nextflow with Docker or Singularity/Apptainer
          2. The Poetry-managed OncoTracer launcher
          3. Nextflow with Conda

          Both public QuickStarts were rerun on exact main commit \`$TARGET_SHA\` through Docker, Poetry with Docker, and Conda. Validation covered public-read integrity, Automatic Setup, SAMURAI, qDNAseq/ichorCNA, BAM refinement, CNA tables, plots, summaries, BAM integrity, final output verifiers, portable Docker ownership, and the pinned local SAMURAI source cache.

          Validation runs:

          - QuickStart 1: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QUICKSTART1_RUN_ID
          - QuickStart 2: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QUICKSTART2_RUN_ID

          OncoTracer is for research use and is not a standalone diagnostic system.
          EOF_NOTES

            gh release create v1.1 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "OncoTracer v1.1" \
              --notes-file release-notes-v1.1.md
          fi

          TAG_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/v1.1" --jq '.sha')"
          [[ "$TAG_SHA" == "$TARGET_SHA" ]]
          RELEASE_URL="$(gh release view v1.1 --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"

          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "Stable OncoTracer v1.1 released from exact validated main commit \`$TARGET_SHA\`.\n\n- QuickStart 1: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QUICKSTART1_RUN_ID\n- QuickStart 2: https://github.com/$GITHUB_REPOSITORY/actions/runs/$QUICKSTART2_RUN_ID\n- Release: $RELEASE_URL"

          echo "Release: $RELEASE_URL"

      - name: Report orchestration failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "Exact-main v1.1 validation or release failed. Orchestration log: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
