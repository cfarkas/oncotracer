name: Validate permanent beginner test path v2

on:
  push:
    branches:
      - agent/beginner-runtime-staging
    paths:
      - .github/workflows/beginner-permanent-path-smoke-v2.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beginner-runtime-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run permanent beginner regressions
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q oncotracer_cli tests scripts bin
          bash tests/test_runtime_portability.sh
          python3 tests/test_copy_paste_paths.py
