name: Bootstrap reviewed native v2 branch

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: bootstrap-native-v2-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/native-v2-parity'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the isolated implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-v2-parity
          fetch-depth: 0

      - name: Reconstruct and authenticate the reviewed source archive
        run: |
          set -Eeuo pipefail
          cat .github/native-v2-bundle.part* | base64 --decode > "$RUNNER_TEMP/native-v2.tar.gz"
          echo "f374c8f80dd320ab7de0be13bb6ad6ad9a82dfdb725f318893322efee6deb4a1  $RUNNER_TEMP/native-v2.tar.gz" | sha256sum -c -
          tar -tzf "$RUNNER_TEMP/native-v2.tar.gz" | tee "$RUNNER_TEMP/archive-manifest.txt"
          tar -xzf "$RUNNER_TEMP/native-v2.tar.gz"

      - name: Remove v1 release jobs and bootstrap transport files from the candidate
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/ci.yml \
            .github/workflows/full-conda-quickstarts-v1.1.yml \
            .github/workflows/full-v1.1-quickstart2.yml \
            .github/workflows/release-v1.1-after-conda-validation.yml
          rm -f .github/native-v2-bundle.part* .github/native-v2-bundle.ready
          rm -f .github/workflows/apply-native-v2-bundle.yml

      - name: Validate the materialized source and copied executable
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q oncotracer_cli tests scripts
          python3 -m unittest -v \
            tests/test_native_cli.py \
            tests/test_native_engine.py \
            tests/test_compare_native_parity.py \
            tests/test_native_docs.py \
            tests/test_poetry_cli.py
          python3 scripts/build_native_binary.py --output "$RUNNER_TEMP/oncotracer"
          (cd /tmp && "$RUNNER_TEMP/oncotracer" --version | grep -F 'OncoTracer 2.0.0')
          if grep -R -n --include='*.py' --include='*.R' --include='Dockerfile' \
            -E 'nextflow[[:space:]]+run|exec[[:space:]]+nextflow' \
            oncotracer_cli bin/scripts Dockerfile; then
            echo 'ERROR: native runtime source invokes Nextflow' >&2
            exit 1
          fi

      - name: Publish one reviewed implementation commit to the candidate branch
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Implement native OncoTracer v2 with parity release gates'
          git push origin HEAD:agent/native-v2-parity

      - name: Record completion on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Native v2 source archive authenticated and materialized from SHA-256 \`f374c8f80dd320ab7de0be13bb6ad6ad9a82dfdb725f318893322efee6deb4a1\`."

  validate_release_candidate:
    if: >-
      github.event.pull_request.head.ref == 'agent/v2.0-release-validation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Dispatch and wait for exact-head native v2 gates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BRANCH: agent/v2.0-release-validation
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          current_sha() {
            gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_BRANCH" --jq '.object.sha'
          }
          test "$(current_sha)" = "$EXPECTED_SHA"
          start_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          workflows=(
            native-v2-ci.yml
            native-v2-quickstart1-parity.yml
            native-v2-quickstart2-parity.yml
          )
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" --ref "$CANDIDATE_BRANCH" --repo "$GITHUB_REPOSITORY"
          done

          resolve_run() {
            local workflow="$1" run_id=""
            for attempt in $(seq 1 120); do
              run_id="$(gh api \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=$CANDIDATE_BRANCH&per_page=30" \
                --jq ".workflow_runs | map(select(.head_sha == \"$EXPECTED_SHA\" and .created_at >= \"$start_time\")) | sort_by(.id) | last | .id // empty")"
              if [[ -n "$run_id" ]]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done
            echo "Timed out resolving dispatched run for $workflow" >&2
            return 1
          }

          declare -A run_ids
          for workflow in "${workflows[@]}"; do
            run_ids[$workflow]="$(resolve_run "$workflow")"
          done

          status=0
          summary="Exact-head validation for \`$EXPECTED_SHA\`:"
          for workflow in "${workflows[@]}"; do
            run_id="${run_ids[$workflow]}"
            run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
            if gh run watch "$run_id" --exit-status --repo "$GITHUB_REPOSITORY"; then
              conclusion=success
            else
              conclusion=failure
              status=1
            fi
            summary="$summary
          - \`$workflow\`: **$conclusion** — $run_url"
          done
          test "$(current_sha)" = "$EXPECTED_SHA" || {
            summary="$summary
          - candidate branch moved during validation: **failure**"
            status=1
          }
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$summary"
          exit "$status"
