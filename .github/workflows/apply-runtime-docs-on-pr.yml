name: Apply four-route documentation patch on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.head_ref == 'agent/docs-all-runtime-routes-v1.1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/docs-all-runtime-routes-v1.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute the versioned patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/apply-runtime-docs-v1.1.yml').read_text(encoding='utf-8')
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n"
          if marker_start not in workflow or marker_end not in workflow:
              raise SystemExit('Unable to locate the embedded documentation patch script')
          embedded = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          script, removed = re.subn(
              r'\nreplace_once\(\n\s+"README\.md",\n\s+"Nextflow can create and reuse the required Conda environments automatically.*?\n\s*\)\n',
              '\n',
              script,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit('Unable to remove the redundant README Conda sentence replacement')
          exec(compile(script, 'apply-runtime-docs-v1.1.py', 'exec'), {})
          PY

      - name: Remove temporary patch workflows
        run: |
          rm -f .github/workflows/apply-runtime-docs-v1.1.yml
          rm -f .github/workflows/apply-runtime-docs-on-pr.yml

      - name: Validate command examples and documentation
        run: |
          python3 tests/test_docs_style.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Commit and push the completed documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs examples tests .github/workflows
          git commit -m "Docs: show all four execution methods in every example"
          git push origin HEAD:agent/docs-all-runtime-routes-v1.1
