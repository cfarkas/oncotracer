          replace_once(
              "examples/prjna754199/README.md",
              "Use Linux with Git, Java 17 or newer, Nextflow, Python 3, samtools, BWA, minimap2, pigz, curl or wget, and Docker or Singularity/Apptainer.",
              "Use Linux with Git, Java 17 or newer, Nextflow, Python 3, samtools, BWA, minimap2, pigz, curl or wget, and one launch method: Docker, Singularity/Apptainer, Poetry, or Conda.",
          )

          # ------------------------------------------------------------------
          # Documentation regression tests
          # ------------------------------------------------------------------
          tests = read("tests/test_docs_style.py")
          tests = tests.replace(
              '"--make_test --conda",',
              '"## Choose one of four execution methods",\n        "### Docker",\n        "### Singularity or Apptainer",\n        "### Poetry launcher",\n        "### Conda",',
              1,
          )
          tests = tests.replace(
              '"--auto_params --conda",',
              '"## 6. Run the analysis",\n        "### Docker",\n        "### Singularity or Apptainer",\n        "### Poetry launcher",\n        "### Conda",',
              1,
          )
          tests = tests.replace(
              '"## Estimated time and resources",\n    ),',
              '"## Estimated time and resources",\n        "### Docker",\n        "### Singularity or Apptainer",\n        "### Poetry launcher",\n        "### Conda",\n    ),',
              1,
          )
          tests = tests.replace(
              '"CTRL004,NORMAL",\n    ),',
              '"CTRL004,NORMAL",\n        "### Docker",\n        "### Singularity or Apptainer",\n        "### Poetry launcher",\n        "### Conda",\n    ),',
              1,
          )
          tests = tests.replace(
              '"barcode,sample_name,status\\nbarcode01,TUMOR_01,TUMOR",\n    ),',
              '"barcode,sample_name,status\\nbarcode01,TUMOR_01,TUMOR",\n        "#### Docker",\n        "#### Singularity or Apptainer",\n        "#### Poetry launcher",\n        "#### Conda",\n    ),',
              1,
          )
          marker = "BASH_BLOCK_RE = re.compile"
          route_check = '''ROUTE_EXAMPLE_FILES = (\n    "docs/quick_start.md",\n    "docs/public_cohort.md",\n    "docs/full_tutorial.md",\n    "docs/six_tumor_four_control.md",\n    "docs/auto_params.md",\n    "examples/hcc1143_lpwgs/README.md",\n    "examples/prjna754199/README.md",\n)\n\nROUTE_SNIPPETS = (\n    "--docker",\n    "--singularity",\n    "poetry run oncotracer",\n    "--conda",\n)\n\n'''
          if route_check not in tests:
              tests = tests.replace(marker, route_check + marker, 1)
          function_marker = "def check_commented_bash_blocks() -> None:\n"
          route_function = '''def check_all_example_routes() -> None:\n    for relative_path in ROUTE_EXAMPLE_FILES:\n        text = read(relative_path)\n        for snippet in ROUTE_SNIPPETS:\n            if snippet not in text:\n                fail(f"missing execution route in {relative_path}: {snippet}")\n\n\n'''
          if route_function not in tests:
              tests = tests.replace(function_marker, route_function + function_marker, 1)
          tests = tests.replace(
              "    check_hcc1143_wget_downloads()\n    check_commented_bash_blocks()",
              "    check_hcc1143_wget_downloads()\n    check_all_example_routes()\n    check_commented_bash_blocks()",
              1,
          )
          write("tests/test_docs_style.py", tests)
          PY

      - name: Remove the temporary patch workflow
        run: rm -f .github/workflows/apply-runtime-docs-v1.1.yml

      - name: Check documentation examples
        run: python3 tests/test_docs_style.py

      - name: Build GitHub Pages documentation strictly
        run: |
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Commit and push the documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs examples tests .github/workflows/apply-runtime-docs-v1.1.yml
          git commit -m "Docs: show all four execution methods in every example"
          git push origin HEAD:agent/docs-all-runtime-routes-v1.1
