name: Apply four-route documentation updates

on:
  push:
    branches:
      - agent/docs-all-runtime-routes-v1.1
    paths:
      - .github/workflows/apply-runtime-docs-v1.1.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/docs-all-runtime-routes-v1.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply consistent Docker, Singularity, Poetry, and Conda examples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Missing exact text in {path}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Pattern matched {count} times in {path}: {pattern}")
              write(path, updated)

          # ------------------------------------------------------------------
          # Repository front page
          # ------------------------------------------------------------------
          replace_regex(
              "README.md",
              r"Run OncoTracer by one of three routes:\n\n1\. \*\*Docker or Singularity/Apptainer:\*\*.*?3\. \*\*Conda:\*\*.*?\n\n",
              """Run OncoTracer in one of four supported ways:\n\n1. **Docker:** call `nextflow run` with `--docker`; this uses [`carlosfarkas/oncotracer:latest`](https://hub.docker.com/r/carlosfarkas/oncotracer).\n2. **Singularity or Apptainer:** call `nextflow run` with `--singularity`; this uses `docker://carlosfarkas/oncotracer:latest` on a configured HPC system.\n3. **Poetry launcher:** run `poetry install`, then call `poetry run oncotracer --backend docker ...`. Poetry manages the isolated Python launcher and forwards the workflow arguments to Nextflow.\n4. **Conda:** call `nextflow run` with `--conda`; Nextflow creates and reuses the required native environments automatically from the versioned definitions.\n\n""",
          )
          replace_once(
              "README.md",
              "Nextflow can create and reuse the required Conda environments automatically from the versioned native definitions from the versioned definitions.",
              "Nextflow creates and reuses the required Conda environments automatically from the versioned native definitions.",
          )
          replace_once(
              "README.md",
              "The commands below use Docker; replace `--docker` with `--conda` to let Nextflow create and reuse Conda environments automatically.",
              "The compact commands below use Docker. The complete QuickStart page provides explicit Docker, Singularity/Apptainer, Poetry, and Conda command sets.",
          )
          replace_once(
              "README.md",
              "The HCC1143 example downloads six public paired-end FASTQs. The following block exposes the complete `wget` download, file naming, sample-table creation, Automatic Setup, and analysis commands. Replace `--docker` with `--conda` for automatic Conda environment creation.",
              "The HCC1143 example downloads six public paired-end FASTQs. The block below exposes the complete `wget` download, file naming, sample-table creation, Automatic Setup, and a Docker analysis command. The complete QuickStart page provides explicit Docker, Singularity/Apptainer, Poetry, and Conda commands.",
          )
          replace_once(
              "README.md",
              "[Six tumors and four normal controls](https://cfarkas.github.io/oncotracer/six_tumor_four_control/) is a mock example that illustrates how four `NORMAL` samples are used to build a local qDNAseq panel of normals and correct CNA profiles for six `TUMOR` samples.",
              "[Six tumors and four normal controls](https://cfarkas.github.io/oncotracer/six_tumor_four_control/) is a mock example that illustrates how four `NORMAL` samples are used to build a local qDNAseq panel of normals and correct CNA profiles for six `TUMOR` samples. Its run section shows Docker, Singularity/Apptainer, Poetry, and Conda alternatives.",
          )

          route_overview = r'''## Four equivalent analysis commands

After a YAML has been generated, choose **one** of the following methods. Keep the same YAML and work directory when using `-resume`; use a separate work directory when comparing different execution methods.

### Docker

```bash
# Set the repository, generated YAML, and Docker work directory.
REPO_DIR=/path/to/my/directory/oncotracer
CONFIG=/path/to/my/directory/my_oncotracer_project/config/illumina.auto.yml
WORK_DIR=/path/to/my/directory/my_oncotracer_project/work/docker

# Run through Nextflow with the maintained Docker image.
nextflow run "$REPO_DIR/main.nf" --docker \
  -params-file "$CONFIG" \
  -work-dir "$WORK_DIR" \
  -resume
```

### Singularity or Apptainer

```bash
# Set the repository, generated YAML, and HPC work directory.
REPO_DIR=/path/to/my/directory/oncotracer
CONFIG=/path/to/my/directory/my_oncotracer_project/config/illumina.auto.yml
WORK_DIR=/path/to/my/directory/my_oncotracer_project/work/singularity

# Run through Nextflow with Singularity or Apptainer.
nextflow run "$REPO_DIR/main.nf" --singularity \
  -params-file "$CONFIG" \
  -work-dir "$WORK_DIR" \
  -resume
```

### Poetry launcher

```bash
# Install the locked launcher and set the generated YAML and work directory.
REPO_DIR=/path/to/my/directory/oncotracer
CONFIG=/path/to/my/directory/my_oncotracer_project/config/illumina.auto.yml
WORK_DIR=/path/to/my/directory/my_oncotracer_project/work/poetry
cd "$REPO_DIR"
poetry install --no-interaction

# Launch OncoTracer through Poetry with Docker as the scientific backend.
poetry run oncotracer --repo-dir "$REPO_DIR" --backend docker \
  -params-file "$CONFIG" \
  -work-dir "$WORK_DIR" \
  -resume
```

### Conda

```bash
# Set the repository, generated YAML, and Conda work directory.
REPO_DIR=/path/to/my/directory/oncotracer
CONFIG=/path/to/my/directory/my_oncotracer_project/config/illumina.auto.yml
WORK_DIR=/path/to/my/directory/my_oncotracer_project/work/conda

# Let Nextflow create or reuse the required Conda environments.
nextflow run "$REPO_DIR/main.nf" --conda \
  -params-file "$CONFIG" \
  -work-dir "$WORK_DIR" \
  -resume
```

The Poetry launcher also accepts `--backend singularity` and `--backend conda`; the example above uses Docker so that Poetry remains a distinct invocation method.

'''
          replace_once("README.md", "## Poetry launcher\n", route_overview + "## Poetry launcher\n")

          # ------------------------------------------------------------------
          # Documentation home and installation
          # ------------------------------------------------------------------
          replace_regex(
              "docs/index.md",
              r"Choose one of three execution routes:\n\n1\. .*?3\. .*?\n\n",
              """Choose one of four supported ways to launch an analysis:\n\n1. **Docker:** `nextflow run ... --docker`.\n2. **Singularity or Apptainer:** `nextflow run ... --singularity`.\n3. **Poetry launcher:** `poetry run oncotracer --backend docker ...`.\n4. **Conda:** `nextflow run ... --conda`; Nextflow creates and reuses the native environments automatically.\n\nEvery QuickStart, the Full Tutorial, Automatic Setup, and the mock tumor/normal example provide explicit commands for all four methods.\n\n""",
          )
          replace_once(
              "docs/index.md",
              "4. Run the YAML with `--conda`, `--docker`, or `--singularity` and `-resume`.",
              "4. Run the YAML with Docker, Singularity/Apptainer, the Poetry launcher, or Conda and keep `-resume` enabled.",
          )
