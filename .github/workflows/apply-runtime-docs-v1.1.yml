              "# Create or reuse the Conda environment, download the reads, validate them, and create both YAML files.\nnextflow run \"$REPO_DIR/main.nf\" --make_test --conda \\",
              "# Download the reads, validate them, and create both YAML files.\nnextflow run \"$REPO_DIR/main.nf\" --make_test \\",
          )

          quickstart_tail = r'''## Choose one of four execution methods

