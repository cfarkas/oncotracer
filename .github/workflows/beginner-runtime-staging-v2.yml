name: Validate staged beginner runtime fixes

on:
  push:
    branches:
      - agent/beginner-runtime-staging
    paths:
      - .github/workflows/beginner-runtime-staging-v2.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beginner-runtime-staging
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded source patch
        run: python3 scripts/apply_beginner_runtime_patch.py

      - name: Test beginner and existing source contracts
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q oncotracer_cli tests scripts bin
          python3 -m unittest -v \
            tests/test_beginner_runtime.py \
            tests/test_native_cli.py \
            tests/test_native_engine.py
          python3 tests/test_copy_paste_paths.py
          python3 tests/test_docs_style.py
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict --site-dir /tmp/oncotracer-beginner-site

      - name: Commit validated fixes
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oncotracer_cli/cli.py oncotracer_cli/engine.py oncotracer_cli/runtime.py \
            tests/test_beginner_runtime.py
          git diff --cached --check
          git commit -m 'fix(cli): make beginner dry-runs and resume side-effect safe'
          git push origin HEAD:agent/beginner-runtime-staging
