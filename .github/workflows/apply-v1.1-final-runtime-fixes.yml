name: Apply v1.1 final runtime fixes

on:
  push:
    branches:
      - agent/conda-docs-v1.1
    paths:
      - ".github/workflows/apply-v1.1-final-runtime-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/conda-docs-v1.1
          fetch-depth: 0

      - name: Apply Docker, GitHub authentication, and release-gate fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text was not found in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "nextflow.config",
              "  docker_user = '1000:1000'",
              "  // Evaluate the host UID/GID when Docker starts, preventing root-owned or unwritable work files.\n"
              "  docker_user = '$(id -u):$(id -g)'",
          )

          workflow = Path(".github/workflows/full-conda-quickstarts-v1.1.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          token_line = '  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n'
          if token_line not in workflow_text:
              marker = '  PIP_NO_CACHE_DIR: "1"\n'
              if marker not in workflow_text:
                  raise SystemExit("Could not find the full-validation env block")
              workflow_text = workflow_text.replace(marker, marker + token_line, 1)
          workflow.write_text(workflow_text, encoding="utf-8")

          release = Path(".github/workflows/release-v1.1-after-conda-validation.yml")
          release.write_text(
              '''name: Release v1.1 after full runtime validation

on:
  workflow_run:
    workflows:
      - Full v1.1 QuickStarts across Docker, Poetry, and Conda
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Require the successful matrix run to match current main
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$VALIDATED_SHA" != "$MAIN_SHA" ]]; then
            echo "ERROR: validated commit $VALIDATED_SHA is not current main $MAIN_SHA" >&2
            exit 1
          fi

          if [[ '${{ github.event.workflow_run.name }}' != 'Full v1.1 QuickStarts across Docker, Poetry, and Conda' ]]; then
            echo "ERROR: unexpected validation workflow name" >&2
            exit 1
          fi

          echo "Validated current main commit: $VALIDATED_SHA"

      - name: Publish stable OncoTracer v1.1
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          if gh release view v1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force --tags origin
            TAG_SHA="$(git rev-list -n 1 v1.1)"
            if [[ "$TAG_SHA" != "$VALIDATED_SHA" ]]; then
              echo "ERROR: existing v1.1 points to $TAG_SHA, not validated main commit $VALIDATED_SHA" >&2
              exit 1
            fi

            echo "Stable v1.1 is already published for this validated commit."
            gh release view v1.1 \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,name,isDraft,isPrerelease,targetCommitish,publishedAt,url
            exit 0
          fi

          cat > release-notes-v1.1.md <<EOF_NOTES
          # OncoTracer v1.1

          Stable research release adding first-class Conda execution and a Poetry-managed launcher while retaining Docker and Singularity/Apptainer support.

          Validated on commit \`$VALIDATED_SHA\` with both public QuickStarts across all release routes:

          - Docker: QuickStart 1 and the three-library HCC1143 QuickStart 2.
          - Poetry with the Docker backend: QuickStart 1 and QuickStart 2.
          - Conda: QuickStart 1 and QuickStart 2, with Nextflow creating and reusing the required environments.

          The validation includes Automatic Setup, public-read integrity checks, SAMURAI, qDNAseq/ichorCNA, BAM refinement, CNA tables, plots, summaries, and repository output verifiers.

          OncoTracer is for research use and is not a standalone diagnostic system.
          EOF_NOTES

          gh release create v1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_SHA" \
            --title "OncoTracer v1.1" \
            --notes-file release-notes-v1.1.md

          gh release view v1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,publishedAt,url
''',
              encoding="utf-8",
          )

          runtime_test = Path("tests/test_runtime_release_config.sh")
          runtime_test.write_text(
              '''#!/usr/bin/env bash
set -Eeuo pipefail

ROOT="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd -P)"
cd "$ROOT"

grep -F "docker_user = '\$(id -u):\$(id -g)'" nextflow.config >/dev/null
grep -F 'GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}' .github/workflows/full-conda-quickstarts-v1.1.yml >/dev/null
grep -F 'workflow_run:' .github/workflows/release-v1.1-after-conda-validation.yml >/dev/null
grep -F 'Full v1.1 QuickStarts across Docker, Poetry, and Conda' .github/workflows/release-v1.1-after-conda-validation.yml >/dev/null

echo "PASS: Docker ownership, authenticated SAMURAI retrieval, and v1.1 release gate"
''',
              encoding="utf-8",
          )

          ci = Path(".github/workflows/ci.yml")
          ci_text = ci.read_text(encoding="utf-8")
          test_line = "          bash tests/test_runtime_release_config.sh\n"
          if test_line not in ci_text:
              marker = "          bash tests/test_qdnaseq_conda_compat.sh\n"
              if marker not in ci_text:
                  raise SystemExit("Could not find the focused-test block in CI")
              ci_text = ci_text.replace(marker, marker + test_line, 1)
          ci.write_text(ci_text, encoding="utf-8")

          containers = Path("docs/containers.md")
          containers_text = containers.read_text(encoding="utf-8")
          ownership_sentence = (
              "OncoTracer runs Docker processes with the current host UID and GID, so work and result files remain writable by the user who launched Nextflow.\n\n"
          )
          if ownership_sentence not in containers_text:
              heading = "# Execution environments\n\n"
              if heading in containers_text:
                  containers_text = containers_text.replace(heading, heading + ownership_sentence, 1)
              else:
                  containers_text = ownership_sentence + containers_text
          containers.write_text(containers_text, encoding="utf-8")
          PY

          chmod +x tests/test_runtime_release_config.sh
          bash -n tests/test_runtime_release_config.sh
          bash tests/test_runtime_release_config.sh
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path('.github/workflows/full-conda-quickstarts-v1.1.yml'),
              Path('.github/workflows/release-v1.1-after-conda-validation.yml'),
              Path('.github/workflows/ci.yml'),
          ):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'YAML OK: {path}')
          PY

      - name: Commit the fixes to PR 12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nextflow.config \
            .github/workflows/full-conda-quickstarts-v1.1.yml \
            .github/workflows/release-v1.1-after-conda-validation.yml \
            .github/workflows/ci.yml \
            tests/test_runtime_release_config.sh \
            docs/containers.md
          git commit -m "Fix Docker ownership and authenticated v1.1 validation"
          git push origin HEAD:agent/conda-docs-v1.1
