name: Scheduled v2.0.0 release validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scheduled-v2-release-validation.yml
      - .github/v2-release-controller.sh
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: oncotracer-v2-release-controller-macos
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute the fail-closed release controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/v2-release-controller.sh
