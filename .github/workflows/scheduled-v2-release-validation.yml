name: Scheduled v2.0.0 release validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scheduled-v2-release-validation.yml
      - .github/v2-release-controller.sh
  issue_comment:
    types:
      - created
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: oncotracer-v2-release-controller
  cancel-in-progress: true

jobs:
  orchestrate:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 29 && github.event.comment.body == '[oncotracer-release] run v2 controller')
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up controller Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute the fail-closed release controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i 's/\r$//' .github/v2-release-controller.sh
          mkdir -p /tmp/oncotracer-controller-bin /tmp/oncotracer-release-controller
          if ! command -v python3 >/dev/null 2>&1; then
            cat > /tmp/oncotracer-controller-bin/python3 <<'PY'
          #!/usr/bin/env bash
          exec python "$@"
          PY
            chmod +x /tmp/oncotracer-controller-bin/python3
          fi
          REAL_GH="$(command -v gh)"
          cat > /tmp/oncotracer-controller-bin/gh <<EOF
          #!/usr/bin/env bash
          if [[ "\$1" == pr && "\$2" == comment && "\$3" == 33 ]]; then
            shift 3
            exec "$REAL_GH" issue comment 29 "\$@"
          elif [[ "\$1" == pr && "\$2" == close && "\$3" == 33 ]]; then
            exit 0
          fi
          exec "$REAL_GH" "\$@"
          EOF
          chmod +x /tmp/oncotracer-controller-bin/gh
          export PATH="/tmp/oncotracer-controller-bin:$PATH"
          export RUNNER_TEMP=/tmp/oncotracer-release-controller
          bash .github/v2-release-controller.sh
