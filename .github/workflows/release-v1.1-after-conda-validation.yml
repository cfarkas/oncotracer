name: Release v1.1 after full runtime validation

on:
  workflow_run:
    workflows:
      - Full v1.1 QuickStart 1 across Docker, Poetry, and Conda
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Require current main and three successful runtime jobs
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail

          MAIN_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$VALIDATED_SHA" == "$MAIN_SHA" ]] || {
            echo "ERROR: validated commit $VALIDATED_SHA is not current main $MAIN_SHA" >&2
            exit 1
          }

          EXPECTED=(
            "docker / QuickStart 1"
            "poetry / QuickStart 1"
            "conda / QuickStart 1"
          )
          for job_name in "${EXPECTED[@]}"; do
            count="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "'"$job_name"'" and .status == "completed" and .conclusion == "success")] | length')"
            [[ "$count" -eq 1 ]] || {
              echo "ERROR: expected one successful validation job named: $job_name" >&2
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID/jobs?per_page=100" \
                --jq '.jobs[] | [.name, .status, .conclusion, .html_url] | @tsv' || true
              exit 1
            }
          done

          echo "Validated current main commit: $VALIDATED_SHA"
          echo "Validation run: $VALIDATION_RUN_ID"

      - name: Publish stable OncoTracer v1.1
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          if gh release view v1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force --tags origin
            TAG_SHA="$(git rev-list -n 1 v1.1)"
            [[ "$TAG_SHA" == "$VALIDATED_SHA" ]] || {
              echo "ERROR: existing v1.1 points to $TAG_SHA, not $VALIDATED_SHA" >&2
              exit 1
            }
            echo "Stable v1.1 is already published for this validated commit."
            exit 0
          fi

          cat > release-notes-v1.1.md <<EOF_NOTES
          # OncoTracer v1.1

          Stable research release validated on commit \`$VALIDATED_SHA\` with the complete public QuickStart Example 1 through all supported launch routes:

          - Nextflow with Docker
          - Poetry launcher with the Docker backend
          - Nextflow with Conda

          The validation completed the public Illumina \`ERR12341627\` and ONT \`DRR165691\` analyses, including SAMURAI, qDNAseq/ichorCNA, BAM refinement, CNA tables, plots, workflow summaries, BAM checks, and the repository output verifier.

          v1.1 also adds first-class Poetry and Conda instructions, automatic host UID:GID mapping for Docker work directories, and an atomic pinned SAMURAI source cache that avoids unauthenticated GitHub API rate limits.

          OncoTracer is for research use and is not a standalone diagnostic system.
          EOF_NOTES

          gh release create v1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_SHA" \
            --title "OncoTracer v1.1" \
            --notes-file release-notes-v1.1.md

          gh release view v1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,publishedAt,url
