name: Release v1.1 after full runtime validation

on:
  workflow_run:
    workflows:
      - Full v1.1 QuickStarts across Docker, Poetry, and Conda
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Confirm that the validated commit is current main
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"

          if [[ "$VALIDATED_SHA" != "$MAIN_SHA" ]]; then
            echo "ERROR: validated commit $VALIDATED_SHA is not current main $MAIN_SHA" >&2
            exit 1
          fi

          echo "Validated current main commit: $VALIDATED_SHA"

      - name: Publish stable OncoTracer v1.1
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          if gh release view v1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force --tags origin
            TAG_SHA="$(git rev-list -n 1 v1.1)"
            if [[ "$TAG_SHA" != "$VALIDATED_SHA" ]]; then
              echo "ERROR: existing v1.1 points to $TAG_SHA, not validated main commit $VALIDATED_SHA" >&2
              exit 1
            fi

            echo "Stable v1.1 is already published for this validated commit."
            gh release view v1.1 \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,name,isDraft,isPrerelease,targetCommitish,publishedAt,url
            exit 0
          fi

          cat > release-notes-v1.1.md <<EOF_NOTES
          # OncoTracer v1.1

          Stable research release adding first-class Conda execution and a Poetry-managed launcher while retaining Docker and Singularity/Apptainer support.

          Validated on commit \`$VALIDATED_SHA\` with both public QuickStarts across the release routes:

          - Docker: QuickStart 1 and the three-library HCC1143 QuickStart 2.
          - Poetry with the Docker backend: QuickStart 1 and QuickStart 2.
          - Conda: QuickStart 1 and QuickStart 2, with Nextflow creating and reusing the required environments.

          The validation includes public-read integrity checks, Automatic Setup, SAMURAI, qDNAseq/ichorCNA, BAM refinement, CNA tables, plots, summaries, and the repository output verifiers.

          OncoTracer is for research use and is not a standalone diagnostic system.
          EOF_NOTES

          gh release create v1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_SHA" \
            --title "OncoTracer v1.1" \
            --notes-file release-notes-v1.1.md

          gh release view v1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,publishedAt,url
