name: Release v1.1 after Conda validation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the current main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require successful full Conda validation for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          SHA="$GITHUB_SHA"

          MATCHES="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Full Conda QuickStarts for v1.1" and .status == "completed" and .conclusion == "success" and .head_sha == "'"$SHA"'")] | length')"

          if [[ "$MATCHES" -lt 1 ]]; then
            echo "ERROR: no successful full Conda QuickStart validation exists for exact main commit $SHA" >&2
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | [.name, .event, .status, .conclusion, .head_branch, .head_sha, .html_url] | @tsv' || true
            exit 1
          fi

          echo "Found $MATCHES successful full Conda validation run(s) for $SHA."

      - name: Publish stable OncoTracer v1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          SHA="$GITHUB_SHA"

          if gh release view v1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force --tags origin
            TAG_SHA="$(git rev-list -n 1 v1.1)"
            if [[ "$TAG_SHA" != "$SHA" ]]; then
              echo "ERROR: existing v1.1 points to $TAG_SHA, not validated main commit $SHA" >&2
              exit 1
            fi

            echo "Stable v1.1 is already published for this validated commit."
            gh release view v1.1 \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,name,isDraft,isPrerelease,targetCommitish,publishedAt,url
            exit 0
          fi

          cat > release-notes-v1.1.md <<EOF_NOTES
          # OncoTracer v1.1

          Stable research release adding first-class Conda execution and clearer normal-control examples.

          Validated on commit \`$SHA\` with both public QuickStarts using \`--conda\`:

          - QuickStart Example 1: public Illumina \`ERR12341627\` and ONT \`DRR165691\`, including SAMURAI, qDNAseq/ichorCNA, BAM refinement, CNA tables, plots, summaries, and the repository verifier.
          - QuickStart Example 2: all three paired HCC1143 libraries, including Automatic Setup, three BAMs, qDNAseq segments, BAM refinement, CNA tables, plots, and summary checks.

          With \`--conda\`, Nextflow creates and reuses the required environments automatically. Docker and Singularity/Apptainer remain supported execution options.

          OncoTracer is for research use and is not a standalone diagnostic system.
          EOF_NOTES

          gh release create v1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "OncoTracer v1.1" \
            --notes-file release-notes-v1.1.md

          gh release view v1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,publishedAt,url
