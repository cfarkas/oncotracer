[tool.poetry]
name = "oncotracer"
version = "1.1.0"
description = "Poetry-managed launcher for the OncoTracer Nextflow workflow"
authors = ["OncoTracer developers"]
readme = "README.md"
license = "MIT"
packages = [{ include = "oncotracer_cli" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"

[tool.poetry.scripts]
oncotracer = "oncotracer_cli.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
