<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Native OncoTracer QuickStart from an analyses directory to checked results</title>
  <desc id="desc">Six-step beginner flow. Choose an analysis directory, download and checksum public reads, use ordinary setup and check commands, run the Illumina and Oxford Nanopore configurations, and read the results. Reusing prepared genome indexes is optional.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker>
  </defs>
  <style>
    .h1{font:700 34px system-ui,sans-serif;fill:#f8fafc}.lead{font:18px system-ui,sans-serif;fill:#cbd5e1}
    .lane{font:700 14px system-ui,sans-serif;fill:#0f766e;letter-spacing:.12em}.num{font:700 18px system-ui,sans-serif;fill:#fff}
    .card-title{font:700 22px system-ui,sans-serif;fill:#0f172a}.body{font:16px system-ui,sans-serif;fill:#475569}.code{font:14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0}.code-sm{font:12.5px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0}
    .file{font:14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#334155}.small{font:14px system-ui,sans-serif;fill:#64748b}.banner{font:700 18px system-ui,sans-serif;fill:#115e59}
  </style>
  <rect width="1400" height="780" fill="#f1f5f9"/>
  <rect width="1400" height="116" fill="url(#header)"/>
  <text class="h1" x="54" y="49">QuickStart: what the native OncoTracer CLI does, step by step</text>
  <text class="lead" x="54" y="82">Begin in a chosen analyses folder. Preparation creates saved run plans; execution performs and checks the CNA analyses.</text>

  <text class="lane" x="54" y="151">PREPARE — NO CNA ANALYSIS YET</text>
  <line x1="54" y1="165" x2="1346" y2="165" stroke="#99f6e4" stroke-width="3"/>

  <g filter="url(#shadow)"><rect x="54" y="188" width="372" height="190" rx="16" fill="#fff"/></g>
  <circle cx="91" cy="226" r="22" fill="#0f766e"/><text class="num" x="85" y="233">1</text>
  <text class="card-title" x="126" y="232">Choose an analyses folder</text>
  <rect x="78" y="258" width="324" height="68" rx="9" fill="#111827"/>
  <text class="code-sm" x="92" y="283">cd /path/to/my/analyses_dir/</text>
  <text class="code-sm" x="92" y="308">Use this directory in every step.</text>
  <text class="small" x="78" y="352">Downloads, YAML files, and results stay together.</text>

  <path d="M438 283 H478" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="492" y="188" width="372" height="190" rx="16" fill="#fff"/></g>
  <circle cx="529" cy="226" r="22" fill="#0f766e"/><text class="num" x="523" y="233">2</text>
  <text class="card-title" x="564" y="232">Download + check reads</text>
  <rect x="516" y="252" width="324" height="68" rx="9" fill="#111827"/>
  <text class="code-sm" x="531" y="278">curl — URLs and output paths in guide</text>
  <text class="code-sm" x="531" y="304">md5sum -c — all files must say OK</text>
  <text class="body" x="516" y="344">One Illumina pair and one ONT library.</text>
  <text class="small" x="516" y="366">Download only; no analysis starts yet.</text>

  <path d="M876 283 H916" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="930" y="188" width="416" height="190" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/></g>
  <circle cx="967" cy="226" r="22" fill="#d97706"/><text class="num" x="961" y="233">3</text>
  <text class="card-title" x="1002" y="232">Set up + check</text>
  <rect x="954" y="250" width="368" height="86" rx="9" fill="#fff" stroke="#fbbf24"/>
  <text class="file" x="972" y="276">oncotracer setup --project PATH ...</text>
  <text class="file" x="972" y="301">oncotracer check --config FILE</text>
  <text class="file" x="972" y="326">Each project has config/run.yml.</text>
  <text class="small" x="954" y="360">Optional: reuse indexes with --reference-root.</text>

  <path d="M1138 390 V420" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="lane" x="54" y="441">RUN AND REVIEW — ONCOTRACER READS THE SAVED YAML</text>
  <line x1="54" y1="455" x2="1346" y2="455" stroke="#99f6e4" stroke-width="3"/>

  <g filter="url(#shadow)"><rect x="54" y="478" width="372" height="174" rx="16" fill="#fff"/></g>
  <circle cx="91" cy="516" r="22" fill="#0f766e"/><text class="num" x="85" y="523">4</text>
  <text class="card-title" x="126" y="522">Run Illumina</text>
  <text class="body" x="78" y="554">The native CLI reads the Illumina YAML.</text>
  <rect x="78" y="570" width="324" height="58" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="file" x="94" y="594">oncotracer run --config</text>
  <text class="file" x="94" y="616">.../illumina/config/run.yml</text>

  <path d="M438 564 H478" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="492" y="478" width="372" height="174" rx="16" fill="#fff"/></g>
  <circle cx="529" cy="516" r="22" fill="#0f766e"/><text class="num" x="523" y="523">5</text>
  <text class="card-title" x="564" y="522">Run ONT</text>
  <text class="body" x="516" y="552">After Illumina finishes, run the ONT</text>
  <text class="body" x="516" y="575">YAML through the same native CLI.</text>
  <rect x="516" y="588" width="324" height="42" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text class="file" x="533" y="614">.../ont/config/run.yml</text>

  <path d="M876 564 H916" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="930" y="478" width="416" height="174" rx="16" fill="#fff"/></g>
  <circle cx="967" cy="516" r="22" fill="#0f766e"/><text class="num" x="961" y="523">6</text>
  <text class="card-title" x="1002" y="522">Confirm + open results</text>
  <line x1="965" y1="590" x2="1307" y2="590" stroke="#334155" stroke-width="2"/>
  <rect x="1000" y="590" width="66" height="22" fill="#2563eb"/><rect x="1120" y="566" width="82" height="24" fill="#ef4444"/><rect x="1250" y="590" width="35" height="15" fill="#2563eb"/>
  <text class="small" x="954" y="550">Open summaries, CNA tables, traces, and plots.</text>

  <rect x="54" y="690" width="1292" height="58" rx="14" fill="#ccfbf1"/>
  <circle cx="88" cy="719" r="15" fill="#0f766e"/><path d="M81 719l5 5 11-13" fill="none" stroke="#fff" stroke-width="3"/>
  <text class="banner" x="116" y="725">Repeat the same command to resume: the native ledger reuses valid completed stages automatically.</text>
</svg>
