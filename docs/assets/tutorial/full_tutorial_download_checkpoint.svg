<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Completed native PRJNA754199 download checkpoint</title>
  <desc id="desc">Beginner terminal-style checkpoint. The user first enters an explicit analyses directory, defines the tutorial root below that directory, runs the Step 2 Python download and validation block, and receives a successful summary for 12 unique single-end PRJNA754199 runs.</desc>
  <defs><linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#134e4a"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".18"/></filter></defs>
  <style>.h1{font:700 32px system-ui,sans-serif;fill:#f8fafc}.lead{font:18px system-ui,sans-serif;fill:#cbd5e1}.term{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0}.prompt{fill:#5eead4}.success{fill:#86efac;font-weight:700}.label{font:700 15px system-ui,sans-serif;fill:#0f766e;letter-spacing:.08em}.body{font:17px system-ui,sans-serif;fill:#334155}.num{font:700 28px system-ui,sans-serif;fill:#0f172a}.small{font:15px system-ui,sans-serif;fill:#64748b}</style>
  <rect width="1400" height="650" fill="#f1f5f9"/><rect width="1400" height="112" fill="url(#header)"/><text class="h1" x="54" y="47">Checkpoint: all 12 public FASTQs are ready</text><text class="lead" x="54" y="79">Start in your analyses directory. If validation stops early, repeat the same Step 2 block.</text>
  <g filter="url(#shadow)"><rect x="54" y="145" width="935" height="440" rx="15" fill="#0b1220"/></g><rect x="54" y="145" width="935" height="440" rx="15" fill="#0b1220"/><rect x="54" y="145" width="935" height="48" rx="15" fill="#1e293b"/><rect x="54" y="178" width="935" height="15" fill="#1e293b"/><circle cx="83" cy="169" r="7" fill="#fb7185"/><circle cx="107" cy="169" r="7" fill="#fbbf24"/><circle cx="131" cy="169" r="7" fill="#4ade80"/><text x="417" y="176" font-family="system-ui,sans-serif" font-size="15" fill="#cbd5e1">student — Terminal</text>
  <text class="term prompt" x="82" y="224">student@workstation:~$</text><text class="term" x="287" y="224">cd /path/to/my/analyses_dir/</text>
  <text class="term prompt" x="82" y="256">student@workstation:~/analyses$</text><text class="term" x="390" y="256">TUTORIAL_ROOT="$PWD/oncotracer-prjna754199"</text>
  <text class="term prompt" x="82" y="288">student@workstation:~/analyses$</text><text class="term" x="390" y="288">python3 - ...  # complete Step 2 block</text>
  <text class="term success" x="82" y="329">Manifest validated: 12 unique single-end runs; 6,171,900,300 compressed bytes</text>
  <text class="term success" x="82" y="370">Twelve validated public single-end FASTQs are ready:</text>
  <text class="term" x="104" y="406">reads:      .../oncotracer-prjna754199/input/fastq</text><text class="term" x="104" y="440">metadata:   .../oncotracer-prjna754199/input/fastq/samples.csv</text><text class="term" x="104" y="474">download:   6,171,900,300 bytes (about 5.75 GiB)</text><text class="term" x="104" y="508">read count: 266,097,582 reads (all archive files are 36 bp)</text>
  <text x="82" y="550" font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8">The complete copy/paste command is in Step 2 of the native tutorial.</text>
  <g filter="url(#shadow)"><rect x="1025" y="145" width="321" height="440" rx="15" fill="#fff"/></g><text class="label" x="1053" y="188">YOU CAN CONTINUE WHEN</text>
  <circle cx="1100" cy="251" r="33" fill="#dcfce7"/><path d="M1084 251l11 11 22-27" fill="none" stroke="#16a34a" stroke-width="6"/><text class="num" x="1150" y="260">12 files</text><text class="small" x="1053" y="310">Each file passed:</text>
  <circle cx="1065" cy="344" r="7" fill="#16a34a"/><text class="body" x="1083" y="350">expected size</text><circle cx="1065" cy="382" r="7" fill="#16a34a"/><text class="body" x="1083" y="388">MD5 checksum</text><circle cx="1065" cy="420" r="7" fill="#16a34a"/><text class="body" x="1083" y="426">readable gzip</text>
  <rect x="1053" y="474" width="265" height="72" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text class="body" x="1073" y="503">Next: oncotracer auto</text><text class="small" x="1073" y="528">No CNA analysis has started.</text>
</svg>
