<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Successful native PRJNA754199 output verification</title>
  <desc id="desc">Terminal-style beginner checkpoint showing the user entering an explicit analyses directory, defining the native result directory, running the Step 6 verification block, and seeing the success message that the complete PRJNA754199 native tutorial outputs are present.</desc>
  <defs><linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#134e4a"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".18"/></filter></defs>
  <style>.h1{font:700 32px system-ui,sans-serif;fill:#f8fafc}.lead{font:18px system-ui,sans-serif;fill:#cbd5e1}.term{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0}.prompt{fill:#5eead4}.success{fill:#86efac;font-weight:700}.label{font:700 15px system-ui,sans-serif;fill:#0f766e;letter-spacing:.08em}.body{font:17px system-ui,sans-serif;fill:#334155}</style>
  <rect width="1400" height="520" fill="#f1f5f9"/><rect width="1400" height="112" fill="url(#header)"/><text class="h1" x="54" y="47">Checkpoint: verify before interpreting results</text><text class="lead" x="54" y="79">Continue to the gallery only after the native Step 6 verifier prints the green success message.</text>
  <g filter="url(#shadow)"><rect x="54" y="145" width="900" height="310" rx="15" fill="#0b1220"/></g><rect x="54" y="145" width="900" height="310" rx="15" fill="#0b1220"/><rect x="54" y="145" width="900" height="48" rx="15" fill="#1e293b"/><rect x="54" y="178" width="900" height="15" fill="#1e293b"/><circle cx="83" cy="169" r="7" fill="#fb7185"/><circle cx="107" cy="169" r="7" fill="#fbbf24"/><circle cx="131" cy="169" r="7" fill="#4ade80"/><text x="392" y="176" font-family="system-ui,sans-serif" font-size="15" fill="#cbd5e1">student — Terminal</text>
  <text class="term prompt" x="82" y="224">student@workstation:~$</text><text class="term" x="287" y="224">cd /path/to/my/analyses_dir/</text>
  <text class="term prompt" x="82" y="256">student@workstation:~/analyses$</text><text class="term" x="390" y="256">OUTDIR="$PWD/oncotracer-prjna754199/results"</text>
  <text class="term prompt" x="82" y="288">student@workstation:~/analyses$</text><text class="term" x="390" y="288">python3 - "$OUTDIR"  # Step 6 block</text>
  <rect x="82" y="329" width="844" height="84" rx="10" fill="#123527" stroke="#4ade80"/><circle cx="111" cy="371" r="16" fill="#16a34a"/><path d="M103 371l6 6 12-15" fill="none" stroke="#fff" stroke-width="3"/><text class="term success" x="140" y="365">SUCCESS: complete PRJNA754199 native tutorial</text><text class="term success" x="140" y="391">outputs are present.</text>
  <g filter="url(#shadow)"><rect x="990" y="145" width="356" height="310" rx="15" fill="#fff"/></g><text class="label" x="1018" y="188">THE VERIFIER FOUND</text>
  <circle cx="1032" cy="232" r="11" fill="#16a34a"/><path d="M1027 232l4 4 8-10" fill="none" stroke="#fff" stroke-width="2"/><text class="body" x="1054" y="238">native workflow summaries</text>
  <circle cx="1032" cy="274" r="11" fill="#16a34a"/><path d="M1027 274l4 4 8-10" fill="none" stroke="#fff" stroke-width="2"/><text class="body" x="1054" y="280">CNA events + notation</text>
  <circle cx="1032" cy="316" r="11" fill="#16a34a"/><path d="M1027 316l4 4 8-10" fill="none" stroke="#fff" stroke-width="2"/><text class="body" x="1054" y="322">plots + native run manifest</text>
  <circle cx="1032" cy="358" r="11" fill="#16a34a"/><path d="M1027 358l4 4 8-10" fill="none" stroke="#fff" stroke-width="2"/><text class="body" x="1054" y="364">trace.tsv + state.json</text>
  <rect x="1018" y="391" width="300" height="39" rx="9" fill="#ecfdf5"/><text x="1036" y="416" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#166534">Ready to review the results.</text>
</svg>
