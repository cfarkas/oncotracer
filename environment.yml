name: oncotracer
channels:
  - conda-forge
  - bioconda
dependencies:
  # Workflow launcher and host-side sequence tools.
  - nextflow=26.04.2
  - openjdk=17
  - samtools
  - bwa
  - minimap2
  - pigz
  - qpdf
  - procps-ng
  - git
  - curl
  - wget
  - unzip

  # Python tools used by OncoTracer and container-only SAMURAI helper modules
  # when the nested workflow is executed with its Conda profile.
  - python=3.11
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.10
  - pysam
  - openpyxl>=3.1
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - jinja2>=3.1
  - requests>=2.31
  - reportlab>=4.0
  - pypdf>=4.0
  - polars
  - typer
  - typing_extensions
  - pandera
  - pyjanitor
  - natsort

  # R/qDNAseq and plotting tools required by SAMURAI modules that provide a
  # container image but no module-level Conda recipe in SAMURAI v1.4.0.
  - r-base=4.1
  - bioconductor-qdnaseq=1.30.0
  - bioconductor-biobase
  - r-argparser
  - r-future
  - r-r.cache
  - r-readr
  - r-dplyr
  - r-ggplot2
  - r-scales
  - r-yaml

  - pip
  - pip:
      - transformers>=4.42
      - torch>=2.2
      - safetensors>=0.4
      - huggingface_hub>=0.23
