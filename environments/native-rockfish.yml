# Optional isolated runtime. Model/source provisioning: oncotracer prepare-rockfish.
name: oncotracer-v5-rockfish
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - cxx-compiler
  - make
  - zlib
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.6.0+cpu
      - torchvision==0.21.0+cpu
      - torchaudio==2.6.0+cpu
      - numpy==1.26.4
      - pysam==0.22.1
      - pod5==0.3.23
      - lightning==2.5.1
      - pytorch-lightning==2.5.1
      - jsonargparse[signatures]==4.38.0
      - mappy==2.28
      - ont-fast5-api==4.1.3
      - gdown==5.2.0
      - polars==0.19.19
      - wandb==0.19.9
      - einops==0.8.1
      - torchmetrics==1.9.0
      - setuptools==75.8.2
