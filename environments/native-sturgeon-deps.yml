# Dependencies only. Sturgeon software/model are privately prepared after consent.
# Python 3.9 is required by the pinned upstream 0.5.1 interface.
name: oncotracer-v6-sturgeon-deps
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9
  - pip
  - hatchling
  - numpy=1.26.4
  - pandas=1.5.3
  - matplotlib-base=3.5.1
  - onnxruntime=1.12.1
  - pysam=0.19.0
  - pip:
      - modbampy==0.6.3
