# Minimal ONT YAML example.
# Replace /path/to/my/directory/oncotracer with the absolute path used
# for REPO_DIR. Keep every input and output below lpwgs_root.
mode: ont
lpwgs_root: /path/to/my/directory/oncotracer/project
outdir: /path/to/my/directory/oncotracer/project/results/my_first_ont_run
ont_folder: /path/to/my/directory/oncotracer/project/input/fastq_pass
ont_barcodes: barcode01
ont_sample_names: Sample_ONT_1
ont_analysis_type: liquid_biopsy
ont_caller: ichorcna
ont_binsize_kb: 500
ont_min_age_minutes: 0
run_cna_classifier: false
force: false
