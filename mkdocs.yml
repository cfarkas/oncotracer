site_name: OncoTracer
site_description: Native auditable LP-WGS CNA analysis for ONT and Illumina data
site_author: OncoTracer developers
site_url: https://cfarkas.github.io/oncotracer/
repo_name: cfarkas/oncotracer
repo_url: https://github.com/cfarkas/oncotracer
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/oncotracer.css

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.action.edit
    - navigation.tabs
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - Install Requirements: installation.md
      - Poetry Launcher: poetry.md
      - QuickStart 1 — Illumina + ONT: quick_start.md
      - Automatic Setup for Your FASTQs: auto_params.md
      - QuickStart 2 — HCC1143: public_cohort.md
      - Input Files and Folder Layouts: inputs.md
      - Manual YAML Editing: configuration/yaml_basics.md
  - Full Tutorial:
      - Complete PRJNA754199 archive: full_tutorial.md
  - Other Example Runs:
      - Mock cohort — six tumors + four normals: six_tumor_four_control.md
  - Run and Configure:
      - Choose a Configuration Route: configuration.md
      - Native Workflow Overview: running.md
      - Canonical Native YAML: configuration_v2.md
      - Illumina Setup: configuration/illumina.md
      - ONT Setup: configuration/ont.md
      - Optional ONT Methylation: configuration/methylation.md
      - Pathology and Classifier: configuration/pathology.md
      - Advanced Refinement: configuration/refinement.md
      - All Parameters: configuration/parameter_reference.md
      - Execution Environments: containers.md
      - Programs and Provenance: programs.md
  - Understand Results:
      - Output Files: outputs.md
      - Models and Pathology: models_pathology.md
      - Results Gallery: gallery.md
  - Assurance and Migration:
      - Native architecture: native_architecture.md
      - Parity and release gate: parity_release.md
      - Migration from v1.1: migration_v1_to_v2.md
      - Legacy v1.1: legacy_v1.md
  - Help and About:
      - Troubleshooting: troubleshooting.md
      - Citation and Research Use: citation_research_use.md
      - Developer Guide: developer_guide.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
