site_name: OncoTracer
site_description: Native auditable LP-WGS CNA analysis for ONT and Illumina data
site_author: OncoTracer developers
site_url: https://cfarkas.github.io/oncotracer/
repo_name: cfarkas/oncotracer
repo_url: https://github.com/cfarkas/oncotracer
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/oncotracer.css

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - content.action.edit
    - navigation.tabs
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - Install — Conda or Docker: installation.md
      - Interactive Browser Demo: browser_demo.md
      - Set Up Your Own Data: setup.md
      - Run, Stop and Resume: running.md
      - How OncoTracer Works: native_architecture.md
      - Uninstall: uninstall.md
  - Tutorials:
      - QuickStart 1 — Illumina + ONT: quick_start.md
      - QuickStart 2 — HCC1143: public_cohort.md
      - Complete PRJNA754199 archive: full_tutorial.md
      - Mock cohort — six tumors + four independent normals: six_tumor_four_normal.md
  - Analyses and Results:
      - Small-Variant Calling: variants.md
      - ANNOVAR Annotation: annovar.md
      - ONT Methylation: configuration/methylation.md
      - LLM-Assisted Reports: llm_reports.md
      - Manuscript Figures: paper_report.md
      - Output Files: outputs.md
      - Results Gallery: gallery.md
      - Models and Pathology: models_pathology.md
      - CNA Evidence and Uncertainty: cna_evidence_assessment.md
  - Reference:
      - Input preparation:
          - Copy Commands and Create Tables: command_basics.md
          - Input Files and Folder Layouts: inputs.md
          - Batch Setup — Many FASTQs: auto_params.md
          - Genome Indexes: reference_indexes.md
      - Configuration:
          - Choose a Configuration Route: configuration.md
          - Manual YAML Editing: configuration/yaml_basics.md
          - Illumina Setup: configuration/illumina.md
          - ONT Setup: configuration/ont.md
          - Methylation Resource Reference: configuration/methylation_reference.md
          - Pathology and Classifier: configuration/pathology.md
          - Advanced Refinement: configuration/refinement.md
          - Canonical Native YAML: configuration_v2.md
          - All Parameters: configuration/parameter_reference.md
      - Execution:
          - Detailed Execution Reference: running_details.md
          - Variant Examples and Reference: variants_reference.md
          - Execution Environments: containers.md
          - Advanced Installation: installation_details.md
          - Programs and Provenance: programs.md
  - Help and Development:
      - Troubleshooting: troubleshooting.md
      - Repository Map: repository_guide.md
      - Citation and Research Use: citation_research_use.md
      - Developer Guide: developer_guide.md
      - Poetry Development Install: poetry.md
      - Implementation Details: architecture_details.md
      - Parity and release gate: parity_release.md

markdown_extensions:
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
