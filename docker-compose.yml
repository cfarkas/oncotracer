services:
  oncotracer:
    image: ghcr.io/cfarkas/oncotracer:2.0.0
    volumes:
      # Set ONCOTRACER_PROJECT_DIR to the host project directory. Inside this
      # direct-container example, YAML paths must point below /project.
      - ${ONCOTRACER_PROJECT_DIR:-./project}:/project
    working_dir: /project
    entrypoint: ["oncotracer"]
    command: ["--help"]
